const BANK=[{"unit": "電流", "q": "電流の大きさを表す単位は？", "choices": ["A（アンペア）", "V（ボルト）", "Ω（オーム）"], "correct": 0, "explanation": "電流はA（アンペア）で表す。"}, {"unit": "電流", "q": "電流を測る器具は？", "choices": ["電圧計", "電流計", "温度計"], "correct": 1, "explanation": "電流計は、電流の大きさを測る。"}, {"unit": "電流", "q": "電流計は回路にどうつなぐ？", "choices": ["直列につなぐ", "並列につなぐ", "回路の外につなぐ"], "correct": 0, "explanation": "測りたい部分と直列につなぐ。"}, {"unit": "電流", "q": "500mAは何A？", "choices": ["0.5A", "5A", "50A"], "correct": 0, "explanation": "1000mA＝1A。500mA＝0.5A。"}, {"unit": "電流", "q": "2Aは何mA？", "choices": ["20mA", "200mA", "2000mA"], "correct": 2, "explanation": "1A＝1000mAなので2A＝2000mA。"}, {"unit": "電流", "q": "電流は回路のどんな状態で流れる？", "choices": ["回路がつながっているとき", "スイッチが切れているとき", "導線が切れているとき"], "correct": 0, "explanation": "電流が流れるには回路が閉じている必要がある。"}, {"unit": "電流", "q": "乾電池につないだ回路で、電流の向きは約束上どちら？", "choices": ["−極から＋極", "＋極から−極", "向きは決めない"], "correct": 1, "explanation": "電流の向きは＋極から−極と約束している。"}, {"unit": "電流", "q": "直列回路の電流は、どの位置で測ってもどうなる？", "choices": ["同じ", "電池の近くほど大きい", "後ろほど小さい"], "correct": 0, "explanation": "直列回路では、流れる電流はどの部分も同じ。"}, {"unit": "電流", "q": "並列回路の枝分かれ前の電流は？", "choices": ["枝の電流の合計", "枝のうち大きい方", "枝の電流の差"], "correct": 0, "explanation": "分かれる前の電流＝各枝の電流の和。"}, {"unit": "電流", "q": "並列回路で0.2Aと0.3Aに分かれた。合流した電流は？", "choices": ["0.1A", "0.5A", "0.6A"], "correct": 1, "explanation": "0.2＋0.3＝0.5A。"}, {"unit": "電流", "q": "直列回路の途中で0.4Aだった。別の場所では？", "choices": ["0.2A", "0.4A", "0.8A"], "correct": 1, "explanation": "直列回路の電流はどこでも同じ。"}, {"unit": "電流", "q": "電流計をつなぐとき、初めに選ぶ端子は？", "choices": ["最も小さい測定範囲", "最も大きい測定範囲", "どれでも同じ"], "correct": 1, "explanation": "針が振り切れないように、まず大きい測定範囲から始める。"}, {"unit": "電流", "q": "電流計の＋端子は、電源のどちら側につなぐ？", "choices": ["＋極側", "−極側", "関係ない"], "correct": 0, "explanation": "電流が＋端子から入る向きに接続する。"}, {"unit": "電流", "q": "枝分かれした電流が0.6Aと0.4A。全体の電流は？", "choices": ["0.2A", "1.0A", "2.4A"], "correct": 1, "explanation": "枝分かれ前は各枝の電流の和で1.0A。"}, {"unit": "電流", "q": "豆電球に電流を流すと明かりがつく。電流が通るのは？", "choices": ["フィラメントなどの導体", "ガラスだけ", "空気だけ"], "correct": 0, "explanation": "電球内の電気を通す部分に電流が流れる。"}, {"unit": "電圧", "q": "電圧の大きさを表す単位は？", "choices": ["A", "Ω", "V"], "correct": 2, "explanation": "電圧はV（ボルト）で表す。"}, {"unit": "電圧", "q": "電圧を測る器具は？", "choices": ["電圧計", "電流計", "はかり"], "correct": 0, "explanation": "電圧計は電圧を測る。"}, {"unit": "電圧", "q": "電圧計のつなぎ方は？", "choices": ["測る部分に並列", "測る部分に直列", "電源を外す"], "correct": 0, "explanation": "電圧計は測る部分の両端に並列につなぐ。"}, {"unit": "電圧", "q": "直列回路の各抵抗にかかる電圧の合計は？", "choices": ["電源の電圧と同じ", "常に0V", "電源の半分"], "correct": 0, "explanation": "直列では各部分にかかる電圧の和が電源の電圧。"}, {"unit": "電圧", "q": "並列回路の各枝にかかる電圧は？", "choices": ["どちらも電源と同じ", "枝が増えると必ず半分", "必ず0V"], "correct": 0, "explanation": "並列では各枝の電圧が電源電圧に等しい。"}, {"unit": "電圧", "q": "3Vと2Vの電圧が直列に分かれた。全体は？", "choices": ["1V", "5V", "6V"], "correct": 1, "explanation": "3＋2＝5V。"}, {"unit": "電圧", "q": "電源が6Vの並列回路。各枝の電圧は？", "choices": ["3V", "6V", "12V"], "correct": 1, "explanation": "並列につないだ各枝には6Vかかる。"}, {"unit": "電圧", "q": "直列回路で電源9V、片方が4V。もう片方は？", "choices": ["5V", "9V", "13V"], "correct": 0, "explanation": "9−4＝5V。"}, {"unit": "電圧", "q": "直列回路で、2つの抵抗に3Vと3Vがかかる。電源は？", "choices": ["3V", "6V", "9V"], "correct": 1, "explanation": "各部分の電圧の和が電源電圧なので6V。"}, {"unit": "電圧", "q": "電圧計の目盛りを読むとき、まず確認するのは？", "choices": ["使った端子の測定範囲", "電流計の色", "導線の長さ"], "correct": 0, "explanation": "測定範囲に合う目盛りを読む。"}, {"unit": "電圧", "q": "電源の電圧を大きくして、抵抗を変えないと電流は？", "choices": ["大きくなる", "小さくなる", "必ず0になる"], "correct": 0, "explanation": "オームの法則より、抵抗一定なら電圧に比例して電流が増える。"}, {"unit": "電圧", "q": "電圧の説明として正しいのは？", "choices": ["電流を流そうとするはたらきの大きさ", "抵抗の単位", "導線の長さ"], "correct": 0, "explanation": "電圧は電流を流そうとするはたらきの大きさを表す。"}, {"unit": "電圧", "q": "並列回路で枝Aが4V。電源電圧は？", "choices": ["2V", "4V", "8V"], "correct": 1, "explanation": "並列回路では枝にかかる電圧は電源電圧と同じ。"}, {"unit": "電圧", "q": "直列回路で電源12V、抵抗Aは7V。抵抗Bは？", "choices": ["5V", "7V", "19V"], "correct": 0, "explanation": "12−7＝5V。"}, {"unit": "電圧", "q": "電圧計をつなぐときの注意として正しいのは？", "choices": ["測りたい部分の両端につなぐ", "必ず導線を切って直列につなぐ", "電流計の代わりに直列にする"], "correct": 0, "explanation": "電圧計は測りたい部分に並列でつなぐ。"}, {"unit": "抵抗", "q": "電気抵抗の単位は？", "choices": ["A", "Ω", "V"], "correct": 1, "explanation": "抵抗はΩ（オーム）で表す。"}, {"unit": "抵抗", "q": "電気抵抗の役割として近いものは？", "choices": ["電流の流れにくさを表す", "電流の速さだけを表す", "電圧計の別名"], "correct": 0, "explanation": "電気抵抗は電流の流れにくさを表す。"}, {"unit": "抵抗", "q": "オームの法則を表す式は？", "choices": ["電圧＝電流×抵抗", "抵抗＝電圧×電流", "電流＝電圧×抵抗"], "correct": 0, "explanation": "V＝I×R。"}, {"unit": "抵抗", "q": "電圧6V、電流2A。抵抗は？", "choices": ["3Ω", "8Ω", "12Ω"], "correct": 0, "explanation": "R＝V÷I＝6÷2＝3Ω。"}, {"unit": "抵抗", "q": "電圧12V、抵抗4Ω。電流は？", "choices": ["3A", "8A", "48A"], "correct": 0, "explanation": "I＝V÷R＝12÷4＝3A。"}, {"unit": "抵抗", "q": "電流0.5A、抵抗10Ω。電圧は？", "choices": ["0.05V", "5V", "20V"], "correct": 1, "explanation": "V＝I×R＝0.5×10＝5V。"}, {"unit": "抵抗", "q": "電圧3V、電流0.3A。抵抗は？", "choices": ["0.1Ω", "10Ω", "100Ω"], "correct": 1, "explanation": "R＝3÷0.3＝10Ω。"}, {"unit": "抵抗", "q": "電圧9V、抵抗3Ω。電流は？", "choices": ["3A", "6A", "27A"], "correct": 0, "explanation": "9÷3＝3A。"}, {"unit": "抵抗", "q": "電流2A、抵抗5Ω。電圧は？", "choices": ["2.5V", "7V", "10V"], "correct": 2, "explanation": "2×5＝10V。"}, {"unit": "抵抗", "q": "電圧6V、電流0.2A。抵抗は？", "choices": ["1.2Ω", "30Ω", "60Ω"], "correct": 1, "explanation": "6÷0.2＝30Ω。"}, {"unit": "抵抗", "q": "抵抗が同じなら、電圧を2倍にしたとき電流は？", "choices": ["2倍", "半分", "変わらない"], "correct": 0, "explanation": "抵抗が一定なら電流は電圧に比例する。"}, {"unit": "抵抗", "q": "電圧が同じなら、抵抗を2倍にしたとき電流は？", "choices": ["2倍", "半分", "4倍"], "correct": 1, "explanation": "I＝V÷Rより、抵抗が2倍なら電流は半分。"}, {"unit": "抵抗", "q": "4Ωと6Ωを直列につなぐ。全体の抵抗は？", "choices": ["2Ω", "10Ω", "24Ω"], "correct": 1, "explanation": "直列回路の合成抵抗＝4＋6＝10Ω。"}, {"unit": "抵抗", "q": "2Ωと3Ωを直列につなぐ。全体の抵抗は？", "choices": ["1Ω", "5Ω", "6Ω"], "correct": 1, "explanation": "直列回路の抵抗は足し算する。"}, {"unit": "抵抗", "q": "同じ10Ωの抵抗を2つ並列につなぐ。合成抵抗は？", "choices": ["5Ω", "10Ω", "20Ω"], "correct": 0, "explanation": "等しい抵抗を2つ並列にすると合成抵抗は半分で5Ω。"}, {"unit": "抵抗", "q": "3Ωと6Ωを並列につなぐ。合成抵抗は？", "choices": ["2Ω", "9Ω", "18Ω"], "correct": 0, "explanation": "1/R＝1/3＋1/6＝1/2なので2Ω。"}, {"unit": "抵抗", "q": "電圧12V、電流0.4A。抵抗は？", "choices": ["4.8Ω", "30Ω", "48Ω"], "correct": 1, "explanation": "12÷0.4＝30Ω。"}, {"unit": "抵抗", "q": "直列回路で2Ωと4Ω、電源12V。電流は？", "choices": ["2A", "3A", "6A"], "correct": 0, "explanation": "合成抵抗は6Ω。12÷6＝2A。"}, {"unit": "抵抗", "q": "並列回路で同じ抵抗2つをつなぐ。合成抵抗は各抵抗より？", "choices": ["小さい", "大きい", "必ず等しい"], "correct": 0, "explanation": "並列回路の合成抵抗は各抵抗より小さくなる。"}, {"unit": "抵抗", "q": "電圧8V、電流0.5A。抵抗は？", "choices": ["4Ω", "16Ω", "40Ω"], "correct": 1, "explanation": "8÷0.5＝16Ω。"}];
const KEY='electricity-exam-v1',UNITS=[['電流','⚡','電流計・直列・並列'],['電圧','🔋','電圧計・直列・並列'],['抵抗','🧮','オームの法則・回路'],['総合','🏆','全範囲から20問']];
const $=id=>document.getElementById(id);const rnd=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let data={history:[],favorites:[],session:null};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.history))data={...data,...d};}catch(e){};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
let session=data.session;const show=id=>['home','play','cheer','result'].forEach(n=>$(n).classList.toggle('hidden',n!==id));
function goHome(){show('home');const root=$('units');root.replaceChildren();UNITS.forEach(([unit,emoji,desc])=>{const b=document.createElement('button');b.className='tile';b.textContent=emoji+' '+unit;const span=document.createElement('span');span.textContent=desc;b.append(span);b.onclick=()=>start(unit);root.append(b)});$('resume').replaceChildren();if(session&&session.index<session.ids.length){const b=document.createElement('button');b.className='tile';b.textContent='▶ 途中から再開';const s=document.createElement('span');s.textContent=(session.index+1)+'問目から';b.append(s);b.onclick=draw;$('resume').append(b);}}
function start(unit){const pool=BANK.map((q,i)=>i).filter(i=>unit==='総合'||BANK[i].unit===unit);const ids=rnd(pool).slice(0,unit==='総合'?20:Math.min(20,pool.length));session={unit,ids,index:0,correct:0,picked:null,sessionKey:Date.now().toString(36)};data.session=session;save();draw();}
function draw(){if(!session)return goHome();if(session.index>=session.ids.length)return end();show('play');const q=BANK[session.ids[session.index]];$('unitLabel').textContent='⚡ '+session.unit+'／'+q.unit;$('pageCount').textContent=`第${session.index+1}問／${session.ids.length}問`;$('meter').style.width=`${(session.index+Number(session.picked!==null))/session.ids.length*100}%`;$('question').textContent=q.q;$('choices').replaceChildren();q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=['ア','イ','ウ'][i]+'  '+c;if(session.picked!==null){b.disabled=true;if(i===q.correct)b.classList.add('good');else if(i===session.picked)b.classList.add('bad')}else b.onclick=()=>answer(i);$('choices').append(b)});const done=session.picked!==null;$('feedback').classList.toggle('hidden',!done);if(done)$('feedback').textContent=(session.picked===q.correct?'🎉 大正解！ ':'おしい！ここを覚えよう！ ')+q.explanation;$('next').classList.toggle('hidden',!done);$('next').textContent=session.index===session.ids.length-1?'結果を見る ➜':'つぎへ ➜';$('fav').textContent=data.favorites.includes(session.ids[session.index])?'★ お気に入り済み':'☆ お気に入り';}
function answer(i){if(!session||session.picked!==null)return;const q=BANK[session.ids[session.index]],good=i===q.correct;session.picked=i;if(good)session.correct++;data.history.push({day:new Date().toISOString(),unit:q.unit,correct:good});if(data.history.length>6000)data.history=data.history.slice(-6000);save();draw();}
function next(){if(!session||session.picked===null)return;session.index++;session.picked=null;save();if(session.index===session.ids.length)return end();if(session.index%5===0){$('cheerCount').textContent=`${session.index}問突破！ ここまで来たのがすごい！`;show('cheer')}else draw();}
function end(){if(!session)return;const len=session.ids.length,correct=session.correct;$('finalScore').textContent=`${len}問中 ${correct}問正解！`;data.session=null;session=null;save();show('result');}
$('next').onclick=next;$('continue').onclick=draw;$('back').onclick=goHome;$('finish').onclick=goHome;$('fav').onclick=()=>{if(!session)return;const id=session.ids[session.index];if(data.favorites.includes(id))data.favorites=data.favorites.filter(x=>x!==id);else data.favorites.push(id);save();draw()};goHome();
