const BANK=[{"id":"E01","level":"E","category":1,"question":"日本で一番広い平野は？","options":["関東平野","石狩平野","濃尾平野"],"correct":"関東平野","explanation":"関東平野は東京の周辺に広がる日本最大の平野です。","unit":"land"},{"id":"E02","level":"E","category":1,"question":"日本の国土で、山地や丘陵地は約どのくらい？","options":["4分の3","4分の1","半分"],"correct":"4分の3","explanation":"日本の国土の約4分の3は山地や丘陵地です。","unit":"land"},{"id":"E03","level":"E","category":1,"question":"川が山から平地に出る場所にできやすい地形は？","options":["扇状地","三角州","リアス海岸"],"correct":"扇状地","explanation":"土砂が扇形に広がってできるのが扇状地です。","unit":"land"},{"id":"E04","level":"E","category":1,"question":"川の河口にできやすい低く平らな地形は？","options":["三角州","扇状地","台地"],"correct":"三角州","explanation":"川が運んだ細かな土砂が河口付近に積もります。","unit":"land"},{"id":"E05","level":"E","category":1,"question":"日本海側で冬に多く降るものは？","options":["雪","ひょう","黄砂"],"correct":"雪","explanation":"日本海側は冬の季節風の影響で雪が多くなります。","unit":"climate"},{"id":"E06","level":"E","category":1,"question":"一年を通して比較的雨が少ないのは？","options":["瀬戸内","日本海側","南西諸島"],"correct":"瀬戸内","explanation":"瀬戸内は周囲の山地に季節風がさえぎられます。","unit":"climate"},{"id":"E07","level":"E","category":1,"question":"太平洋側の夏に雨をもたらすものは？","options":["梅雨や台風","北西の季節風","流氷"],"correct":"梅雨や台風","explanation":"夏は梅雨や台風の影響で雨が増えます。","unit":"climate"},{"id":"E08","level":"E","category":1,"question":"海水の流れで、黒潮はどちら？","options":["暖流","寒流","潮目"],"correct":"暖流","explanation":"黒潮（日本海流）は暖かい海水の流れです。","unit":"land"},{"id":"E09","level":"E","category":1,"question":"海水の流れで、親潮はどちら？","options":["寒流","暖流","満潮"],"correct":"寒流","explanation":"親潮（千島海流）は冷たい海水の流れです。","unit":"land"},{"id":"E10","level":"E","category":1,"question":"1平方キロメートルあたりの人口を何という？","options":["人口密度","人口増加率","出生率"],"correct":"人口密度","explanation":"人口密度は土地の広さあたりの人数を表します。","unit":"population"},{"id":"E11","level":"E","category":2,"question":"外国から商品を買うことを何という？","options":["輸入","輸出","生産"],"correct":"輸入","explanation":"外国から国内に商品を入れることが輸入です。","unit":"trade"},{"id":"E12","level":"E","category":2,"question":"外国へ商品を売ることを何という？","options":["輸出","輸入","消費"],"correct":"輸出","explanation":"国内の商品を外国へ売ることが輸出です。","unit":"trade"},{"id":"E13","level":"E","category":2,"question":"日本が多くを外国から買っている資源は？","options":["石油","水道水","石灰岩"],"correct":"石油","explanation":"日本は石油のほとんどを輸入に頼っています。","unit":"energy"},{"id":"E14","level":"E","category":2,"question":"太陽光や風力などをまとめて何という？","options":["再生可能エネルギー","化石燃料","原子力エネルギー"],"correct":"再生可能エネルギー","explanation":"自然の力を繰り返し利用できるエネルギーです。","unit":"energy"},{"id":"E15","level":"E","category":2,"question":"ダムから落ちる水の力で発電する方法は？","options":["水力発電","火力発電","原子力発電"],"correct":"水力発電","explanation":"水の位置エネルギーを利用して電気をつくります。","unit":"energy"},{"id":"E16","level":"E","category":2,"question":"牛を育て、牛乳などを生産する農業は？","options":["酪農","稲作","林業"],"correct":"酪農","explanation":"酪農は牛乳・乳製品を生産する畜産です。","unit":"agri"},{"id":"E17","level":"E","category":2,"question":"都会の近くで野菜や花を育てる農業は？","options":["近郊農業","焼畑農業","遊牧"],"correct":"近郊農業","explanation":"近郊農業は大都市の消費地に近い場所で行います。","unit":"agri"},{"id":"E18","level":"E","category":2,"question":"ビニールハウスなどを利用する農業は？","options":["施設園芸農業","稲作","林業"],"correct":"施設園芸農業","explanation":"温室やビニールハウスなどの施設を使います。","unit":"agri"},{"id":"E19","level":"E","category":2,"question":"原料を加工して製品をつくる産業は？","options":["工業","農業","漁業"],"correct":"工業","explanation":"工場などで材料を加工して製品をつくります。","unit":"industry"},{"id":"E20","level":"E","category":2,"question":"工場が多く集まった地域を何という？","options":["工業地帯","農業地帯","住宅団地"],"correct":"工業地帯","explanation":"工業地帯には多くの工場や関連施設が集まっています。","unit":"industry"},{"id":"E21","level":"E","category":3,"question":"愛知県で特に盛んな工業は？","options":["自動車工業","製紙工業","造船業"],"correct":"自動車工業","explanation":"愛知県には自動車工業の集積があります。","unit":"features"},{"id":"E22","level":"E","category":3,"question":"北海道で特に盛んな農業の一つは？","options":["酪農","茶の栽培","みかんの栽培"],"correct":"酪農","explanation":"北海道では広い土地を生かした酪農が盛んです。","unit":"features"},{"id":"E23","level":"E","category":3,"question":"東北地方で盛んな農業は？","options":["稲作","さとうきび栽培","コーヒー栽培"],"correct":"稲作","explanation":"東北地方には米づくりが盛んな地域が多くあります。","unit":"features"},{"id":"E24","level":"E","category":3,"question":"関東地方で特に人口が集中する都市は？","options":["東京","松江","高知"],"correct":"東京","explanation":"東京は日本の政治・経済の中心です。","unit":"features"},{"id":"E25","level":"E","category":3,"question":"冬でも温暖な南九州などで、野菜を早く出荷する栽培は？","options":["促成栽培","抑制栽培","二毛作"],"correct":"促成栽培","explanation":"暖かい気候を生かし、出荷時期を早めます。","unit":"features"},{"id":"E26","level":"E","category":3,"question":"長野県の涼しい高原で盛んな野菜づくりは？","options":["高原野菜の栽培","さとうきび栽培","熱帯果樹の栽培"],"correct":"高原野菜の栽培","explanation":"高原の涼しさを生かして野菜を育てます。","unit":"features"},{"id":"E27","level":"E","category":3,"question":"東京都と神奈川県に広がる工業地帯は？","options":["京浜工業地帯","阪神工業地帯","中京工業地帯"],"correct":"京浜工業地帯","explanation":"京浜は東京と横浜の「京」「浜」からきた名前です。","unit":"features"},{"id":"E28","level":"E","category":3,"question":"名古屋を中心とする工業地帯は？","options":["中京工業地帯","京浜工業地帯","北九州工業地帯"],"correct":"中京工業地帯","explanation":"中京工業地帯は名古屋周辺に広がります。","unit":"features"},{"id":"E29","level":"E","category":3,"question":"大阪と神戸を中心とする工業地帯は？","options":["阪神工業地帯","中京工業地帯","京浜工業地帯"],"correct":"阪神工業地帯","explanation":"阪神は大阪と神戸の「阪」「神」です。","unit":"features"},{"id":"E30","level":"E","category":3,"question":"沖縄県で広く見られる気候は？","options":["亜熱帯の気候","寒帯の気候","ツンドラ気候"],"correct":"亜熱帯の気候","explanation":"沖縄は年間を通して気温が高い地域です。","unit":"features"},{"id":"S01","level":"S","category":1,"question":"日本海側で冬に雪が多い主な理由は？","options":["北西の季節風が日本海の水分を運ぶから","太平洋の暖流だけが雪を運ぶから","夏の南東の季節風が強いから","ねこが雪雲をふりふりしたから"],"correct":"北西の季節風が日本海の水分を運ぶから","explanation":"大陸からの冬の季節風が日本海を越え、雪雲をつくります。","unit":"climate"},{"id":"S02","level":"S","category":1,"question":"中央高地の気候の特徴は？","options":["夏と冬の気温差が大きい","一年中気温差が小さい","冬の雨がとても多い","一年中蒸し暑い"],"correct":"夏と冬の気温差が大きい","explanation":"中央高地は内陸にあるので気温差が大きくなります。","unit":"climate"},{"id":"S03","level":"S","category":1,"question":"人口に占める65歳以上の割合が増えることは？","options":["高齢化","少子化","過密化","都市化"],"correct":"高齢化","explanation":"65歳以上の割合が高まることを高齢化といいます。","unit":"population"},{"id":"S04","level":"S","category":1,"question":"子どもが減り、高齢者が増える現象は？","options":["少子高齢化","人口集中","国際化","過密化"],"correct":"少子高齢化","explanation":"少子化と高齢化が同時に進んでいる状態です。","unit":"population"},{"id":"S05","level":"S","category":1,"question":"都市に人口が集中しすぎることは？","options":["過密","過疎","少子化","離村"],"correct":"過密","explanation":"過密は住宅や交通の混雑などにつながります。","unit":"population"},{"id":"S06","level":"S","category":1,"question":"人口が大きく減り、地域の維持が難しくなることは？","options":["過疎","過密","人口爆発","都市化"],"correct":"過疎","explanation":"過疎が進むと公共交通や学校の維持が難しくなります。","unit":"population"},{"id":"S07","level":"S","category":1,"question":"日本の人口ピラミッドで、高齢者の割合が大きい形は？","options":["つぼ型","富士山型","ピラミッド型","ねこ型"],"correct":"つぼ型","explanation":"現在の日本は少子高齢化が進み、つぼ型に近い形です。","unit":"population"},{"id":"S08","level":"S","category":1,"question":"季節による降水量の違いを調べるグラフは？","options":["雨温図","人口ピラミッド","帯グラフ","円グラフ"],"correct":"雨温図","explanation":"雨温図には月ごとの降水量と気温が示されます。","unit":"climate"},{"id":"S09","level":"S","category":1,"question":"暖流と寒流が出会う海域を何という？","options":["潮目","三角州","ねこ会議の場所","流域"],"correct":"潮目","explanation":"潮目付近には魚のえさとなる生物が集まりやすいです。","unit":"land"},{"id":"S10","level":"S","category":1,"question":"梅雨の時期は、おもに何月から何月？","options":["6月から7月ごろ","1月から2月ごろ","3月から4月ごろ","11月から12月ごろ"],"correct":"6月から7月ごろ","explanation":"日本の多くの地域では初夏に梅雨があります。","unit":"climate"},{"id":"S11","level":"S","category":2,"question":"原料を輸入し、製品をつくって輸出する貿易は？","options":["加工貿易","中継貿易","自由貿易","にゃんこ貿易"],"correct":"加工貿易","explanation":"日本は原料を輸入して工業製品を輸出してきました。","unit":"trade"},{"id":"S12","level":"S","category":2,"question":"工場が臨海部に集まりやすい理由は？","options":["大量の原料を船で運びやすいから","山の頂上に近いから","降水量が多いから","積雪が必ず少ないから"],"correct":"大量の原料を船で運びやすいから","explanation":"港から原料を運び、製品を出荷しやすい場所です。","unit":"industry"},{"id":"S13","level":"S","category":2,"question":"自動車工業が特に盛んな工業地帯は？","options":["中京工業地帯","阪神工業地帯","京浜工業地帯","にゃん京工業地帯"],"correct":"中京工業地帯","explanation":"中京工業地帯では輸送用機械の生産が盛んです。","unit":"industry"},{"id":"S14","level":"S","category":2,"question":"日本の太平洋側に連なる工業の集中地域は？","options":["太平洋ベルト","環太平洋造山帯","中央構造線","北方領土"],"correct":"太平洋ベルト","explanation":"太平洋ベルトに工業地帯・地域が集中します。","unit":"industry"},{"id":"S15","level":"S","category":2,"question":"同じ田畑で1年に2種類の作物をつくることは？","options":["二毛作","輪作","単作","ねこの二度寝農法"],"correct":"二毛作","explanation":"同じ耕地で年に2種類の作物を育てます。","unit":"agri"},{"id":"S16","level":"S","category":2,"question":"通常より早い時期に野菜を出荷する栽培は？","options":["促成栽培","抑制栽培","二毛作","混合農業"],"correct":"促成栽培","explanation":"促成栽培では生育を早め、早い時期に出荷します。","unit":"agri"},{"id":"S17","level":"S","category":2,"question":"通常より遅い時期に野菜を出荷する栽培は？","options":["抑制栽培","促成栽培","二毛作","集約農業"],"correct":"抑制栽培","explanation":"抑制栽培では生育や出荷の時期を遅らせます。","unit":"agri"},{"id":"S18","level":"S","category":2,"question":"食料自給率が表すことは？","options":["国内で消費する食料を国内生産でまかなう割合","外国に売った商品の割合","農業をしている人の割合","工場の数の割合"],"correct":"国内で消費する食料を国内生産でまかなう割合","explanation":"食料自給率は食料の国内生産の割合を表します。","unit":"agri"},{"id":"S19","level":"S","category":2,"question":"多くの人や物を長距離に運ぶのに適する輸送手段は？","options":["鉄道","自転車","徒歩","オートバイ"],"correct":"鉄道","explanation":"鉄道は多くの人や荷物をまとめて輸送できます。","unit":"trade"},{"id":"S20","level":"S","category":2,"question":"工場が海外に移り、国内の工業が衰える現象は？","options":["産業の空洞化","ヒートアイランド","人口爆発","過密化"],"correct":"産業の空洞化","explanation":"海外への生産移転で国内の生産や雇用が減る問題です。","unit":"industry"},{"id":"S21","level":"S","category":3,"question":"北海道で畑作が盛んな地域は？","options":["十勝平野","関東平野","筑紫平野","ねこ平野"],"correct":"十勝平野","explanation":"十勝平野では小麦やじゃがいもなどを育てます。","unit":"features"},{"id":"S22","level":"S","category":3,"question":"北海道で酪農が盛んな地域は？","options":["根釧台地","甲府盆地","奈良盆地","讃岐平野"],"correct":"根釧台地","explanation":"根釧台地は冷涼な気候と広い土地を生かして酪農が盛んです。","unit":"features"},{"id":"S23","level":"S","category":3,"question":"北陸地方で稲作が盛んな理由の一つは？","options":["雪どけ水を利用できるから","一年中雨が降らないから","砂漠が広がるから","冬に地面が凍らないから"],"correct":"雪どけ水を利用できるから","explanation":"積雪が多く、春の雪どけ水を農業用水に利用できます。","unit":"features"},{"id":"S24","level":"S","category":3,"question":"甲府盆地などで盛んな農業は？","options":["ぶどうやももの栽培","さとうきびの栽培","稲だけの栽培","パイナップルの栽培"],"correct":"ぶどうやももの栽培","explanation":"山梨県の甲府盆地は果樹栽培が盛んです。","unit":"features"},{"id":"S25","level":"S","category":3,"question":"東北地方の太平洋岸などにある複雑な海岸線は？","options":["リアス海岸","三角州","扇状地","砂丘"],"correct":"リアス海岸","explanation":"入り江が多く、養殖漁業などにも利用されます。","unit":"features"},{"id":"S26","level":"S","category":3,"question":"冬に日本海側で雪が多い地域は？","options":["北陸地方","瀬戸内地方","沖縄地方","南九州地方"],"correct":"北陸地方","explanation":"北陸地方は冬の季節風の影響で雪が多くなります。","unit":"features"},{"id":"S27","level":"S","category":3,"question":"東海地方で自動車工業が盛んな県は？","options":["愛知県","鳥取県","高知県","秋田県"],"correct":"愛知県","explanation":"愛知県には自動車と関連部品の工場が集中します。","unit":"features"},{"id":"S28","level":"S","category":3,"question":"宮崎・高知などで野菜の促成栽培が盛んな理由は？","options":["冬でも温暖だから","冬の積雪が多いから","夏に気温が低いから","一年中日照がないから"],"correct":"冬でも温暖だから","explanation":"温暖な気候を生かし、野菜の出荷時期を早めます。","unit":"features"},{"id":"S29","level":"S","category":3,"question":"瀬戸内海沿岸で工業が発達した理由の一つは？","options":["港を利用した輸送に便利だから","高い山の頂上が多いから","凍った海が広がるから","一年中雪に覆われるから"],"correct":"港を利用した輸送に便利だから","explanation":"沿岸の港から原料や製品を運びやすい立地です。","unit":"features"},{"id":"S30","level":"S","category":3,"question":"日本の三大都市圏に含まれないものは？","options":["札幌大都市圏","東京大都市圏","名古屋大都市圏","大阪大都市圏"],"correct":"札幌大都市圏","explanation":"三大都市圏は東京・名古屋・大阪を中心とする地域です。","unit":"features"},{"id":"A01","level":"A","category":1,"question":"ある都市は夏の雨が多く、冬は乾燥して晴れの日が多い。どの気候？","options":["太平洋側の気候","日本海側の気候","瀬戸内の気候","中央高地の気候"],"correct":"太平洋側の気候","explanation":"太平洋側は夏の降水が多く、冬は乾燥しやすいです。","unit":"climate"},{"id":"A02","level":"A","category":1,"question":"本州の内陸にある都市は、夏も冬も降水量が少なく、夏と冬の気温差が大きい。どの気候？","options":["中央高地の気候","南西諸島の気候","日本海側の気候","北海道の気候"],"correct":"中央高地の気候","explanation":"中央高地は内陸にあり、降水が少なめで気温差が大きいです。","unit":"climate"},{"id":"A03","level":"A","category":1,"question":"瀬戸内地方で降水量が少ない主な理由は？","options":["山地が季節風をさえぎるから","日本海が完全に凍るから","標高が全国一高いから","一年中同じ風が吹くから"],"correct":"山地が季節風をさえぎるから","explanation":"中国山地と四国山地が季節風の湿気をさえぎります。","unit":"climate"},{"id":"A04","level":"A","category":1,"question":"地震のあと、海底が大きく動いて生じる大きな波は？","options":["津波","高潮","洪水","ねこ波"],"correct":"津波","explanation":"津波は海底の大きな変動などで起こります。","unit":"hazard"},{"id":"A05","level":"A","category":1,"question":"台風の強い風や低い気圧で海面が異常に高くなる災害は？","options":["高潮","津波","洪水","雪崩"],"correct":"高潮","explanation":"高潮は風と気圧の影響で海面が高くなる現象です。","unit":"hazard"},{"id":"A06","level":"A","category":1,"question":"強い雨で、土砂と水が一気に斜面や谷を流れる現象は？","options":["土石流","液状化","高潮","地盤沈下"],"correct":"土石流","explanation":"土石流は土砂と水が激しく流れる現象です。","unit":"hazard"},{"id":"A07","level":"A","category":1,"question":"1995年に兵庫県南部を中心に大きな被害が出た地震の災害名は？","options":["阪神・淡路大震災","東日本大震災","熊本地震","関東大震災"],"correct":"阪神・淡路大震災","explanation":"阪神・淡路大震災は1995年1月に発生しました。","unit":"hazard"},{"id":"A08","level":"A","category":1,"question":"2011年に東北地方の太平洋岸などに大きな津波被害をもたらした災害は？","options":["東日本大震災","阪神・淡路大震災","新潟県中越地震","北海道胆振東部地震"],"correct":"東日本大震災","explanation":"2011年3月11日の巨大地震と津波による災害です。","unit":"hazard"},{"id":"A09","level":"A","category":1,"question":"一つの川に水が流れ込む範囲を何という？","options":["流域","海溝","分水嶺","河岸段丘"],"correct":"流域","explanation":"流域は雨などの水がその川へ集まる地域です。","unit":"land"},{"id":"A10","level":"A","category":1,"question":"15歳未満の人口が減り、65歳以上の人口が増えたとき、人口ピラミッドはどう変わりやすい？","options":["底が細く、上が太くなる","底が太く、上が細くなる","上も下も同じ幅になる","年齢別の割合は変わらない"],"correct":"底が細く、上が太くなる","explanation":"子どもが少なく高齢者が多い形へ変わります。","unit":"population"},{"id":"A11","level":"A","category":2,"question":"発電するときに石油・石炭・天然ガスなどを燃やす方法は？","options":["火力発電","水力発電","地熱発電","にゃんこ回し車発電"],"correct":"火力発電","explanation":"火力発電は燃料を燃やして熱を得ます。","unit":"energy"},{"id":"A12","level":"A","category":2,"question":"発電時に二酸化炭素を直接はほとんど出さない発電方法は？","options":["風力発電","石炭火力発電","石油火力発電","天然ガス火力発電"],"correct":"風力発電","explanation":"風力発電は風の力で発電し、運転時に燃料を燃やしません。","unit":"energy"},{"id":"A13","level":"A","category":2,"question":"スマートフォンなどにも使う、少量しか採れない希少な金属は？","options":["レアメタル","化石燃料","プラスチック","石灰岩"],"correct":"レアメタル","explanation":"レアメタルは電子機器などの製造に必要な金属です。","unit":"energy"},{"id":"A14","level":"A","category":2,"question":"外国から多くの食料を買う日本の課題として適切なものは？","options":["海外の生産・輸送の変化の影響を受けやすい","国内の農業生産は必ず増える","食料価格は必ず一定になる","気候変動の影響を全く受けない"],"correct":"海外の生産・輸送の変化の影響を受けやすい","explanation":"輸入への依存が高いと海外の事情に左右されやすくなります。","unit":"trade"},{"id":"A15","level":"A","category":2,"quest n":"建物や道路に熱がたまり、人工排熱も加わります。","unit":"population"},{"id":"A25","level":"A","category":3,"question":"東北の三陸海岸で養殖漁業が盛んな理由の一つは？","options":["入り江が多く波が比較的穏やかな場所があるから","海岸がすべて一直線だから","一年中海が凍っているから","沖に魚が全くいないから"],"correct":"入り江が多く波が比較的穏やかな場所があるから","explanation":"リアス海岸の入り江を利用して養殖が行われます。","unit":"features"},{"id":"A26","level":"A","category":3,"question":"瀬戸内海沿岸で工業地帯・地域が発達しやすかった理由は？","options":["港から原料や製品を運びやすかったから","高山で水運ができないから","冬は海が長期間凍るから","車が使えないから"],"correct":"港から原料や製品を運びやすかったから","explanation":"穏やかな海の港を使い工業原料などを運べました。","unit":"features"},{"id":"A27","level":"A","category":3,"question":"北海道の農家1戸あたりの経営耕地面積が比較的大きい理由は？","options":["広い土地で大規模な農業ができるから","平野が全くないから","人口密度が日本一高いから","一年中気温が30度だから"],"correct":"広い土地で大規模な農業ができるから","explanation":"北海道は耕地が広く、機械を使った大規模農業が盛んです。","unit":"features"},{"id":"A28","level":"A","category":3,"question":"夏、太平洋側では降水が多くなり、日本海側では冬に雪が多い。主な原因は？","options":["季節風が季節によって向きを変えるため","日本列島の位置が毎月動くため","海の深さが夏冬で逆転するため","日本の山が冬に消えるため"],"correct":"季節風が季節によって向きを変えるため","explanation":"夏と冬で卓越する季節風の向きが変わります。","unit":"climate"},{"id":"A29","level":"A","category":3,"question":"首都圏に人口と企業が集中することによる問題は？","options":["通勤混雑や住宅不足","全国の過疎が必ず解消する","地方の人口が必ず増える","自然災害が起きなくなる"],"correct":"通勤混雑や住宅不足","explanation":"大都市では交通や住宅などに負担がかかることがあります。","unit":"population"},{"id":"A30","level":"A","category":3,"question":"北陸地方と瀬戸内地方の気候を比べると、正しいのは？","options":["北陸は冬の雪が多く、瀬戸内は比較的雨が少ない","両方とも一年中ほとんど雪に覆われる","瀬戸内は冬の雪が最も多く、北陸は一年中乾燥する","両方とも年間降水量が必ず同じ"],"correct":"北陸は冬の雪が多く、瀬戸内は比較的雨が少ない","explanation":"北陸は日本海側、瀬戸内は山地に囲まれた地域です。","unit":"climate"},{"id":"E31","level":"E","category":1,"question":"日本の中央部を南北に走る高い山地を何という？","options":["日本アルプス","奥羽山脈","筑紫山地"],"correct":"日本アルプス","explanation":"飛騨・木曽・赤石の3山脈をまとめた呼び名です。","unit":"land"},{"id":"E32","level":"E","category":1,"question":"日本の川に多い特徴は？","options":["短くて流れが急","長くて流れが緩やか","一年中ほとんど流れない"],"correct":"短くて流れが急","explanation":"日本は山が多く、川は短く傾斜が急になりやすいです。","unit":"land"},{"id":"E33","level":"E","category":1,"question":"日本の周りでプレートが動くことで起こりやすい災害は？","options":["地震","砂漠化","干ばつだけ"],"correct":"地震","explanation":"日本は複数のプレートが接する地域にあります。","unit":"hazard"},{"id":"E34","level":"E","category":1,"question":"冷たい空気が流れ込み、農作物の生育が悪くなる被害は？","options":["冷害","干害","高潮"],"correct":"冷害","explanation":"夏の低温などによる農作物の被害です。","unit":"hazard"},{"id":"E35","level":"E","category":1,"question":"雨が少なく水不足になる災害は？","options":["干害","冷害","津波"],"correct":"干害","explanation":"水不足で作物が育たないなどの被害が出ます。","unit":"hazard"},{"id":"E36","level":"E","category":1,"question":"山などの斜面から土砂が崩れ落ちる災害は？","options":["土砂災害","高潮","赤潮"],"correct":"土砂災害","explanation":"急斜面や地盤の条件、豪雨などによって起きます。","unit":"hazard"},{"id":"E37","level":"E","category":1,"question":"災害の危険な場所や避難場所を示した地図は？","options":["ハザードマップ","雨温図","人口ピラミッド"],"correct":"ハザードマップ","explanation":"水害や土砂災害などの危険区域を確認できます。","unit":"hazard"},{"id":"E38","level":"E","category":1,"question":"海岸線が入り組み、小さな湾が多い海岸は？","options":["リアス海岸","砂浜海岸","三角州"],"correct":"リアス海岸","explanation":"海岸線が複雑で、入り江が多い地形です。","unit":"land"},{"id":"E39","level":"E","category":1,"question":"日本の海岸近くに広がる深さ約200mまでの浅い海底は？","options":["大陸棚","海溝","海嶺"],"correct":"大陸棚","explanation":"大陸棚は沿岸近くの浅い海底です。","unit":"land"},{"id":"E40","level":"E","category":1,"question":"海底にある細長く深いくぼみは？","options":["海溝","大陸棚","三角州"],"correct":"海溝","explanation":"日本の東側には日本海溝などがあります。","unit":"land"},{"id":"E41","level":"E","category":1,"question":"日本の人口で15歳未満を何人口という？","options":["年少人口","生産年齢人口","老年人口"],"correct":"年少人口","explanation":"15歳未満の人口を指します。","unit":"population"},{"id":"E42","level":"E","category":1,"question":"日本の人口で65歳以上を何人口という？","options":["老年人口","年少人口","生産年齢人口"],"correct":"老年人口","explanation":"65歳以上が老年人口です。","unit":"population"},{"id":"E43","level":"E","category":1,"question":"出生する子どもの数の減少が続く現象は？","options":["少子化","高齢化","過密"],"correct":"少子化","explanation":"出生数の減少などで子どもの割合が低下します。","unit":"population"},{"id":"E44","level":"E","category":2,"question":"石油や石炭などをまとめて何という？","options":["化石燃料","再生可能エネルギー","レアメタル"],"correct":"化石燃料","explanation":"地下から採る燃料で、燃焼により二酸化炭素を出します。","unit":"energy"},{"id":"E45","level":"E","category":2,"question":"地下の熱を利用する発電方法は？","options":["地熱発電","風力発電","水力発電"],"correct":"地熱発電","explanation":"地下の熱で蒸気をつくり発電します。","unit":"energy"},{"id":"E46","level":"E","category":2,"question":"原子力発電の主な燃料として使われる物質は？","options":["ウラン","石油","石炭"],"correct":"ウラン","explanation":"原子力発電ではウランの核分裂による熱を利用します。","unit":"energy"},{"id":"E47","level":"E","category":2,"question":"風車を回して電気をつくる方法は？","options":["風力発電","水力発電","火力発電"],"correct":"風力発電","explanation":"風を利用して発電機を回します。","unit":"energy"},{"id":"E48","level":"E","category":2,"question":"工業のうち、鉄や石油などを使う工業を何という？","options":["重化学工業","繊維工業","農業"],"correct":"重化学工業","explanation":"金属工業と化学工業などを含みます。","unit":"industry"},{"id":"E49","level":"E","category":2,"question":"テレビやスマホなどで情報を伝える技術は？","options":["情報通信技術","土地改良","地盤沈下"],"correct":"情報通信技術","explanation":"情報通信技術はICTとも呼びます。","unit":"trade"},{"id":"E50","level":"E","category":2,"question":"乳牛を育て、牛乳を生産する農業は？","options":["酪農","養殖","稲作"],"correct":"酪農","explanation":"酪農では乳牛を飼育します。","unit":"agri"},{"id":"E51","level":"E","category":2,"question":"魚や貝などを人工的に育てる漁業は？","options":["養殖漁業","遠洋漁業","沖合漁業"],"correct":"養殖漁業","explanation":"いけすや海の施設で魚介類を育てます。","unit":"agri"},{"id":"E52","level":"E","category":2,"question":"海で魚を捕まえることを主とする産業は？","options":["漁業","林業","鉱業"],"correct":"漁業","explanation":"漁業は海や川などの水産資源を利用します。","unit":"agri"},{"id":"E53","level":"E","category":2,"question":"自分の国で使う食料を自分の国で生産する割合は？","options":["食料自給率","人口密度","出生率"],"correct":"食料自給率","explanation":"国内の食料供給を国内生産でまかなう割合です。","unit":"agri"},{"id":"E54","level":"E","category":3,"question":"北海道がある日本の地方区分は？","options":["北海道地方","東北地方","中部地方"],"correct":"北海道地方","explanation":"北海道は単独で北海道地方に区分されます。","unit":"region"},{"id":"E55","level":"E","category":3,"question":"東京・神奈川・千葉などを含む地方は？","options":["関東地方","近畿地方","中国地方"],"correct":"関東地方","explanation":"東京都と周辺の県が関東地方です。","unit":"region"},{"id":"E56","level":"E","category":3,"question":"大阪・京都・兵庫などを含む地方は？","options":["近畿地方","関東地方","東北地方"],"correct":"近畿地方","explanation":"近畿地方には大阪 すべて同じ"],"correct":"第一次産業","explanation":"第1次産業の10％が最も小さい割合です。","visual":"sector_chart","unit":"industry"},{"id":"A47","level":"A","category":2,"question":"発電方法のうち、天候によって発電量が変わりやすい組み合わせは？","options":["太陽光・風力","水力・原子力","原子力・火力","火力・地熱"],"correct":"太陽光・風力","explanation":"日光や風の強さは天候で変化します。","unit":"energy"},{"id":"A48","level":"A","category":2,"question":"エネルギー自給率が低い日本が気をつけるべきことは？","options":["輸入先の情勢や燃料価格の変化","日本の海底がすべて平らになること","国内で燃料が必ず無限にとれること","産業がすべて農業になること"],"correct":"輸入先の情勢や燃料価格の変化","explanation":"輸入燃料に頼ると国際情勢の影響を受けます。","unit":"energy"},{"id":"A49","level":"A","category":2,"question":"石油・石炭・天然ガスを燃やして電気をつくることの課題は？","options":["二酸化炭素の排出","海水がすべて淡水になる","木材が増える","太陽光が届かなくなる"],"correct":"二酸化炭素の排出","explanation":"化石燃料の燃焼で温室効果ガスが出ます。","unit":"energy"},{"id":"A50","level":"A","category":2,"question":"大都市のすぐ近くで新鮮な野菜や花を生産する利点は？","options":["消費地まで短時間で届けやすい","外国にしか売れなくなる","必ず高地で栽培できる","輸送が不要になる"],"correct":"消費地まで短時間で届けやすい","explanation":"消費地に近く、鮮度を保って届けやすいです。","unit":"agri"},{"id":"A51","level":"A","category":2,"question":"高原野菜の「抑制栽培」のねらいは？","options":["涼しさを生かして遅い時期に出荷する","加温して早い時期に出荷する","一年中同じ作物を輸入する","畑を使わず育てる"],"correct":"涼しさを生かして遅い時期に出荷する","explanation":"夏でも冷涼な高原で出荷時期をずらします。","unit":"agri"},{"id":"A52","level":"A","category":2,"question":"遠洋漁業が以前より難しくなった理由の一つは？","options":["各国の排他的経済水域の設定","日本海が消えたから","すべての魚が川に移ったから","船が使えなくなったから"],"correct":"各国の排他的経済水域の設定","explanation":"他国の排他的経済水域内では自由に漁ができません。","unit":"agri"},{"id":"A53","level":"A","category":2,"question":"養殖漁業の説明として正しいものは？","options":["いけすなどで魚を育てる","稚魚を放流し成長後にとる","遠洋へ長期間出て魚をとる","漁船を使わず山で魚をとる"],"correct":"いけすなどで魚を育てる","explanation":"養殖は魚介類を人工的に育てて出荷します。","unit":"agri"},{"id":"A54","level":"A","category":2,"question":"栽培漁業の説明として正しいものは？","options":["稚魚を育てて放流し、後にとる","魚をいけすで出荷まで育てる","海外から魚をすべて輸入する","河川を埋め立てる"],"correct":"稚魚を育てて放流し、後にとる","explanation":"栽培漁業は稚魚を放流して資源を増やします。","unit":"agri"},{"id":"A55","level":"A","category":2,"question":"沿岸で石油化学工場が集まる理由として最も適切なのは？","options":["タンカーで大量の原油を運び込める","山頂が原油の産地だから","工場では水を使わないから" function subtleSillyOption(q){
 const opts=[...q.options];
 if(opts.some(o=>/ねこ|にゃ|ポーグ|パンダ|ゲイリー|プランクトン|ハンバーガー/.test(o)))return opts;
 let seed=0;for(const c of q.id)seed=seed*31+c.charCodeAt(0);
 if(seed%4!==0)return opts;
 const wrong=opts.findIndex((o,i)=>i===opts.length-1&&o!==q.correct);
 const idx=wrong>=0?wrong:opts.findIndex(o=>o!==q.correct);
 const silly=SILLY_BY_UNIT[q.unit];if(silly&&idx>=0)opts[idx]=silly[Math.abs(seed)%silly.length];
 return opts;
}

function playSound(kind){
 if(!soundOn)return;
 try{
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  const now=audioCtx.currentTime;
  const play=(freq,delay,duration=0.14,type='sine',volume=0.045)=>{
   const osc=audioCtx.createOscillator(),env=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now+delay);
   env.gain.setValueAtTime(0.0001,now+delay);env.gain.exponentialRampToValueAtTime(volume,now+delay+0.012);
   env.gain.exponentialRampToValueAtTime(0.0001,now+delay+duration);osc.connect(env);env.connect(audioCtx.destination);
   osc.start(now+delay);osc.stop(now+delay+duration+0.025);
  };
  if(kind==='correct')[[587,0],[740,.09],[880,.18]].forEach(([n,d])=>play(n,d,.17,'sine',.046));
  else if(kind==='wrong')[[390,0],[340,.11]].forEach(([n,d])=>play(n,d,.14,'sine',.031));
  else if(kind==='milestone')[[523,0],[659,.11],[784,.22],[1047,.35],[1319,.49]].forEach(([n,d],i)=>play(n,d,i===4?.39:.19,'triangle',.05));
  else if(kind==='finish')[[440,0],[554,.11],[659,.22],[880,.34],[1108,.47],[1320,.59]].forEach(([n,d],i)=>play(n,d,i===5?.38:.19,'sine',.05));
  else play(580,0,.12,'sine',.027);
 }catch(e){}
}

 }else app.append(el('div','recordInfo','この単元・期間の学習履歴はまだありません。次の1問から記録されます。'));
 const loggedIds=new Set(history.map(e=>e.qid));const oldIds=[...attempted].filter(id=>!loggedIds.has(id));
 if(oldIds.length&&!unit)app.append(el('p','muted small',`前の版で挑戦した${oldIds.length}問は進み具合に残っていますが、当時の日付は記録されていません。`));
 if(!storageOK)app.append(el('p','notice','このブラウザは自動保存ができません。学習の記録は閉じると消える可能性があります。'));
 const back=b('btn white',unit?'この単元へもどる':'単元一覧へ',unit?()=>unitPage(unit):home);app.append(back);
 const tools=el('div','saveTools');tools.append(el('div','reaction','大切な記録を守る'));
 tools.append(el('div','muted small','端末を変えるときや、新しいファイルを開くときのために、記録を保存・復元できます。'));
 tools.append(b('btn white','学習記録をバックアップ',exportHistory));
 const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.className='hide';file.addEventListener('change',async()=>{if(file.files&&file.files[0])await importHistory(file.files[0]);file.value=''});
 tools.append(file,b('btn white','バックアップを読み込む',()=>file.click()));app.append(tools);
}
function historyDayPage(day,unit=null){
 view='historyDay';historyUnitFilter=unit;headerButton(true);app.replaceChildren();
 const entries=dayEvents(day,unit),stats=historyStats(entries);
 app.append(el('h1','title',displayDay(day)),el('p','subtitle',`${stats.done}問に挑戦　${stats.correct}問 正解！`));
 const summary={};for(const e of entries){const key=e.unit;summary[key]??={total:0,correct:0,levels:new Set()};summary[key].total++;summary[key].correct+=Number(e.correct);summary[key].levels.add(names[e.level])}
 app.append(el('div','historyLabel','この日にやった単元'));
 for(const [key,s] of Object.entries(summary)){const u=UNITS.find(i=>i.id===key);app.append(el('div','recordInfo',`${u?u.title:key}　${s.total}問中${s.correct}問正解　（${[...s.levels].join('・')}）`));}
 app.append(el('div','historyLabel','解いた問題'));
 for(const entry of entries){const q=byId[entry.qid];if(!q)continue;const u=UNITS.find(i=>i.id===entry.unit);
 const c=el('div','historyItem'+(entry.correct?'':' wrongAnswer'));
 let time='';if(typeof entry.at==='string'&&!Number.isNaN(Date.parse(entry.at)))time=new Date(entry.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
 c.append(el('div','qMeta',`${time}　${u?u.title:''}　${names[q.level]||''}`),el('div','qPreview',q.question));
 c.append(el('div','qResult',entry.correct?'〇 正解！':'△ あとで復習　正解：'+q.correct));app.append(c);
 }
 app.append(b('btn white','日付の一覧にもどる',()=>historyPage(unit)));
}
function exportHistory(){
 try{
 const record={format:'chiri-quest-backup-v1',savedAt:new Date().toISOString(),data:{favorites:[...favorites],attempted:[...attempted],earned:[...earned],history,game,apples}};
 const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`地理クイズ_学習記録_${localDay()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 }catch(e){alert('保存できませんでした。ブラウザを確認してください。')}
}
async function importHistory(file){
 try{
  const obj=JSON.parse(await file.text());if(obj.format!=='chiri-quest-backup-v1'||!obj.data||!Array.isArray(obj.data.history))throw Error('形式');
  if(!confirm('保存した記録を読み込みますか？ 今の記録を消さずに合体します。'))return;
  const v=obj.data;
  for(const id of v.favorites||[])if(byId[id])favorites.add(id);
  for(const id of v.attempted||[])if(byId[id])attempted.add(id);
  for(const id of v.earned||[])if(byId[id])earned.add(id);
  const used=new Set(history.map(e=>e.id));for(const e of v.history){if(!e||!byId[e.qid]||typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||typeof e.correct!=='boolean')continue;
   const eid=typeof e.id==='string'?e.id:'';
   if(!eid||used.has(eid))continue;used.add(eid);history.push({id:eid,date:e.date,at:String(e.at||''),qid:e.qid,unit:byId[e.qid].unit,level:byId[e.qid].level,correct:e.correct,choice:String(e.choice||'')});
  }
  history.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  if(Number.isSafeInteger(v.apples)&&v.apples>=0)apples=Math.max(apples,v.apples);
  if(!game&&v.game&&Array.isArray(v.game.ids)&&v.game.ids.every(id=>byId[id])&&Array.isArray(v.game.choices)&&v.game.choices.length===v.game.ids.length&&Number.isInteger(v.game.index)&&v.game.index>=0&&v.game.index<v.game.ids.length)game=v.game;
  persist();historyPage(historyUnitFilter);alert('記録を読み込みました。');
 }catch(e){alert('記録ファイルを読み込めませんでした。地理クイズのバックアップを選んでください。')}
}
homeBtn.addEventListener('click',()=>{persist();if(view==='historyDay')historyPage(historyUnitFilter);else if(view==='question'&&game&&game.unit)unitPage(game.unit);else home()});
window.addEventListener('pagehide',persist);home();
