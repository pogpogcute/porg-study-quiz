<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保健｜ぼくのテスト勉強基地</title><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#182942;background:#f0f7ff}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px}h1{font-size:clamp(27px,6vw,40px)}h2{font-size:clamp(24px,5vw,33px)}p,button,select{font-size:clamp(19px,4.3vw,26px)}.panel{background:white;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #bed2e65e}.muted{color:#51647a}.option{display:block;width:100%;margin:12px 0;padding:18px;text-align:left;border:3px solid #c9d9ea;border-radius:18px;background:#fff;color:#182942;font-weight:700;min-height:72px}.option.selected{background:#d9f6e8;border-color:#078e6d}.primary{background:#2764df;color:white;border:0;border-radius:16px;padding:16px 25px;font-weight:800;min-height:60px}.primary:disabled{background:#a9b7ca}.secondary{background:#fff;border:2px solid #8da6c8;border-radius:16px;padding:12px 18px;color:#203955}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.score{font-size:26px;font-weight:900;color:#1768c5}.feedback{font-size:25px;font-weight:900;padding:16px;border-radius:15px;background:#fff4c6}.small{font-size:17px}.hide{display:none}select{max-width:100%;padding:10px;border-radius:12px}button{cursor:pointer}button:focus-visible{outline:4px solid orange}</style></head><body><main><h1>🩹 保健のテスト勉強基地</h1><p>選ぶ → 決定！ まちがえても、また挑戦！</p><div class="row"><button class="secondary" id="sound">🔊 音 ON</button><button class="secondary" id="home">🏠 単元を選ぶ</button></div><div class="panel"><div class="score" id="score">個人ポイント 0点</div><p id="mascot" class="muted">プンプン「ホームワークを食べるぞ！」</p></div><section id="menu" class="panel"><h2>どこから始める？</h2><select id="category"></select><div class="row" style="margin-top:16px"><button class="primary" id="start">この単元を始める</button><button class="secondary" id="wrong">まちがい復習</button><button class="secondary" id="resume">つづきから</button></div><p class="small">学習の続き・ポイントはこの端末に保存されます。ほかの端末とは共有されません。</p><p id="stats" class="muted"></p></section><section id="quiz" class="panel hide"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="row" style="margin-top:18px"><button class="primary" id="confirm" disabled>答えを選んでね</button><button class="secondary" id="back">前の問題へ</button><button class="secondary" id="favorite">☆ お気に入り</button></div></section><section id="done" class="panel hide"><h2>🎉 クリア！</h2><p id="doneText"></p><button class="primary" id="again">単元選択へ</button></section><p class="small muted">実際の応急手当では周囲の安全を確保し、119番の指示とAEDの音声案内に従ってください。学習用の問題です。</p></main><script>const DATA=[{"cat": "傷害の原因と防止", "q": "傷害が起こる原因の組み合わせは？", "a": "人的要因と環境要因", "opts": ["人的要因と環境要因", "運動要因と食事要因", "季節要因と年齢要因"]}, {"cat": "傷害の原因と防止", "q": "前を見ずに走るのは？", "a": "人的要因", "opts": ["人的要因", "環境要因", "自然災害"]}, {"cat": "傷害の原因と防止", "q": "暗い階段は？", "a": "環境要因", "opts": ["環境要因", "人的要因", "交通法規"]}, {"cat": "傷害の原因と防止", "q": "危険を事前に考えることは？", "a": "危険予測", "opts": ["危険予測", "応急手当", "二次災害"]}, {"cat": "傷害の原因と防止", "q": "危険を避ける行動は？", "a": "危険回避", "opts": ["危険回避", "無謀運転", "直接圧迫"]}, {"cat": "傷害の原因と防止", "q": "強い雨で地面が滑りやすいのは？", "a": "環境要因", "opts": ["環境要因", "人的要因", "犯罪要因"]}, {"cat": "傷害の原因と防止", "q": "日頃の避難訓練は何に役立つ？", "a": "傷害の防止", "opts": ["傷害の防止", "交通違反", "感染の拡大"]}, {"cat": "交通事故の現状と原因", "q": "中学生の交通事故で多い乗り物は？", "a": "自転車", "opts": ["自転車", "飛行機", "船"]}, {"cat": "交通事故の現状と原因", "q": "一時停止をしない行動は？", "a": "人的要因", "opts": ["人的要因", "環境要因", "自然要因"]}, {"cat": "交通事故の現状と原因", "q": "見通しの悪い交差点は？", "a": "環境要因", "opts": ["環境要因", "人的要因", "医療要因"]}, {"cat": "交通事故の現状と原因", "q": "交通事故の原因は何が重なって起こる？", "a": "人的・環境・車両の要因", "opts": ["人的・環境・車両の要因", "食事・睡眠・勉強", "天気だけ"]}, {"cat": "交通事故の現状と原因", "q": "自転車同士の事故も起こる？", "a": "起こる", "opts": ["起こる", "起こらない", "夜だけ起こる"]}, {"cat": "交通事故の現状と原因", "q": "ながらスマホ運転は？", "a": "危険な行動", "opts": ["危険な行動", "安全な行動", "環境整備"]}, {"cat": "交通事故の防止", "q": "交通事故を防ぐために守るのは？", "a": "交通法規", "opts": ["交通法規", "独自のルール", "友達の指示"]}, {"cat": "交通事故の防止", "q": "自転車で交差点に入る前は？", "a": "安全確認", "opts": ["安全確認", "加速", "目を閉じる"]}, {"cat": "交通事故の防止", "q": "道路の周囲を見て危険を考えるのは？", "a": "危険予測", "opts": ["危険予測", "二次災害", "止血"]}, {"cat": "交通事故の防止", "q": "道路標識を設置するのは交通環境の？", "a": "整備", "opts": ["整備", "破壊", "放置"]}, {"cat": "交通事故の防止", "q": "生活道路の最高速度を時速30kmに抑える区域は？", "a": "ゾーン30", "opts": ["ゾーン30", "AED", "コミュニティ"]}, {"cat": "交通事故の防止", "q": "周りの人の動きを考えるのは？", "a": "安全な行動", "opts": ["安全な行動", "無謀な行動", "犯罪被害"]}, {"cat": "交通事故の防止", "q": "夜の自転車で必要なのは？", "a": "ライトをつける", "opts": ["ライトをつける", "無灯火で走る", "スマホを見る"]}, {"cat": "犯罪被害の防止", "q": "犯罪が起こりやすいのは人目の？", "a": "少ない場所", "opts": ["少ない場所", "多い場所", "必ず明るい場所"]}, {"cat": "犯罪被害の防止", "q": "危険な場所や状況を事前に考えるのは？", "a": "危険予測", "opts": ["危険予測", "心肺蘇生", "応急処置"]}, {"cat": "犯罪被害の防止", "q": "身の危険を感じたときは？", "a": "助けを求める", "opts": ["助けを求める", "一人で我慢する", "ついていく"]}, {"cat": "犯罪被害の防止", "q": "防犯ブザーは何のため？", "a": "周囲に危険を知らせる", "opts": ["周囲に危険を知らせる", "遊ぶため", "交通整理のため"]}, {"cat": "犯罪被害の防止", "q": "地域で犯罪を防ぐ活動は？", "a": "見回り活動", "opts": ["見回り活動", "無謀運転", "胸骨圧迫"]}, {"cat": "犯罪被害の防止", "q": "自治体や警察が知らせるのは？", "a": "防犯情報", "opts": ["防犯情報", "テストの点数", "血圧"]}, {"cat": "自然災害に備えて", "q": "地震は発生を正確に予測することが？", "a": "難しい", "opts": ["難しい", "必ずできる", "毎回同じ時間"]}, {"cat": "自然災害に備えて", "q": "地震で家具が倒れることは？", "a": "転倒", "opts": ["転倒", "感染", "止血"]}, {"cat": "自然災害に備えて", "q": "災害後に火災などが起こることは？", "a": "二次災害", "opts": ["二次災害", "人的要因", "心肺蘇生"]}, {"cat": "自然災害に備えて", "q": "災害の正しい情報は？", "a": "災害情報", "opts": ["災害情報", "うわさ", "予想点数"]}, {"cat": "自然災害に備えて", "q": "情報を集めたあと必要なのは？", "a": "判断", "opts": ["判断", "無視", "放置"]}, {"cat": "自然災害に備えて", "q": "避難時に大切なのは？", "a": "安全の確保", "opts": ["安全の確保", "荷物を全部運ぶ", "写真を撮る"]}, {"cat": "自然災害に備えて", "q": "災害時に慌てず行うのは？", "a": "状況を確認して行動", "opts": ["状況を確認して行動", "うわさだけで動く", "危険な場所に戻る"]}, {"cat": "応急手当の意義と基本", "q": "けが人の状態や周囲を確かめるのは？", "a": "観察", "opts": ["観察", "放置", "予測"]}, {"cat": "応急手当の意義と基本", "q": "応急手当で救える可能性があるのは？", "a": "生命", "opts": ["生命", "交通法規", "天気"]}, {"cat": "応急手当の意義と基本", "q": "応急手当で和らげられるのは？", "a": "痛みや不安", "opts": ["痛みや不安", "交通渋滞", "地震"]}, {"cat": "応急手当の意義と基本", "q": "倒れている人を見つけたら最初に？", "a": "周囲の安全を確認", "opts": ["周囲の安全を確認", "すぐ水を飲ませる", "無理に立たせる"]}, {"cat": "応急手当の意義と基本", "q": "反応がない場合に必要なのは？", "a": "助けを呼び119番通報とAED依頼", "opts": ["助けを呼び119番通報とAED依頼", "その場を離れて放置", "すぐ食事をさせる"]}, {"cat": "応急手当の意義と基本", "q": "呼吸がない・普段どおりでないときは？", "a": "胸骨圧迫を始める", "opts": ["胸骨圧迫を始める", "歩かせる", "水を飲ませる"]}, {"cat": "応急手当の意義と基本", "q": "胸骨圧迫のテンポの目安は？", "a": "1分間に100〜120回", "opts": ["1分間に100〜120回", "1分間に10回", "1分間に200回"]}, {"cat": "応急手当の意義と基本", "q": "胸骨圧迫の深さの目安（成人）は？", "a": "約5cm（6cmを超えない）", "opts": ["約5cm（6cmを超えない）", "約1mm", "約15cm"]}, {"cat": "応急手当の意義と基本", "q": "AEDは何をする機器？", "a": "心臓の電気ショックが必要か判断する", "opts": ["心臓の電気ショックが必要か判断する", "骨折を治す", "血圧を測るだけ"]}, {"cat": "応急手当の意義と基本", "q": "出血を止める基本は？", "a": "直接圧迫止血", "opts": ["直接圧迫止血", "強くこする", "温め続ける"]}, {"cat": "応急手当の意義と基本", "q": "傷口に触れるときは？", "a": "感染を防ぐ", "opts": ["感染を防ぐ", "素手で必ず触る", "汚れた布を使う"]}, {"cat": "応急手当の意義と基本", "q": "骨折が疑われるときは？", "a": "むやみに動かさず固定", "opts": ["むやみに動かさず固定", "曲げ伸ばしする", "走らせる"]}, {"cat": "応急手当の意義と基本", "q": "脱臼が疑われるときは？", "a": "無理に戻さない", "opts": ["無理に戻さない", "強く引っ張る", "放置して運動する"]}, {"cat": "応急手当の意義と基本", "q": "捻挫したときは？", "a": "安静にして冷やす", "opts": ["安静にして冷やす", "走り続ける", "強く揉む"]}, {"cat": "応急手当の意義と基本", "q": "救急車を呼ぶ電話番号は？", "a": "119", "opts": ["119", "110", "117"]}];const cats=[...new Set(DATA.map(x=>x.cat))];const $=id=>document.getElementById(id);const KEY='healthQuizV1';let saved={score:0,wrong:[],fav:[],history:{},session:null};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}let state=null,selected=null,answered=false,soundOn=true;function store(){saved.session=state;localStorage.setItem(KEY,JSON.stringify(saved))}function tone(ok){if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'sawtooth';o.frequency.value=ok?740:170;g.gain.value=.06;o.start();o.stop(ctx.currentTime+.17);o.onended=()=>ctx.close()}catch(e){}}function score(){ $('score').textContent='個人ポイント '+saved.score+'点'}function menu(){state=null;store();$('quiz').classList.add('hide');$('done').classList.add('hide');$('menu').classList.remove('hide');$('stats').textContent='復習待ち '+saved.wrong.length+'問 ／ お気に入り '+saved.fav.length+'問';score()}function begin(ids,label){if(!ids.length){alert('まだ復習する問題はありません');return}state={ids,index:0,label};store();$('menu').classList.add('hide');$('done').classList.add('hide');$('quiz').classList.remove('hide');show()}function show(){selected=null;answered=false;let id=state.ids[state.index],q=DATA[id];$('progress').textContent=state.label+'　'+(state.index+1)+' / '+state.ids.length+'問';$('question').textContent=q.q;$('options').innerHTML='';q.opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>{if(answered)return;selected=o;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('confirm').disabled=false;$('confirm').textContent='この答えで決定！'};$('options').appendChild(b)});$('feedback').classList.add('hide');$('confirm').disabled=true;$('confirm').textContent='答えを選んでね';$('favorite').textContent=saved.fav.includes(id)?'★ お気に入り':'☆ お気に入り';store()}function finish(){state=null;store();$('quiz').classList.add('hide');$('done').classList.remove('hide');$('doneText').textContent='個人ポイント '+saved.score+'点！ おつかれさま！'}$('category').innerHTML=cats.map((c,i)=>'<option value="'+i+'">'+c+'</option>').join('')+'<option value="all">全部まとめて</option>';$('start').onclick=()=>{let v=$('category').value;begin(DATA.map((x,i)=>i).filter(i=>v==='all'||DATA[i].cat===cats[+v]),v==='all'?'総まとめ':cats[+v])};$('wrong').onclick=()=>begin([...saved.wrong],'まちがい復習');$('resume').onclick=()=>{if(saved.session&&saved.session.ids?.length){state=saved.session;$('menu').classList.add('hide');$('quiz').classList.remove('hide');show()}else alert('続きの問題はありません')};$('confirm').onclick=()=>{if(answered){state.index++;if(state.index>=state.ids.length)finish();else show();return}if(selected===null)return;answered=true;let id=state.ids[state.index],q=DATA[id],ok=selected===q.a;tone(ok);saved.history[id]=(saved.history[id]||0)+1;if(ok){saved.score+=10;saved.wrong=saved.wrong.filter(x=>x!==id)}else{saved.score=Math.max(0,saved.score-3);if(!saved.wrong.includes(id))saved.wrong.push(id)}score();$('feedback').classList.remove('hide');$('feedback').textContent=(ok?'🎉 正解！ ＋10点':'💥 ブッブー！ −3点')+'　選んだ答え：'+selected+' ／ 正解：'+q.a;if((state.index+1)%5===0)$('mascot').textContent=['🍎 さくちゃん「やんのかこら！ 5問やったぞ！」','プンプン「宿題うまーい！」','🐦 ポーグ「次もいける！」'][Math.floor(state.index/5)%3];$('confirm').textContent='次の問題へ →';$('confirm').disabled=false;store()};$('back').onclick=()=>{if(state.index>0){state.index--;show()}};$('favorite').onclick=()=>{let id=state.ids[state.index];saved.fav=saved.fav.includes(id)?saved.fav.filter(x=>x!==id):[...saved.fav,id];$('favorite').textContent=saved.fav.includes(id)?'★ お気に入り':'☆ お気に入り';store()};$('home').onclick=menu;$('again').onclick=menu;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};score();menu();</script></body></html>
