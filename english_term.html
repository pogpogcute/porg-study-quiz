'use strict';
const DATA=[{"unit":"比較級と最上級（復習）","q":"Ken is (   ) than Tom.（ケンはトムより背が高い）","choices":["tallest","tall","taller"],"answer":2,"why":"2人を比べるときは taller than。","level":1,"id":0},{"unit":"比較級と最上級（復習）","q":"This book is (   ) than that one.","choices":["more interesting","most interesting","interestingest"],"answer":0,"why":"interesting の比較級は more interesting。","level":2,"id":1},{"unit":"比較級と最上級（復習）","q":"Ken is (   ) boy in the class.","choices":["taller","tallest than","the tallest"],"answer":2,"why":"クラスの中で一番なら the tallest。","level":1,"id":2},{"unit":"比較級と最上級（復習）","q":"「big」の比較級は？","choices":["bigger","biger","biggest"],"answer":0,"why":"最後のgを重ねて bigger。","level":1,"id":3},{"unit":"比較級と最上級（復習）","q":"「easy」の最上級は？","choices":["the easiest","the easyest","the easier"],"answer":0,"why":"y を i に変えて easiest。","level":1,"id":4},{"unit":"比較級と最上級（復習）","q":"「good」の比較級は？","choices":["gooder","best","better"],"answer":2,"why":"good → better → best。","level":1,"id":5},{"unit":"比較級と最上級（復習）","q":"「well」の最上級は？","choices":["better","wellest","best"],"answer":2,"why":"well → better → best。","level":1,"id":6},{"unit":"比較級と最上級（復習）","q":"Which is (   ), this or that?（どちらがよい？）","choices":["best","goodest","better"],"answer":2,"why":"2つを比べる場合は better。","level":2,"id":7},{"unit":"比較級と最上級（復習）","q":"This is the (   ) difficult question.","choices":["most","much","more"],"answer":0,"why":"最上級は the most difficult。","level":2,"id":8},{"unit":"比較級と最上級（復習）","q":"Soccer is more popular (   ) baseball.","choices":["than","then","of"],"answer":0,"why":"比較級の後は than。","level":1,"id":9},{"unit":"比較級と最上級（復習）","q":"I like sushi the best (   ) all foods.","choices":["of","than","at"],"answer":0,"why":"「すべての食べ物の中で」は of all foods。","level":2,"id":10},{"unit":"比較級と最上級（復習）","q":"She runs the fastest (   ) our class.","choices":["in","than","at"],"answer":0,"why":"クラスという集団の中では in our class。","level":2,"id":11},{"unit":"比較級と最上級（復習）","q":"「bad」の比較級は？","choices":["badder","worse","worst"],"answer":1,"why":"bad → worse → worst。","level":2,"id":12},{"unit":"比較級と最上級（復習）","q":"I have (   ) books than Meg.","choices":["more","muchest","most"],"answer":0,"why":"「より多い」は more ... than。","level":2,"id":13},{"unit":"better と best（84〜85ページ）","q":"I like soccer (   ) than rugby.","choices":["good","better","best"],"answer":1,"why":"「ラグビーよりサッカーが好き」は better than。","level":1,"id":14},{"unit":"better と best（84〜85ページ）","q":"I like soccer (   ).（一番好き）","choices":["better","the best","more"],"answer":1,"why":"「一番好き」は like ... the best。","level":1,"id":15},{"unit":"better と best（84〜85ページ）","q":"You speak English (   ) than me.","choices":["best","gooder","better"],"answer":2,"why":"上手に話す（well）の比較級も better。","level":1,"id":16},{"unit":"better と best（84〜85ページ）","q":"You speak English (   ) in our class.","choices":["the best","better than","wellest"],"answer":0,"why":"クラスで一番上手に話すなら the best。","level":1,"id":17},{"unit":"better と best（84〜85ページ）","q":"Many classmates like other sports (   ) than basketball.","choices":["very","best","better"],"answer":2,"why":"like ... better than ... を使う。","level":2,"id":18},{"unit":"better と best（84〜85ページ）","q":"Seven of them like tennis (   ).","choices":["the best","better than","more"],"answer":0,"why":"「7人はテニスが一番好き」なので the best。","level":2,"id":19},{"unit":"better と best（84〜85ページ）","q":"「I like pandas the best of all animals.」の意味は？","choices":["動物の中でパンダが一番好き","パンダより動物が好き","パンダを飼っている"],"answer":0,"why":"the best of all animals は「全動物の中で一番」。","level":1,"id":20},{"unit":"better と best（84〜85ページ）","q":"10人中6人が一番好きなスポーツはサッカー。言い方は？","choices":["Six students like soccer the best.","Six students like soccer better then.","Six students are best soccer."],"answer":0,"why":"人数＋like＋物＋the best。","level":2,"id":21},{"unit":"better と best（84〜85ページ）","q":"「half」はどういう意味？","choices":["2倍","半分","10%"],"answer":1,"why":"half は「半分」。","level":1,"id":22},{"unit":"better と best（84〜85ページ）","q":"「percent」はどういう意味？","choices":["パーセント","グラフ","ページ"],"answer":0,"why":"percent はパーセント。","level":1,"id":23},{"unit":"better と best（84〜85ページ）","q":"「graph」はどういう意味？","choices":["グラフ","運動会","手紙"],"answer":0,"why":"graph = グラフ。","level":1,"id":24},{"unit":"better と best（84〜85ページ）","q":"「such」はどういう意味？","choices":["より速い","そのような","半分"],"answer":1,"why":"such = そのような。","level":1,"id":25},{"unit":"as ... as（86〜87ページ）","q":"Soccer is (   ) popular as tennis.","choices":["the","than","as"],"answer":2,"why":"「同じくらい」は as + 原級 + as。","level":1,"id":26},{"unit":"as ... as（86〜87ページ）","q":"This story is (   ) famous (   ) that one.","choices":["the / best","more / than","as / as"],"answer":2,"why":"as famous as の形を使う。","level":1,"id":27},{"unit":"as ... as（86〜87ページ）","q":"Soccer is not (   ) popular (   ) tennis.","choices":["more / most","as / as","than / best"],"answer":1,"why":"「～ほど…ではない」は not as ... as。","level":1,"id":28},{"unit":"as ... as（86〜87ページ）","q":"「as tall as」の意味は？","choices":["もっと背が高い","同じくらい背が高い","一番背が高い"],"answer":1,"why":"as tall as は背の高さが同じ程度。","level":1,"id":29},{"unit":"as ... as（86〜87ページ）","q":"「not as heavy as」の意味は？","choices":["一番重い","～より必ず重い","～ほど重くない"],"answer":2,"why":"not as ... as は「～ほど…でない」。","level":1,"id":30},{"unit":"as ... as（86〜87ページ）","q":"Meg is as old (   ) Tom.","choices":["as","than","in"],"answer":0,"why":"as old as。","level":1,"id":31},{"unit":"as ... as（86〜87ページ）","q":"Tom is not as tall as Meg. 正しい説明は？","choices":["メグの方が背が高い","トムの方が背が高い","2人は同じ身長"],"answer":0,"why":"トムはメグほど背が高くない。","level":2,"id":32},{"unit":"as ... as（86〜87ページ）","q":"「このペンはあのペンと同じくらい長い」は？","choices":["This pen is long than that one.","This pen is the longest that one.","This pen is as long as that one."],"answer":2,"why":"as long as で同じくらいの長さ。","level":2,"id":33},{"unit":"as ... as（86〜87ページ）","q":"「Lisa ate as much as Yuka.」の意味は？","choices":["リサはユカの2倍食べた","リサとユカは同じくらいの量を食べた","リサは何も食べなかった"],"answer":1,"why":"as much as は同じくらいの量。","level":2,"id":34},{"unit":"as ... as（86〜87ページ）","q":"「as soon as」と「as ... as」の違いに注意。人気が同じなら？","choices":["more popularity than","popular a ngs as (　) as Kota.","choices":["well","good","better"],"answer":0,"why":"歌うのを説明するので副詞 well。","level":2,"id":120},{"unit":"教科書86〜87ページ as ... as 応用","q":"同じくらい人気。「Soccer is (　) popular (　) tennis.」","choices":["as / as","more / as","as / than"],"answer":0,"why":"as popular as の形。","level":1,"id":121},{"unit":"教科書86〜87ページ as ... as 応用","q":"「野球はサッカーほど人気がない」Baseball is (　) as popular as soccer.","choices":["not","more","most"],"answer":0,"why":"not as popular as は～ほど人気がない。","level":1,"id":122},{"unit":"教科書86〜87ページ as ... as 応用","q":"語順を選ぼう。「I am not as tall as my brother.」のまとまりは？","choices":["I am / not as tall as / my brother.","I not / am tall as / as my brother.","I as / am not tall / my brother as."],"answer":0,"why":"I am＋not as tall as＋比較相手。","level":2,"id":123},{"unit":"教科書86〜87ページ as ... as 応用","q":"語順を選ぼう。「Time is as important as money.」のまとまりは？","choices":["Time is / as important as / money.","Time / as is important / as money.","Time as / money is / important as."],"answer":0,"why":"主語とbe動詞→as 原級 as→比較相手。","level":2,"id":124},{"unit":"教科書86〜87ページ as ... as 応用","q":"「よく走る」を比べるときの正しい語順は？","choices":["runs as fast as","as runs fast as","runs fast as as"],"answer":0,"why":"動詞 runs のあとに as fast as。","level":2,"id":125},{"unit":"教科書86〜87ページ as ... as 応用","q":"日本語のまとまりを選ぼう。「I am not as tired as Takuya.」","choices":["私は／拓哉ほど／疲れていません","私は／拓哉より／疲れています","私は／拓哉と／同じくらい疲れています"],"answer":0,"why":"not as ... as は「～ほど…ではない」。","level":2,"id":126},{"unit":"教科書86〜87ページ as ... as 応用","q":"正しい文はどれ？","choices":["My hair is as long as yours.","My hair is as longer as yours.","My hair is longer as yours."],"answer":0,"why":"as ... as の間は比較級でなく原級 long。","level":2,"id":127},{"unit":"教科書86〜87ページ as ... as 応用","q":"正しい文はどれ？","choices":["She plays soccer as well as Ken.","She plays soccer as better as Ken.","She plays soccer well as as Ken."],"answer":0,"why":"as well as の間は well の原級。","level":2,"id":128},{"unit":"教科書86〜87ページ as ... as 応用","q":"「私はあなたと同じくらい一生懸命勉強した」","choices":["I studied as hard as you.","I studied as harder as you.","I study as hard than you."],"answer":0,"why":"studied と as hard as を使う。","level":2,"id":129},{"unit":"教科書86〜87ページ as ... as 応用","q":"比較相手を変えて文を完成。「Ken is not as fast as Ryo.」と同じ意味は？","choices":["Ryo is faster than Ken.","Ken is faster than Ryo.","Ken and Ryo are as fast."],"answer":0,"why":"ケンがリョウほど速くない＝リョウのほうが速い。","level":3,"id":130},{"unit":"教科書86〜87ページ 単語と資料","q":"「feedback」の意味は？","choices":["意見・評価","計算式","目的地"],"answer":0,"why":"feedback は発表などへの意見・評価。","level":1,"id":131},{"unit":"教科書86〜87ページ 単語と資料","q":"「contact」の意味は？","choices":["接触・連絡","会場","順位"],"answer":0,"why":"eye contact で視線を合わせること。","level":1,"id":132},{"unit":"教科書86〜87ページ 単語と資料","q":"「data」の意味は？","choices":["資料・データ","発音","主題"],"answer":0,"why":"data はデータ。","level":1,"id":133},{"unit":"教科書86〜87ページ 単語と資料","q":"「spoke」は何の過去形？","choices":["speak","spell","spend"],"answer":0,"why":"speak → spoke。","level":1,"id":134},{"unit":"教科書86〜87ページ 単語と資料","q":"「clear」の意味は？","choices":["明瞭な・はっきりした","遠い","低い"],"answer":0,"why":"clear voice ははっきりした声。","level":1,"id":135},{"unit":"教科書86〜87ページ 単語と資料","q":"「slide」の意味は？","choices":["スライド","点数","応援"],"answer":0,"why":"presentation slides は発表用スライド。","level":1,"id":136}];
const KEY='boku-term-english-v1';const MASCOTS=[['saku','さくちゃん','🍎'],['porg','ポーグ','🐟'],['hollow','プンプン','📚'],['huggy','ハギー','🍪']];
const $=id=>document.getElementById(id);let store={history:[],favorites:[],weak:[],points:0,session:null};try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object')store={...store,...v,history:v.history||[],favorites:v.favorites||[],weak:v.weak||[]};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function show(name){['home','quiz','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==name));scrollTo(0,0);}
function drawPoints(){$('points').textContent='⭐ '+store.points+' pt'}
function mascot(i){const x=MASCOTS[(i+MASCOTS.length)%MASCOTS.length];return {id:x[0],name:x[1],food:x[2],src:'mascot-'+x[0]+'.jpg'};}
function home(){drawPoints();show('home');const u=[...new Set(DATA.map(q=>q.unit))];$('units').replaceChildren();u.forEach(unit=>{const n=DATA.filter(q=>q.unit===unit),done=store.history.filter(x=>x.unit===unit).length,ok=store.history.filter(x=>x.unit===unit&&x.correct).length;const b=document.createElement('button');b.className='btn unitBtn';b.textContent=unit+'（'+n.length+'問）　'+(done?'これまで '+ok+'/'+done+'正解':'未着手');b.addEventListener('click',()=>start(n.map(x=>x.id),unit));$('units').append(b)});$('resume').style.display=store.session?'block':'none';$('weak').disabled=!store.weak.length;$('fav').disabled=!store.favorites.length;}
function shuffle(arr){arr=[...arr];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function start(ids,label){store.session={ids:shuffle(ids),label,index:0,selected:null,correct:0,answered:0,done:[],start:Date.now()};save();render();}
function render(){const s=store.session;if(!s){home();return;}if(s.index>=s.ids.length){finish();return;}show('quiz');drawPoints();const q=DATA.find(x=>x.id===s.ids[s.index]);$('unitBadge').textContent=q.unit;$('indexBadge').textContent=(s.index+1)+' / '+s.ids.length+'問';$('bar').style.width=(s.index/s.ids.length*100)+'%';$('question').textContent=q.q;const area=$('answers');area.replaceChildren();q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='ans'+(s.selected!==null?(i===q.answer?' ok':i===s.selected?' ng':''):'');b.textContent=['ア','イ','ウ'][i]+'　'+c;b.disabled=s.selected!==null;b.addEventListener('click',()=>answer(i));area.append(b)});$('star').textContent=store.favorites.includes(q.id)?'❤️ お気に入り登録中':'☆ お気に入りに入れる';$('feedback').classList.toggle('hidden',s.selected===null);$('next').classList.toggle('hidden',s.selected===null);if(s.selected!==null){const c=s.selected===q.answer;const x=mascot(s.index);$('feedback').textContent=(c?'🌟 '+x.name+'「やった！ '+x.food+'ゲット！」':'💦 '+x.name+'「くぅ〜！ 次で取り返そう！」')+'\n'+q.why; $('feedback').style.whiteSpace='pre-line';} }
function answer(i){const s=store.session;if(!s||s.selected!==null)return;const q=DATA.find(x=>x.id===s.ids[s.index]);const ok=i===q.answer;const pt=ok?(q.level===3?20:q.level===2?15:10):0;s.selected=i;s.answered++;if(ok){s.correct++;store.weak=store.weak.filter(x=>x!==q.id);}else if(!store.weak.includes(q.id))store.weak.push(q.id);store.points=Math.max(0,store.points+pt);store.history.push({unit:q.unit,correct:ok,level:q.level,at:Date.now(),id:q.id});save();render();}
function next(){const s=store.session;if(!s||s.selected===null)return;s.index++;s.selected=null;save();if(s.index>0&&s.index%5===0){const x=mascot((s.index/5)-1);$('cheerImage').src=x.src;$('cheerImage').alt=x.name;$('cheerTitle').textContent=s.index+'問やったぞ！';$('cheerText').textContent=x.name+'「'+(s.index%10?'おつかれ！ '+x.food+'を食べてパワーアップ！':'すごいぞ！ 次もいこう！')+'」';$('cheer').classList.remove('hidden')}else if(s.index>=s.ids.length)finish();else render();}
function finish(){const s=store.session;if(!s)return;show('finish');$('summary').textContent=s.answered+'問チャレンジ・正解 '+s.correct+'問！ ポイントは '+store.points+' pt';store.session=null;save();drawPoints();}
$('mascotRow').innerHTML=MASCOTS.map(([id,name])=>'<img src="mascot-'+id+'.jpg" alt="'+name+'">').join('');$('back').onclick=home;$('next').onclick=next;$('resume').onclick=render;$('star').onclick=()=>{const s=store.session;if(!s)return;const id=s.ids[s.index];store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render();};$('weak').onclick=()=>start(store.weak,'苦手だけ復習');$('fav').onclick=()=>start(store.favorites,'お気に入り復習');$('all').onclick=()=>start(shuffle(DATA.map(x=>x.id)).slice(0,20),'まとめ20問');$('again').onclick=home;$('cheerNext').onclick=()=>{$('cheer').classList.add('hidden');if(store.session?.index>=store.session?.ids.length)finish();else render()};home();
</script><script src="study-telemetry.js" data-subject="英語" data-title="Unit 6 二学期期末・教科書74〜75・86〜87ページ" data-source="english_term" data-test="term"></script><script src="study-ote.js?v=1" defer></script>
