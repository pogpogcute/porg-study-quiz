function shuffleIds(){const a=CHARACTERS.map(c=>c.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 1問に1人ずつ主役として登場。6問以内に必ず全員が出て、同じ6問内では重複なし。
function actorFor(index){
 if(!STATE)return CHARACTERS[0];
 if(!Array.isArray(STATE.actorOrder))STATE.actorOrder=[];
 let changed=false;
 while(STATE.actorOrder.length<=index){
   let next=shuffleIds();
   const last=STATE.actorOrder[STATE.actorOrder.length-1];
   if(last&&next[0]===last){const i=next.findIndex(x=>x!==last);[next[0],next[i]]=[next[i],next[0]];}
   STATE.actorOrder.push(...next);changed=true;
 }
 if(changed)save(K.state,STATE);
 return CHARACTERS.find(c=>c.id===STATE.actorOrder[index])||CHARACTERS[0];
}
function friendFor(index){
 const star=actorFor(index);
 const pos=CHARACTERS.findIndex(c=>c.id===star.id);
 return CHARACTERS[(pos+3)%CHARACTERS.length];
}
function speakerFor(){return actorFor(STATE?STATE.index:0);}

function sceneQuestion(q){
 const actor=speakerFor(),friend=friendFor(STATE.index);
 const rena=q.speaker==='pii'?friend:actor,pii=q.speaker==='pii'?actor:friend;
 function convert(t){return typeof t==='string'?t.replace(/\bRena\b/g,CHARACTER_EN[rena.id]).replace(/\bPii\b/g,CHARACTER_EN[pii.id]).replace(/レナ/g,CHARACTER_JP[rena.id]).replace(/ピイ/g,CHARACTER_JP[pii.id]):t;}
 const out={...q};
 for(const k of ['jp','en','question','rule','home'])if(out[k])out[k]=convert(out[k]);
 for(const k of ['choices','tokens','answers'])if(Array.isArray(out[k]))out[k]=out[k].map(convert);
 return out;
}

function tone(freq,start,dur,type='sine',gain=.028){if(!SOUND_ON)return; try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(gain,start+0.01); g.gain.exponentialRampToValueAtTime(0.0001,start+dur); o.connect(g); g.connect(audioCtx.destination); o.start(start); o.stop(start+dur+0.02);}catch(e){}}
function playSound(kind){
 SOUND_ON=load('study-sound-enabled',SOUND_ON);if(!SOUND_ON)return;
 try{
 audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 const t=audioCtx.currentTime+0.01;
 if(kind==='ok'){
   const patterns=[[523,659,784],[659,784,1047],[587,740,988],[523,784,1047]];
   const p=patterns[Math.floor(Math.random()*patterns.length)];
   p.forEach((f,i)=>tone(f,t+i*.09,.15,i===1?'sine':'triangle',.027));
 }else if(kind==='comeback'){
   [392,523,659,880].forEach((f,i)=>tone(f,t+i*.10,.18,'triangle',.035));
   tone(1175,t+.42,.22,'sine',.018);
 }else if(kind==='mega'){
   [392,523,659,784,1047].forEach((f,i)=>tone(f,t+i*.095,.21,'triangle',.033));
   [659,784,1047].forEach((f,i)=>tone(f,t+.57+i*.10,.24,'sine',.027));
   tone(1318,t+.92,.42,'triangle',.033);
 }else if(kind==='ng'){
   const p=Math.random()<.5?[[330,.1],[294,.18]]:[[330,.11],[247,.17]];
   p.forEach(([f,d],i)=>tone(f,t+i*.11,d,'triangle',.019));
 }else if(kind==='break'){
   [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.095,.16,'sine',.029));
 }else if(kind==='finish'){
   [523,659,784,1047,1318].forEach((f,i)=>tone(f,t+i*.12,.25,'triangle',.032));
 }
 }catch(e){}
}

   h+='</div>';
 });
 h+='<div class="krow">';
 ["'", ".", ",", "?", "!", "-"].forEach(ch=>h+=`<button class="kkey punct" data-key="${ch}">${ch}</button>`);
 h+='</div>';
 h+='<div class="krow"><button class="kkey wide action" data-action="space">space</button><button class="kkey wide action" data-action="back">← 1字けす</button><button class="kkey wide action" data-action="clear">ぜんぶけす</button></div>';
 h+='<div class="khelper">ふつうのQWERTY配列です。小文字でOK。</div></div>';
 return h;
}
function home(){ $("app").classList.remove("playcompact");
 const app=$("app"), weak=weakItems();
 let html=`<div class="start"><div class="hero roster">${homeHeroes()}</div><h2>推しキャラ応援団の英語ミッション</h2>
 <p>穴埋めは<b>チャッピー特製キーボード</b>で入力します。</p><p>応援キャラ全6人！ 6問で全員が1回ずつ主役になるよ。正解したら一緒に大喜び！</p>
 <div class="panel"><b>スマホのキーボードは開きません。</b><br>
 予測変換も学習履歴も出ません。<br>
 1問答えるたびに自動保存します。</div>`;
 if(STATE && !STATE.done && STATE.items && STATE.index<STATE.items.length){
   html+=`<button class="btn main" id="resume">▶ 途中から再開（${STATE.index+1}/${STATE.items.length}）</button>`;
 }
 html+=`<h2 class="sectiontitle">期末テスト（Unit 6・比較級・最上級）</h2><div class="panel">基本は「期末①」から。5問ごとに休けい！<br>①〜③：er than / the ～est　④：more / the most　⑤：better / the best<br>※81ページは演習なし</div><div class="missiongrid">`;
 DATA.missions.filter(m=>m.id.startsWith('u6')).forEach(m=>{
   html+=`<div class="mission"><h3>${friendlyMissionText(m.title)}</h3><p>${friendlyMissionText(m.intro)}</p><button class="btn good" data-start="${m.id}">この単元をやる</button></div>`;
 });
 html+=`</div><button class="btn main" id="unit6complete">新・全範囲まとめ20問（78〜80、82〜85ページ）</button><button class="btn sub" id="unit6final">旧・期末まとめ20問</button>
 <div class="bonus-entry"><div class="bonus-star">★ おまけミッション ★</div><h3>推しキャラ大さわぎ！</h3><p>プリンの大きさ、くしゃみの音、サメ型スリッパ……変な事件で比べる文の復習！ まずは3択だから安心。20問ありますが、5問で休けいできます。</p><button class="btn bonus-btn" data-start="bonus_u6">おまけで遊ぶ！</button></div>
 <h2 class="sectiontitle">これまでの英語ミッション</h2><div class="missiongrid">`;
 DATA.missions.filter(m=>!m.id.startsWith('u6') && m.id!=='bonus_u6').forEach(m=>{
   html+=`<div class="mission"><h3>${friendlyMissionText(m.title)}</h3><p>${friendlyMissionText(m.intro)}</p><button class="btn good" data-start="${m.id}">この単元をやる</button></div>`;
 });
 html+=`</div>`;
 if(weak.length)html+=`<button class="btn hint" id="weak">苦手だけ特訓（${weak.length}問）</button>`;
 html+=`<button class="btn main" id="final">まとめテスト20問</button></div>`;
 app.innerHTML=html;$("bar").style.width="0%";
 const r=$("resume");if(r)r.onclick=()=>{TYPED="";ORDER_SELECTED=[];render()};
 document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startMission(b.dataset.start));
 const w=$("weak");if(w)w.onclick=startWeak;
 $("final").onclick=startFinal;
 $("unit6final").onclick=startUnit6Final;
 $("unit6complete").onclick=startUnit6Complete;
}

function startMission(mid){
 const m=missionById(mid);
 STATE={mode:"mission",mid,stage:"practice",items:m.questions.map((q,i)=>({mid,idx:i,phase:"practice"})),index:0,score:0,miss:0,answers:{},wrong:[],done:false,breakSeen:{}};
 TYPED="";ORDER_SELECTED=[];saveAll();
 $("app").innerHTML=`<div class="start"><div class="hero roster">${rosterHTML()}</div><h2>${friendlyMissionText(m.title)}</h2><p>${friendlyMissionText(m.intro)}</p>
 <div class="panel">${m.questions.length}問ありますが、5問ごとに小休けい。<br><b>穴埋めは画面の英字キーをタップします。</b></div><button class="btn main" id="go">スタート</button></div>`;
 $("go").onclick=render;
}
function startWeak(){
 const w=weakItems().slice(0,20);
 STATE={mode:"weak",stage:"weak",items:w.map(x=>({mid:x.mid,idx:x.idx,phase:"practice"})),index:0,score:0,miss:0,answers:{},wrong:[],done:false,breakSeen:{}};
 TYPED="";ORDER_SELECTED=[];saveAll();render();
}
function startFinal(){
 STATE={mode:"final",stage:"final",items:DATA.final.map((q,i)=>({idx:i,phase:"final"})),index:0,score:0,miss:0,answers:{},wrong:[],done:false,breakSeen:{}};
 TYPED="";ORDER_SELECTED=[];saveAll();render();
}


function orderButtons(q,rec){
 const selected=rec?null:ORDER_SELECTED;
 const tokens=q.tokens;
 if(rec)return `<div class="virtualinput">${rec.value||''}</div>`;
 return `<div class="virtualinput orderline" id="orderPreview">${selected.length?selected.map(i=>tokens[i]).join(' '):'下の言葉を順番にタップ！'}</div>
 <div class="ordergrid">${tokens.map((word,i)=>`<button class="wordchip ${selected.includes(i)?'picked':''}" data-token="${i}" ${selected.includes(i)?'disabled':''}>${word}</button>`).join('')}</div>
 <div class="orderactions"><button class="btn sub" id="undoOrder">ひとつ戻す</button><button class="btn sub" id="clearOrder">全部やり直す</button></div>
 <button class="btn main nextbig" id="checkOrder">これで答える</button>`;
}
function submitOrder(q,item){
 if(currentRec()||ORDER_SELECTED.length!==q.tokens.length)return;
 const val=ORDER_SELECTED.map(i=>q.tokens[i]).join(' ');
 record(q,item,norm(val)===norm(q.answers[0]),{value:val});
}

function startUnit6Final(){
 STATE={mode:"unit6final",stage:"final",items:DATA.unit6Final.map((q,i)=>({idx:i,phase:"unit6final"})),index:0,score:0,miss:0,answers:{},wrong:[],done:false,breakSeen:{}};
 TYPED="";ORDER_SELECTED=[];saveAll();render();
}
function startUnit6Complete(){
 STATE={mode:"unit6complete",stage:"final",items:DATA.unit6Complete.map((q,i)=>({idx:i,phase:"unit6complete"})),index:0,score:0,miss:0,answers:{},wrong:[],done:false,breakSeen:{}};
 TYPED="";ORDER_SELECTED=[];saveAll();render();
}
function render(){
 if(!STATE||STATE.done)return home();
 if(STATE.index>=STATE.items.length)return endStage();
 if([5,10,15].includes(STATE.index)&&!STATE.breakSeen[STATE.index])return showBreak();

 const item=STATE.items[STATE.index], q=sceneQuestion(qFromItem(item)), rec=currentRec(); $("app").classList.add("playcompact");
 const sp=speakerFor();
 const mode=STATE.stage==="mini"?"ミニテスト":STATE.mode==="weak"?"苦手特訓":STATE.mode==="unit6complete"?"Unit6全範囲":STATE.mode==="unit6final"?"期末まとめ":STATE.mode==="final"?"まとめテスト":"練習";
 let instruction=q.type==="order"?"【単語を順番にタップして英文を作ろう】":q.type==="fill"?"【空欄に入る英語を、下のキーで作ろう】":q.cat==="まちがい直し"?"【まちがっている部分を、正しい形に直そう】":"【いちばん合う答えを1つ選ぼう】";

 let html=`<div class="meta"><span class="pill topic">${q.cat}</span><span class="pill mode">${mode}</span></div>
 <div class="speaker"><div class="avatar">${sp.svg()}</div><div><div class="sname">${sp.name}</div><div class="sline">${rec?"ここを覚えよう！":"ゆっくり見れば大丈夫！"}</div></div></div>
 <div class="instruction">${instruction}</div><div class="question">${q.jp||""}${q.en?`<span class="eng">${q.en}</span>`:""}${q.question?`<span class="eng">${q.question}</span>`:""}</div>`;

 if(q.type==="fill"){
   html+=`<div class="virtualinput" id="virtualInput">${rec ? (rec.value||"") : TYPED || "ここに答えが入ります"}</div>${keyboardHTML()}
   <button class="btn main nextbig" id="check">これで答える</button>`;
 }else if(q.type==="order"){
   html+=orderButtons(q,rec);
 }else{
   html+=`<div class="choicegrid">${q.choices.map((v,i)=>`<button class="choice" data-choice="${i}">${v}</button>`).join("")}</div>`;
 }

 html+=`<div id="fb">${rec?"":'<div class="feedback"><span class="small">わからなかったらヒントを使ってOK。</span></div>'}</div>
 <div class="controls"><button class="btn sub" id="back">← 前へ</button><button class="btn hint" id="hint">ヒント</button><button class="btn main" id="next">次へ →</button></div>
 <div class="playtop"><span class="miniStat">正解 ${STATE.score}</span><span class="miniStat">ミス ${STATE.miss}</span><span class="miniStat">${STATE.index+1}/${STATE.items.length}</span></div>
 <div class="saveinfo">自動保存済み</div>`;

 $("app").innerHTML=html;
 $("bar").style.width=Math.round(STATE.index/Math.max(1,STATE.items.length)*100)+"%";
 $("back").disabled=STATE.index===0;$("next").disabled=!rec;
 $("back").onclick=()=>{if(STATE.index>0){STATE.index--;TYPED="";ORDER_SELECTED=[];saveAll();render()}};
 $("next").onclick=()=>{STATE.index++;TYPED="";ORDER_SELECTED=[];saveAll();render()};
 $("hint").onclick=()=>{$("fb").innerHTML=`<div class="feedback"><div class="big">ヒント</div><div class="rulecard">${q.rule}</div>${q.school?`<div class="school">学校のことば：${q.school}<br>家のことば：${q.home}</div>`:""}</div>`};

 if(q.type==="fill"){
   const update=()=>{$("virtualInput").textContent=TYPED||"ここに答えが入ります"};
   document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{if(rec)return;TYPED+=b.dataset.key;update()});
   document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
     if(rec)return;
     const a=b.dataset.action;
     if(a==="space")TYPED+=" ";
     if(a==="back")TYPED=TYPED.slice(0,-1);
     if(a==="clear")TYPED="";
     update();
   });
   $("check").onclick=()=>submitFill(q,item,TYPED);
 } else if(q.type==="order"){
   const refresh=()=>{const p=$("orderPreview");if(p)p.textContent=ORDER_SELECTED.length?ORDER_SELECTED.map(i=>q.tokens[i]).join(' '):'下の言葉を順番にタップ！';
     document.querySelectorAll('[data-token]').forEach(b=>{const yes=ORDER_SELECTED.includes(Number(b.dataset.token));b.disabled=yes;b.classList.toggle('picked',yes)});
     const check=$("checkOrder");if(check)check.disabled=ORDER_SELECTED.length!==q.tokens.length;
   };
   if(!rec){document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{ORDER_SELECTED.push(Number(b.dataset.token));refresh()});
     $("undoOrder").onclick=()=>{ORDER_SELECTED.pop();refresh()};
     $("clearOrder").onclick=()=>{ORDER_SELECTED=[];refresh()};
     $("checkOrder").onclick=()=>submitOrder(q,item);
     refresh();}
 } else {
   document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>confirmChoice(q,item,Number(b.dataset.choice)));
 }
 if(rec)showResult(q,rec);
}

function submitFill(q,item,val){
 if(currentRec()||!val.trim())return;
 const ok=q.answers.some(a=>norm(a)===norm(val));
 record(q,item,ok,{value:val});
}
function answerModal(content,buttons){
 document.getElementById('answerModal')?.remove();
 const overlay=document.createElement('div');overlay.id='answerModal';overlay.className='answer-overlay';
 const dialog=document.createElement('div');dialog.className='answer-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');
 dialog.innerHTML=content;const actions=document.createElement('div');
 buttons.forEach(([label,fn,kind])=>{const b=document.createElement('button');b.className='btn '+(kind||'main');b.textContent=label;b.onclick=()=>{overlay.remove();fn()};actions.appendChild(b)});
 dialog.appendChild(actions);overlay.appendChild(dialog);document.body.appendChild(overlay);
}
function confirmChoice(q,item,idx){
 if(currentRec())return;
 document.querySelectorAll('[data-choice]').forEach((b,i)=>b.classList.toggle('selected',i===idx));
 const selected=q.choices[idx];
 answerModal(`<h2>これで決定？</h2><p>選んだ答え<br><strong>${escapeAnswer(selected)}</strong></p>`,[
 ['選び直す',()=>{},'sub'],['決定！',()=>submitChoice(q,item,idx),'main']]);
}
function escapeAnswer(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showAnswerPopup(q,idx,ok){
 const actor=speakerFor(),friend=friendFor(STATE.index);
 const correct=escapeAnswer(q.choices[q.correct]);const chosen=escapeAnswer(q.choices[idx]);
 const level=STATE.answers[answerKey()]?.celebration||'normal';
 const body=ok?`<h2>大正解！！</h2>${celebrationHTML(level,actor,friend)}`:
 `<h2>キリッ！ここを覚えよう</h2><div class="answer-actor">${actor.svg()}<strong>${escapeAnswer(actor.short)}</strong></div><p>選んだ答え：${chosen}<br>正解：<strong>${correct}</strong></p><div class="rulecard">${q.rule||'正解を確認して、もう一度挑戦しよう！'}</div>`;
 answerModal(body,[['わかった！ 次へ',()=>{if(STATE.index<STATE.items.length-1){STATE.index++;TYPED='';ORDER_SELECTED=[];saveAll()}render()},'main']]);
}
function submitChoice(q,item,idx){
 if(currentRec())return;
 const ok=idx===q.correct;record(q,item,ok,{choice:idx},true);showAnswerPopup(q,idx,ok);
}
function record(q,item,ok,extra,deferRender=false){
 const prior=mistakeCount(item);
 const celebration=ok?(prior>=2?'mega':prior>=1?'comeback':'normal'):null;
 STATE.answers[answerKey()]={ok,...extra,celebration};
 if(ok){STATE.score++;playSound(celebration==='normal'?'ok':celebration);
   // トップページと共有するキャラクター別バルーンポイント。
   try{const actor=actorFor(STATE.index);const key='study_mascot_balloon_v1';const points=JSON.parse(localStorage.getItem(key)||'{}');points[actor.id]=(Number(points[actor.id])||0)+10;localStorage.setItem(key,JSON.stringify(points));}catch(e){}
 }
 else{
   playSound('ng');
   STATE.miss++;STATE.wrong.push(item);
   MISTAKES[mistakeId(item)]=prior+1;
   save(MISTAKE_KEY,MISTAKES);
   const pos=Math.min(STATE.items.length,STATE.index+3+Math.floor(Math.random()*3));
   STATE.items.splice(pos,0,{...item,retry:true});
 }
 if(item.phase==='practice'){
   const r=STATS[statKey(item.mid,item.idx)];
   if(r){if(ok){r.right++;r.mastery=Math.min(3,r.mastery+1)}else{r.wrong++;r.mastery=Math.max(-2,r.mastery-1)}}
 }
 saveAll();if(!deferRender)render();
 // 3択だけでなく穴埋め・並べ替えも、正解するたびに主役キャラが大喜びする。
 if(ok && q.type!=='choice'){
   const actor=speakerFor(),friend=friendFor(STATE.index);
   answerModal(`<h2>大正解！！</h2>${celebrationHTML(celebration||'normal',actor,friend)}`,
     [['やった！ 結果を見る',()=>{},'main']]);
 }
}

function showResult(q,rec){
 $('next').disabled=false;
 if(q.type==='fill'){
   document.querySelectorAll('.kkey').forEach(b=>b.disabled=true);
   $('check').disabled=true;
 }else if(q.type==='order'){
   document.querySelectorAll('[data-token]').forEach(b=>b.disabled=true);
   ['checkOrder','undoOrder','clearOrder'].forEach(id=>{const b=$(id);if(b)b.disabled=true});
 }else{
   document.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');if(i===rec.choice&&!rec.ok)b.classList.add('wrong')});
 }
 const correct=(q.type==='fill'||q.type==='order')?q.answers[0]:q.choices[q.correct];
 const actor=speakerFor(),friend=friendFor(STATE.index);
 const level=rec.celebration||(rec.ok?'normal':null);
 $('fb').innerHTML=rec.ok
 ? `${celebrationHTML(level,actor,friend)}<div class="feedback"><div class="rulecard">${q.rule}</div></div>`
 : `<div class="resultbanner ng">あと少し！ 次にできればOK！<br>正解は「${correct}」</div><div class="feedback"><div class="rulecard">${q.rule}</div>${q.school?`<div class="school">学校のことば：${q.school}<br>家のことば：${q.home}</div>`:''}</div>`;
}

function showBreak(){ $("app").classList.remove("playcompact");
 playSound('break');
 const m=STATE.mid?missionById(STATE.mid):null,n=STATE.index,idx=n===5?0:n===10?1:2;
 const breakMessage=['みんな集合！ポーグもさくちゃんもサメも大はしゃぎ！','全員でバンザイ！ゲイリーが遅れて拍手！','あと少し！プランクトンが勝手に優勝パレード！'][idx];
 STATE.breakSeen[n]=true;saveAll();
 $("app").innerHTML=`<div class="break"><div class="hero roster">${rosterHTML()}</div><h2 class="party-headline">${n}問進んだ！ よっしゃーー！</h2><p>${breakMessage}</p><p>正解でも、まちがえても、ここまで進んだのがえらい！</p>
 <p><b>ここで止めても大丈夫。自動保存済みです。</b></p><button class="btn main" id="cont">つづける</button><button class="btn sub" id="stop">今日はここまで</button></div>`;
 $("cont").onclick=render;$("stop").onclick=home;
}
function endStage(){ $("app").classList.remove("playcompact");
 if(STATE.mode==="mission"&&STATE.stage==="practice"){
   const m=missionById(STATE.mid);
   $("app").innerHTML=`<div class="start"><div class="hero roster">${rosterHTML()}</div><h2>練習${m.questions.length}問突破！</h2>
   <p><b>ここでは勝手に次へ進みません。</b></p><div class="panel">ここまで自動保存済み。<br>ミニテストをするか、今日は終わるか選べます。</div>
   <button class="btn main" id="mini">ミニテスト5問へ</button><button class="btn sub" id="stop">今日はここまで</button></div>`;
   $("mini").onclick=()=>{STATE.stage="mini";STATE.items=m.mini.map((q,i)=>({mid:m.id,idx:i,phase:"mini"}));STATE.index=0;STATE.score=0;STATE.miss=0;STATE.answers={};STATE.wrong=[];STATE.breakSeen={};TYPED="";ORDER_SELECTED=[];saveAll();render()};
   $("stop").onclick=home;return;
 }
 finish();
}
function finish(){ $("app").classList.remove("playcompact");
 playSound('finish');
 const hist=load(K.history,[]);
 hist.unshift({time:Date.now(),mode:STATE.mode,mid:STATE.mid||"",stage:STATE.stage,score:STATE.score,miss:STATE.miss});
 save(K.history,hist.slice(0,20));
 STATE.done=true;saveAll();
 $("app").innerHTML=`<div class="start"><div class="hero roster">${rosterHTML()}</div><h2>ミッションクリア！ やったーー！！</h2><p>正解 <b>${STATE.score}</b>　ミス <b>${STATE.miss}</b></p>
 <div class="panel">結果は保存しました。</div><button class="btn main" id="home">トップへ</button></div>`;
 $("home").onclick=()=>{STATE=null;save(K.state,null);home()};
}
const soundBtn=$('soundToggle'); if(soundBtn){updateSoundButton(); soundBtn.onclick=toggleSound;}
home();
</script>
