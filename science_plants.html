function score(){return Object.values(S.stats).filter(x=>x.tries).length}
function showMascots(){let h='';MASCOTS.forEach(([code,name],i)=>{let f=S.food[i]||0;h+=`<div class="mascot"><img src="mascot-${code}.jpg" alt="${name}"><b>${name}</b><div class="foodline"><span style="width:${f}%"></span></div><small>${Math.round(f)}%満腹</small></div>`});$('mascots').innerHTML=h}
function home(){S.session=null;save();showMascots();const weak=Q.filter(q=>S.stats[q.id]?.lastCorrect===false),fav=Q.filter(q=>S.favorites.includes(q.id)),done=score();let html=`<div class="box"><div class="tags"><span class="pill">⭐ ${S.points}点</span><span class="pill">経験した問題 ${done}/${Q.length}</span></div><p class="hint">あしたの習熟度に出る8単元を優先！ 「葉と根」「シダとコケ」は追加の練習です。</p><div class="grid">`;UNIT_NAMES.forEach((u,i)=>{const count=Q.filter(q=>q.unit===u).length;html+=`<button class="btn full" data-unit="${i}">${['🌸','💪','💧','🐸','🪨','⚗️','🔥','🍃','🌿','🍀'][i]} ${u}<br><small>${count}問・単元から選ぶ</small></button>`});html+=`</div><button class="btn full" data-special="weak">🔄 まちがえた問題だけ ${weak.length}問</button><button class="btn full" data-special="fav">⭐ お気に入りだけ ${fav.length}問</button><button class="btn full primary" data-special="required">🔥 あしたの範囲だけ・まぜこぜ10問</button><button class="btn full" data-special="all">🎲 全範囲まぜこぜ10問（補充含む）</button></div><div class="note">最初から難しい問題に挑まなくてもOK。覚えてから、言い換えや図を見る問題に進めます。途中で閉じても問題番号と解答履歴は保存されます。</div>`;el(html);document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>choose(UNIT_NAMES[+b.dataset.unit]));document.querySelectorAll('[data-special]').forEach(b=>b.onclick=()=>start(b.dataset.special))}
function choose(u){let z=Q.filter(q=>q.unit===u);const n=l=>z.filter(q=>q.level===l).length;el(`<div class="box"><h2>${escapeHTML(u)}</h2>${u.includes('追加')?'<p class="note">これは補充学習です。指定の習熟度範囲の達成率には含めないでください。</p>':''}<p class="hint">大きい文字で1問ずつ進みます。3択以外に、順番と短い入力があります。</p><button class="btn full" data-level="1">🍎 やさしい（+10点） ${n(1)}問</button><button class="btn full" data-level="2">🌟 ふつう（+20点） ${n(2)}問</button><button class="btn full" data-level="3">🏆 むずかしい（+35点） ${n(3)}問</button><button class="btn full primary" data-level="0">🎲 この単元をまぜこぜ</button><button class="btn full" id="back">← 単元にもどる</button></div>`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start('unit',u,+b.dataset.level));$('back').onclick=home}
function optionOrder(q){let code=0;const key=q.id+'|'+(S.session?.seed||'previous');for(let j=0;j<key.length;j++)code=(code*33+key.charCodeAt(j))|0;return q.options.map((a,i)=>({a,i})).sort((x,y)=>{let hx=((code^((x.i+1)*0x9e3779b9))>>>0);let hy=((code^((y.i+1)*0x9e3779b9))>>>0);hx^=hx>>>16;hx=Math.imul(hx,0x85ebca6b);hy^=hy>>>16;hy=Math.imul(hy,0x85ebca6b);return(hx>>>0)-(hy>>>0)});}
function shuffled(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function start(mode,u=null,l=0){let a=Q.filter(q=>mode==='unit'?q.unit===u&&(!l||q.level===l):mode==='weak'?S.stats[q.id]?.lastCorrect===false:mode==='fav'?S.favorites.includes(q.id):mode==='required'?REQUIRED_UNITS.includes(q.unit):true);if(!a.length){el('<div class="box"><h2>この問題はまだありません</h2><button class="btn full" id="back">もどる</button></div>');$('back').onclick=home;return}a=shuffled(a).slice(0,10);S.session={seed:Date.now().toString(36),ids:a.map(q=>q.id),i:0,results:{},breakSeen:[],title:u||({'weak':'苦手だけ','fav':'お気に入り','all':'全範囲まぜこぜ','required':'あしたの範囲'}[mode]||'復習')};save();render()}
function current(){return Q.find(q=>q.id===S.session.ids[S.session.i])}
function render(){showMascots();if(!S.session){home();return}const ss=S.session;let q=current();if(!q){finish();return}let done=ss.results[q.id];const isFav=S.favorites.includes(q.id);let inner=`<div class="box"><div class="tags"><span class="pill">${ss.title}</span><span class="pill">${ss.i+1} / ${ss.ids.length}問</span><span class="pill">${['','やさしい','ふつう','むずかしい'][q.level]}</span><span class="pill">⭐ ${S.points}点</span></div><div class="progress"><div style="width:${100*ss.i/ss.ids.length}%"></div></div>${figure(q.fig)}<div class="question">${rich(q.prompt)}</div><button id="fav" class="btn" style="font-size:16px;min-height:42px;padding:8px">${isFav?'★ お気に入り登録中':'☆ お気に入りに入れる'}</button>`;
if(q.type==='mc'){inner+='<div class="choices">'+optionOrder(q).map(({a,i})=>`<button class="btn" data-opt="${i}" ${done?'disabled':''}>${escapeHTML(a)}</button>`).join('')+'</div>'}
if(q.type==='input')inner+=`<div class="hint">漢字がむずかしければ、ひらがなでもOK！</div><input id="typed" class="input" placeholder="短いことばを入力" autocomplete="off" ${done?'disabled':''}><button id="submit" class="btn full primary" ${done?'disabled':''}>答えをチェック</button><button id="noidea" class="btn full" ${done?'disabled':''}>わからないので答えを見る</button>`;
if(q.type==='order')inner+=`<p class="hint">順番にタップしてね。</p><div id="picked" class="orderpicked"></div><div id="orderArea" class="choices"></div><button id="resetOrder" class="btn full" ${done?'disabled':''}>並べ直す</button><button id="submitOrder" class="btn full primary" ${done?'disabled':''}>この順番で答える</button>`;
inner+=`<div id="feedback">${done?feedback(q,done):''}</div><div class="two"><button class="btn full" id="tohome">← 単元</button><button class="btn full primary" id="next" ${done?'':'style="display:none"'}>${ss.i+1===ss.ids.length?'結果へ':'次の問題へ →'}</button></div></div>`;el(inner);
$('fav').onclick=()=>{const i=S.favorites.indexOf(q.id);i<0?S.favorites.push(q.id):S.favorites.splice(i,1);save();$('fav').textContent=S.favorites.includes(q.id)?'★ お気に入り登録中':'☆ お気に入りに入れる'};
$('tohome').onclick=home;$('next').onclick=next;
if(done){if(q.type==='mc'){document.querySelectorAll('[data-opt]').forEach(b=>{const k=+b.dataset.opt;b.classList.toggle('correct',k===q.answer);b.classList.toggle('wrong',k===done.response&&!done.ok)})}return}
if(q.type==='mc')document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt===q.answer,+b.dataset.opt));
if(q.type==='input'){$('submit').onclick=()=>{const typed=$('typed').value.trim().replace(/\s/g,'');if(!typed)return;answer(q.answers.map(x=>x.replace(/\s/g,'')).includes(typed),typed)};$('noidea').onclick=()=>answer(false,'わからない');$('typed').onkeydown=e=>{if(e.key==='Enter')$('submit').click()}}
if(q.type==='order'){let shuffledSteps=shuffled(q.steps.map((t,i)=>({i,t}))),picks=[];function d(){document.getElementById('picked').innerHTML=picks.map(x=>`<span class="orderchip">${escapeHTML(x.t)}</span>`).join('');document.getElementById('orderArea').innerHTML=shuffledSteps.filter(x=>!picks.some(p=>p.i===x.i)).map(x=>`<button class="btn" data-step="${x.i}">${escapeHTML(x.t)}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{picks.push(shuffledSteps.find(x=>x.i===+b.dataset.step));d()})}d();$('resetOrder').onclick=()=>{picks=[];d()};$('submitOrder').onclick=()=>{if(picks.length!==q.steps.length)return;answer(picks.every((p,i)=>p.i===i),picks.map(x=>x.t).join(' → '))}}
}
function feedback(q,r){let correct=q.type==='mc'?q.options[q.answer]:q.type==='order'?q.steps.join(' → '):q.answers[0];return `<div class="explain">${r.ok?'🌟 正解！':'💡 ここを覚えよう！'}<div>答え：${escapeHTML(correct)}</div><div>${escapeHTML(q.why)}</div></div>${r.mascot||''}`}
function answer(ok,response){let q=current(),stat=S.stats[q.id]||{tries:0,wrong:0};let bonus=stat.lastCorrect===false&&ok?5:0,base=q.level===1?10:q.level===2?20:35,delta=ok?base+bonus:q.level===1?-3:0;S.points=Math.max(0,S.points+delta);stat.tries++;if(!ok)stat.wrong++;stat.lastCorrect=ok;S.stats[q.id]=stat;const index=S.cycle++%4;S.food[index]=Math.max(0,Math.min(100,(S.food[index]||0)+(ok?17:-14)));const [code,name,food,good]=MASCOTS[index];let line=ok?good+(bonus?' 苦手を克服！＋5点！':''):'おなかがへった… もう一回で取り返す！';let img=`<div class="bubble"><img src="mascot-${code}.jpg" alt="${name}"><span>${name}「${line}」<br> ${delta>0?'＋':''}${delta}点</span></div>`;let result={ok,response,mascot:img};S.session.results[q.id]=result;S.history.push({unit:q.unit,level:q.level,correct:ok,id:q.id,time:new Date().toISOString(),type:q.type});save();render()}
function next(){let ss=S.session;ss.i++;save();if(ss.i&&ss.i%5===0&&!ss.breakSeen.includes(ss.i)){ss.breakSeen.push(ss.i);save();celebrate();return}render()}
function celebrate(){showMascots();let i=(S.cycle-1+4)%4,[code,name]=MASCOTS[i];el(`<div class="box complete"><img src="mascot-${code}.jpg" alt="${name}"><h2>5問クリア！</h2><p class="question">${name}と休憩！</p><p class="hint">ここまで保存できたよ。正解でも不正解でも、5問に取り組んだのはすごいこと！</p><button id="continue" class="btn full primary">つづける</button><button id="stop" class="btn full">今日はここまで</button></div>`);$('continue').onclick=render;$('stop').onclick=home}
function finish(){const results=Object.values(S.session.results),right=results.filter(x=>x.ok).length;showMascots();el(`<div class="box complete"><h2>おつかれさま！</h2><p class="question">${results.length}問チャレンジ<br>正解 ${right}問</p><p class="hint">おぼえ直す問題は「まちがえた問題だけ」からできるよ。</p><button id="again" class="btn full primary">単元メニューへもどる</button></div>`);$('again').onclick=home;S.session=null;save()}
showMascots();if(S.session&&S.session.ids?.length){el(`<div class="box"><h2>つづきからスタートできるよ</h2><p class="hint">前の問題番号：${S.session.i+1}問目</p><button id="resume" class="btn full primary">つづきから</button><button id="restart" class="btn full">新しく選び直す</button></div>`);$('resume').onclick=render;$('restart').onclick=home}else home();
</script><script src="study-telemetry.js" data-subject="理科" data-title="植物わかるラボ" data-source="science_plants" data-test="proficiency"></script><script src="study-ote.js?v=1" defer></script>
