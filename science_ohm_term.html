</style></head><body><main><a href="index.html" class="back">← テスト勉強基地へ</a><h1>⚡ 二学期期末 理科・オームの法則</h1><p class="sub">送ってくれた理科プリント100ページの図1〜3をもとに、どこの何を求めるかから練習。まずは計算しない問題から！</p><div class="sound"><button id="soundToggle">🔊 効果音 ON</button><button id="voiceToggle">🗣️ 読み上げ OFF</button><span class="sub">読み上げはボタンを押した時だけ</span></div><div id="home" class="panel"><h2>今日はどこを攻略する？</h2><p class="mission">まちがえても減点なし！「何を求める？」→「数字を選ぶ」→「式を選ぶ」→「計算」の順で練習しよう。</p><div id="units"></div><div class="row"><button class="secondary" id="retryMiss">🔥 間違えた問題だけ</button><button class="secondary" id="resume">▶ 続きから</button></div><p id="stats" class="sub"></p></div><div id="play" class="panel hidden"><button id="exit" class="secondary">← 単元にもどる</button><p class="heading" id="unitName"></p><p class="progress" id="counter"></p><div class="bar"><div id="fill" class="fill"></div></div><div class="stem" id="stem"></div><div class="answers" id="answers"></div><button id="check" class="primary" disabled>これで決定！</button><div id="feedback" class="notice hidden" role="status"></div><button id="next" class="primary hidden">つぎの問題へ ➜</button></div><div id="done" class="panel hidden"><h2>🎁 おつかれさま！</h2><p id="summary" class="feedback"></p><div class="row"><button id="again" class="secondary">もう一回</button><button id="backHome" class="primary">単元を選ぶ</button></div></div></main><script>
'use strict';const QUESTIONS=[{"unit":"① 何を求める？（計算なし）","q":"「抵抗は何Ωですか？」何を求める？","opts":["電流","抵抗","電圧"],"a":1,"hint":"文の最後の「何Ω」に注目。","tip":"Ωは抵抗。何を探すか、ここを先に決めよう。","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「電流は何Aですか？」何を求める？","opts":["電圧","抵抗","電流"],"a":2,"hint":"Aという単位を見てみよう。","tip":"Aは電流。アンペア＝電流！","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「電圧は何Vですか？」何を求める？","opts":["電圧","抵抗","電流"],"a":0,"hint":"Vという単位が書いてあるね。","tip":"Vは電圧。ボルト＝電圧！","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"回路全体の抵抗を求める。見る場所は？","opts":["抵抗Pだけ","回路全体","抵抗Qだけ"],"a":1,"hint":"「全体」という2文字が目印。","tip":"全体とPとQを混ぜない。まず範囲を選ぶ！","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「抵抗Qの電圧」を聞かれた。どこを調べる？","opts":["抵抗P","電源の全体","抵抗Q"],"a":2,"hint":"文章にアルファベットがあるよ。","tip":"Qと書かれたらQだけ。関係のない数字は使わない。","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「抵抗PとQを合わせた抵抗」これは？","opts":["合成抵抗（全体）","抵抗P","電源の電圧"],"a":0,"hint":"Pだけ・Qだけではなく、まとめた値。","tip":"合わせた抵抗＝全体の合成抵抗。","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「電流0.5A」これはどんな種類の数字？","opts":["抵抗","電流","電圧"],"a":1,"hint":"数字の後ろのAを見てね。","tip":"0.5Aは電流。0.5Ωではないよ。","level":"basic"},{"unit":"① 何を求める？（計算なし）","q":"「電圧15V」これは何の数字？","opts":["電圧","電流","抵抗"],"a":0,"hint":"数字の後ろのVを確認。","tip":"15Vは電圧。「15」という数字だけで判断しない！","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"抵抗の単位は？","opts":["V","A","Ω"],"a":2,"hint":"抵抗はオームと読む。","tip":"抵抗＝Ω、電圧＝V、電流＝A。","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"電流の単位は？","opts":["A","Ω","V"],"a":0,"hint":"アンペアの頭文字。","tip":"電流＝A。電圧と間違えない！","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"電圧の単位は？","opts":["Ω","V","A"],"a":1,"hint":"ボルトと読む単位。","tip":"電圧＝V。","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"「電圧3V、電流0.5A」抵抗を出すのに使う2つは？","opts":["3Vと0.5A","3Vと3Ω","0.5Aと0.5Ω"],"a":0,"hint":"この問題で与えられた数字を2つ探そう。","tip":"抵抗を求めるには電圧Vと電流Aを使う。","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"「抵抗10Ω、電流2A」電圧を求めるのに使う2つは？","opts":["2Vと10A","10Ωと2A","10Aと2Ω"],"a":1,"hint":"手元に書いてある2つの数字は？","tip":"10Ωと2A。電圧Vはまだ分からない。","level":"basic"},{"unit":"② V・A・Ωの見分け","q":"「電圧12V、抵抗4Ω」電流を求めるのに使うのは？","opts":["12Vと4Ω","12Aと4V","4Aと12Ω"],"a":0,"hint":"問題に書かれている単位を読み取ろう。","tip":"12Vと4Ω。単位を勝手に変えない。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"電圧Vを出す式は？","opts":["抵抗Ω÷電流A","電流A×抵抗Ω","電圧V÷抵抗Ω"],"a":1,"hint":"電圧をつくる式はかけ算。","tip":"電圧V＝電流A×抵抗Ω。Vを求めるなら掛ける。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"抵抗Ωを出す式は？","opts":["電圧V÷電流A","電流A÷電圧V","電圧V×電流A"],"a":0,"hint":"Ωが欲しい。VとAのどちらを割る？","tip":"抵抗Ω＝電圧V÷電流A。上にV、下にA。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"電流Aを出す式は？","opts":["抵抗Ω÷電圧V","電圧V×抵抗Ω","電圧V÷抵抗Ω"],"a":2,"hint":"Aを求める時はΩで割る。","tip":"電流A＝電圧V÷抵抗Ω。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"「電流は何A？」まず選ぶ式は？","opts":["V÷Ω","V÷A","A×Ω"],"a":0,"hint":"答えの単位がAになる式は？","tip":"電流A＝電圧V÷抵抗Ω。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"「抵抗は何Ω？」まず選ぶ式は？","opts":["A×Ω","V÷A","V÷Ω"],"a":1,"hint":"抵抗Ωが答えになる式を探す。","tip":"抵抗Ω＝電圧V÷電流A。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"「電圧は何V？」まず選ぶ式は？","opts":["V÷A","V÷Ω","A×Ω"],"a":2,"hint":"電圧だけはかけ算。","tip":"電圧V＝電流A×抵抗Ω。","level":"basic"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"電圧6V、電流2A。抵抗の式は？","opts":["6÷2","2÷6","6×2"],"a":0,"hint":"求めるのはΩ。","tip":"Ω＝V÷A だから6÷2。","level":"calc"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"電圧12V、抵抗3Ω。電流の式は？","opts":["12×3","12÷3","3÷12"],"a":1,"hint":"求めるのはA。","tip":"A＝V÷Ω だから12÷3。","level":"calc"},{"unit":"③ かける？ 割る？ 式を選ぶ","q":"電流0.5A、抵抗20Ω。電圧の式は？","opts":["20÷0.5","0.5÷20","0.5×20"],"a":2,"hint":"求めるのはV。","tip":"V＝A×Ω だから0.5×20。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧6V、電流2A。抵抗は何Ω？","opts":["3Ω","12Ω","8Ω"],"a":0,"hint":"Ω＝V÷A。","tip":"6÷2＝3Ω。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧12V、電流3A。抵抗は何Ω？","opts":["36Ω","4Ω","9Ω"],"a":1,"hint":"12÷3。","tip":"12÷3＝4Ω。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧10V、電流0.5A。抵抗は何Ω？","opts":["5Ω","10Ω","20Ω"],"a":2,"hint":"0.5は半分。10÷0.5。","tip":"10÷0.5＝20Ω。0.5で割ると2倍。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧8V、抵抗4Ω。電流は何A？","opts":["2A","32A","4A"],"a":0,"hint":"A＝V÷Ω。","tip":"8÷4＝2A。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧18V、抵抗6Ω。電流は何A？","opts":["108A","3A","12A"],"a":1,"hint":"18÷6。","tip":"18÷6＝3A。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電流0.5A、抵抗10Ω。電圧は何V？","opts":["20V","0.05V","5V"],"a":2,"hint":"V＝A×Ω。","tip":"0.5×10＝5V。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電流0.2A、抵抗30Ω。電圧は何V？","opts":["6V","150V","30.2V"],"a":0,"hint":"0.2×30。","tip":"0.2×30＝6V。","level":"calc"},{"unit":"④ まず1つの抵抗だけ計算","q":"電圧15V、電流0.5A。抵抗は何Ω？","opts":["7.5Ω","30Ω","15.5Ω"],"a":1,"hint":"Ω＝15÷0.5。","tip":"15÷0.5＝30Ω。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"直列回路で、Pに0.5A流れる。Qの電流は？","opts":["0.5A","1A","0.25A"],"a":0,"hint":"直列では電流がどこでも同じ。","tip":"直列は一本道。電流はどこでも0.5A。","level":"basic"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"直列回路でPが5V、Qが15V。全体の電圧は？","opts":["10V","20V","75V"],"a":1,"hint":"直列の電圧は足し算。","tip":"5＋15＝20V。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"直列回路でPが10Ω、Qが30Ω。全体の抵抗は？","opts":["20Ω","300Ω","40Ω"],"a":2,"hint":"直列の抵抗は足し算。","tip":"10＋30＝40Ω。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"写真の図1。抵抗Pには5V、0.5A。Pの抵抗は？","opts":["10Ω","30Ω","40Ω"],"a":0,"hint":"Pだけを見る。5÷0.5。","tip":"P＝5V÷0.5A＝10Ω。15VはQの数字だよ。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"写真の図1。抵抗Qには15V、0.5A。Qの抵抗は？","opts":["10Ω","30Ω","40Ω"],"a":1,"hint":"Qだけを見る。15÷0.5。","tip":"Q＝15V÷0.5A＝30Ω。5VはPの数字。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"写真の図1。全体20V、電流0.5A。全体の抵抗は？","opts":["10Ω","30Ω","40Ω"],"a":2,"hint":"全体なら20÷0.5。","tip":"全体＝20V÷0.5A＝40Ω。Pの10Ωとは別物。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"直列で全体12V、Pが5V。Qの電圧は？","opts":["7V","17V","60V"],"a":0,"hint":"全体＝P＋Q。","tip":"12－5＝7V。","level":"calc"},{"unit":"⑤ 直列：P・Q・全体を分ける","q":"直列でPが0.4A、Qが0.4A。全体の電流は？","opts":["0.8A","0.4A","0.2A"],"a":1,"hint":"直列は電流を足さない。","tip":"直列の電流はどこでも0.4A。","level":"basic"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"並列回路で、電源の電圧が8V。抵抗Xの電圧は？","opts":["4V","16V","8V"],"a":2,"hint":"並列では電圧がどの枝でも同じ。","tip":"並列＝電圧が同じ。XもYも8V。","level":"basic"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"並列回路でXに0.4A、Yに0.1A。全体の電流は？","opts":["0.5A","0.3A","0.04A"],"a":0,"hint":"並列の電流は合流する。","tip":"0.4＋0.1＝0.5A。","level":"calc"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"写真の図2。Xは8V、0.4A。Xの抵抗は？","opts":["80Ω","20Ω","16Ω"],"a":1,"hint":"Xだけを見て8÷0.4。","tip":"8÷0.4＝20Ω。","level":"calc"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"写真の図2。Yは8V、0.1A。Yの抵抗は？","opts":["20Ω","16Ω","80Ω"],"a":2,"hint":"Yだけを見て8÷0.1。","tip":"8÷0.1＝80Ω。","level":"calc"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"写真の図2。全体8V、0.5A。全体の抵抗は？","opts":["16Ω","100Ω","4Ω"],"a":0,"hint":"全体の電圧÷全体の電流。","tip":"8÷0.5＝16Ω。20＋80ではない！","level":"calc"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"並列でXに0.3A、全体が0.8A。Yの電流は？","opts":["1.1A","0.5A","0.24A"],"a":1,"hint":"全体＝X＋Y。","tip":"0.8－0.3＝0.5A。","level":"calc"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"並列でPが6V、Qも6V。全体の電圧は？","opts":["12V","3V","6V"],"a":2,"hint":"並列の電圧は足さない。","tip":"並列はPもQも全体も6V。","level":"basic"},{"unit":"⑥ 並列：電流は足す・電圧は同じ","q":"並列の合成抵抗は、各抵抗をそのまま足す？","opts":["足さない","必ず足す","必ずかける"],"a":0,"hint":"直列と並列の違いを思い出そう。","tip":"抵抗を単純に足すのは直列。並列は別の方法。","level":"basic"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。30Ωと20Ωは並列。合成抵抗は？","opts":["50Ω","12Ω","10Ω"],"a":1,"hint":"1/R＝1/30＋1/20＝5/60。","tip":"1/R＝1/12 より12Ω。直列なら50Ω、ここは並列。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。全体1.5A、合成抵抗12Ω。電源電圧は？","opts":["8V","13.5V","18V"],"a":2,"hint":"全体のV＝全体のA×全体のΩ。","tip":"1.5×12＝18V。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。30Ωの枝にも20Ωの枝にもかかる電圧は？","opts":["18V","9V","36V"],"a":0,"hint":"並列の電圧はどちらも同じ。","tip":"並列なら各枝は電源と同じ18V。","level":"basic"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。30Ωに18V。流れる電流は？","opts":["1.5A","0.6A","1.2A"],"a":1,"hint":"電流A＝18÷30。","tip":"18÷30＝0.6A。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。20Ωに18V。流れる電流は？","opts":["0.6A","1.5A","0.9A"],"a":2,"hint":"電流A＝18÷20。","tip":"18÷20＝0.9A。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"写真の図3。0.6Aと0.9Aの電流を合流させると？","opts":["1.5A","0.3A","0.54A"],"a":0,"hint":"並列の電流は合流して足す。","tip":"0.6＋0.9＝1.5A。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"抵抗を求めたい。電圧20V、電流0.5A。どの式を使う？","opts":["20×0.5","20÷0.5","0.5÷20"],"a":1,"hint":"抵抗Ω＝電圧V÷電流A。","tip":"20÷0.5＝40Ω。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"電流を求めたい。電圧12V、抵抗6Ω。答えは？","opts":["72A","18A","2A"],"a":2,"hint":"電流A＝12÷6。","tip":"12÷6＝2A。","level":"calc"},{"unit":"⑦ 写真の図3と仕上げ","q":"直列と並列。電圧がどの枝でも同じなのは？","opts":["並列回路","直列回路","どちらも必ず同じ"],"a":0,"hint":"分かれ道がある回路を考える。","tip":"並列の電圧が同じ。直列の電流が同じ。","level":"basic"},{"unit":"⑦ 写真の図3と仕上げ","q":"直列と並列。電流がどこでも同じなのは？","opts":["並列回路","直列回路","どちらも必ず同じ"],"a":1,"hint":"一本道なら電流が分かれない。","tip":"直列の電流が同じ。並列は枝ごとに分かれる。","level":"basic"}];const $=x=>document.getElementById(x);const STORAGE='science-ohm-term-20261106-v1', UNITS=Array.from(new Set(QUESTIONS.map(q=>q.unit)));let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{}saved.missed=saved.missed||{};saved.solved=saved.solved||{};let current=[],at=0,chosen=-1,wrongCurrent=false,sessionCorrect=0,mode='',originalUnit='',muted=localStorage.getItem('ohm-muted')==='1',voice=localStorage.getItem('ohm-voice')!=='0';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(saved))}catch{}}
function show(which){['home','play','done'].forEach(k=>$(k).classList.toggle('hidden',k!==which));window.scrollTo(0,0)}
function toggleLabels(){$('soundToggle').textContent=muted?'🔇 効果音 OFF':'🔊 効果音 ON';$('voiceToggle').textContent=voice?'🗣️ 読み上げ ON':'🗣️ 読み上げ OFF'}toggleLabels();
$('soundToggle').onclick=()=>{muted=!muted;localStorage.setItem('ohm-muted',muted?'1':'0');toggleLabels();if(!muted)ping(true)};$('voiceToggle').onclick=()=>{voice=!voice;localStorage.setItem('ohm-voice',voice?'1':'0');toggleLabels();if(voice)say('読み上げをオンにしたよ')};
let audio;function ping(ok){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const start=audio.currentTime;let notes=ok?[660,880,1100]:[310,260];notes.forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.001,start+i*.1);g.gain.exponentialRampToValueAtTime(.15,start+i*.1+.015);g.gain.exponentialRampToValueAtTime(.001,start+i*.1+.11);o.connect(g).connect(audio.destination);o.start(start+i*.1);o.stop(start+i*.1+.12)})}catch(e){}}
function say(txt){if(!voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.rate=.94;speechSynthesis.speak(u)}catch(e){}}
function renderHome(){const counts=UNITS.map(u=>QUESTIONS.filter(x=>x.unit===u).length);$('units').innerHTML='';UNITS.forEach((u,i)=>{let b=document.createElement('button');b.className='unit';b.innerHTML=u+'<small>'+counts[i]+'問・まちがいを発見する練習</small>';b.onclick=()=>start(QUESTIONS.map((x,j)=>x.unit===u?j:-1).filter(x=>x>=0),'unit',u);$('units').append(b)});$('stats').textContent='これまでに正解した理科の問題：'+Object.keys(saved.solved).length+'問 ／ 復習したい問題：'+Object.keys(saved.missed).length+'問';$('retryMiss').disabled=!Object.keys(saved.missed).length;$('resume').disabled=!saved.session?.ids?.length}
function start(ids,m,u){current=ids;at=0;chosen=-1;sessionCorrect=0;mode=m;originalUnit=u;saveSession();renderQuestion();show('play')}
function saveSession(){saved.session={ids:current,at,mode,originalUnit,sessionCorrect};save()}
function restore(){const x=saved.session;if(!x||!x.ids?.length)return;current=x.ids;at=Math.min(x.at,current.length-1);mode=x.mode;originalUnit=x.originalUnit;sessionCorrect=x.sessionCorrect||0;renderQuestion();show('play')}
function renderQuestion(){if(at>=current.length)return finish();chosen=-1;wrongCurrent=false;const x=QUESTIONS[current[at]];$('unitName').textContent=x.unit+(x.level==='calc'?' ／ 計算問題':'');$('counter').textContent=(at+1)+' / '+current.length+'問　正解 '+sessionCorrect+'問';$('fill').style.width=((at)/current.length*100)+'%';$('stem').textContent=x.q;$('answers').innerHTML='';x.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{chosen=i;document.querySelectorAll('.choice').forEach((bb,j)=>bb.classList.toggle('selected',j===i));$('check').disabled=false};$('answers').append(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').classList.add('hidden');$('next').classList.add('hidden');saveSession()}
const voices=['スティーブ師匠','ゲイリー','さくちゃん','プンプン','ハギー','ポーグ'];$('check').onclick=()=>{if(chosen<0)return;const id=current[at],x=QUESTIONS[id],correct=chosen===x.a,wasMiss=!!saved.missed[id];let message='';if(correct){sessionCorrect++;saved.solved[id]=Date.now();delete saved.missed[id];ping(true);message=(wasMiss?'🏆 スティーブ師匠「リベンジ成功！見事じゃ！」':'🎉 '+voices[(at+id)%voices.length]+'「よっしゃ！正解！」')+'\n'+x.tip}else{saved.missed[id]=(saved.missed[id]||0)+1;ping(false);message='🔎 '+voices[(at+id)%voices.length]+'「おっと！似てるけど、ここが違うぞ！」\nヒント：'+x.hint+'\n正解は「'+x.opts[x.a]+'」\n覚え方：'+x.tip}save();$('feedback').textContent=message;$('feedback').style.whiteSpace='pre-line';$('feedback').classList.toggle('wrong',!correct);$('feedback').classList.remove('hidden');document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.toggle('selected',i===x.a)});$('check').classList.add('hidden');$('next').classList.remove('hidden');say(message.replace(/[^\u3040-\u30ff\u3400-\u9fffA-Za-z0-9、。！]/g,' '));saveSession()};$('next').onclick=()=>{at++;if(at>=current.length)finish();else renderQuestion()};function finish(){saved.session=null;save();$('summary').textContent=current.length+'問中 '+sessionCorrect+'問正解！ 間違えた問題は「間違えた問題だけ」で何度でも復習できるよ。';show('done')};$('exit').onclick=()=>{renderHome();show('home')};$('backHome').onclick=()=>{renderHome();show('home')};$('again').onclick=()=>start(current,mode,originalUnit);$('retryMiss').onclick=()=>{let ids=Object.keys(saved.missed).map(Number).filter(i=>i>=0&&i<QUESTIONS.length);if(ids.length)start(ids,'miss','間違い直し')};$('resume').onclick=restore;renderHome();
</script></body></html>
