'use strict';

側が戦ったイギリスの革命は？","choices":["ピューリタン革命","フランス革命","明治維新"],"answer":0,"why":"議会は国の話し合いをする場所。王が勝手に決めることに反対した。","level":1,"id":67},{"unit":"イギリスとアメリカの革命","q":"ピューリタン革命で議会側を率いたのは誰？","choices":["ナポレオン","クロムウェル","リンカン"],"answer":1,"why":"クロムウェルはイギリスの議会側のリーダー。","level":1,"id":68},{"unit":"イギリスとアメリカの革命","q":"イギリスで1688年に起きた革命は？","choices":["名誉革命","フランス革命","アメリカ独立戦争"],"answer":0,"why":"名誉革命はイギリス。王の力をおさえた。","level":1,"id":69},{"unit":"イギリスとアメリカの革命","q":"名誉革命のあと、国王の力を制限した文書は？","choices":["独立宣言","人権宣言","権利章典"],"answer":2,"why":"権利章典はイギリス。王も決まりを守る。","level":1,"id":70},{"unit":"イギリスとアメリカの革命","q":"アメリカがイギリスから独立するために戦ったのは？","choices":["南北戦争","アメリカ独立戦争","ピューリタン革命"],"answer":1,"why":"独立とは、ほかの国に支配されず自分たちで決めること。","level":1,"id":71},{"unit":"イギリスとアメリカの革命","q":"1776年、アメリカが発表したものは？","choices":["独立宣言","人権宣言","権利章典"],"answer":0,"why":"アメリカは独立宣言。1776年。","level":1,"id":72},{"unit":"フランス革命","q":"1789年、フランスで起きた大きな変化は？","choices":["名誉革命","フランス革命","アメリカ独立戦争"],"answer":1,"why":"フランス革命は、身分による不公平を変えようとした動き。","level":1,"id":73},{"unit":"フランス革命","q":"フランス革命のときに発表されたものは？","choices":["権利章典","独立宣言","人権宣言"],"answer":2,"why":"人権宣言はフランス。人は自由で平等だという考え。","level":1,"id":74},{"unit":"フランス革命","q":"「人は生まれながらに自由で平等」という考えを示したのは？","choices":["人権宣言","権利章典","五箇条の御誓文"],"answer":0,"why":"生まれた家や身分で、人の価値は決まらないという考え。","level":1,"id":75},{"unit":"フランス革命","q":"フランス革命のあと、皇帝になった人物は？","choices":["クロムウェル","ナポレオン","ワシントン"],"answer":1,"why":"ナポレオンはフランスの軍人。1804年に皇帝になった。","level":1,"id":76},{"unit":"イギリスとアメリカの革命","q":"「権利章典」はどこの国？","choices":["フランス","アメリカ","イギリス"],"answer":2,"why":"イギリス＝権利章典。","level":2,"id":77},{"unit":"フランス革命","q":"「人権宣言」はどこの国？","choices":["フランス","イギリス","アメリカ"],"answer":0,"why":"フランス＝人権宣言。","level":2,"id":78},{"unit":"イギリスとアメリカの革命","q":"「独立宣言」はどこの国？","choices":["イギリス","アメリカ","フランス"],"answer":1,"why":"アメリカ＝独立宣言。","level":2,"id":79},{"unit":"イギリスとアメリカの革命","q":"正しい組み合わせはどれ？","choices":["イギリス―人権宣言","フランス―独立宣言","アメリカ―独立宣言"],"answer":2,"why":"イギリス＝権利章典、アメリカ＝独立宣言、フランス＝人権宣言。","level":2,"id":80}];
const KEY='boku-term-history-europe-v1';
const MASCOTS=[{id:'saku',name:'さくちゃん',food:'🍎',like:'りんご'},{id:'porg',name:'ポーグ',food:'🐟',like:'おさかな'},{id:'hollow',name:'プンプン',food:'📚',like:'ホームワーク'},{id:'huggy',name:'ハギー',food:'🍪',like:'クッキー'}];
const $=id=>document.getElementById(id);
let store={history:[],favorites:[],weak:[],points:0,session:null,level:'1',energy:{saku:50,porg:50,hollow:50,huggy:50}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object')store={...store,...v,history:Array.isArray(v.history)?v.history:[],favorites:Array.isArray(v.favorites)?v.favorites:[],weak:Array.isArray(v.weak)?v.weak:[],energy:{...store.energy,...(v.energy||{})}};}catch(e){}
if(!['1','2','3','all'].includes(String(store.level)))store.level='1';
if(!Number.isFinite(Number(store.points)))store.points=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function show(name){['home','quiz','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==name));scrollTo(0,0);}
function mascot(i){return MASCOTS[(i+MASCOTS.length)%MASCOTS.length]}
function energy(id){return Math.max(0,Math.min(100,Math.round(Number(store.energy[id])||0)))}
function energyLabel(v){return v>=88?'おなかパンパン！':v>=65?'まんぷく！':v>=40?'元気だよ！':v>=22?'ちょっと空腹…':'ぺしゃんこ…！'}
function familyMarkup(){return MASCOTS.map(m=>{const e=energy(m.id),shape=e<22?'starving':e>=88?'fed':'';return `<div class="famCard"><img class="famPhoto ${shape}" src="mascot-${m.id}.jpg" alt="${m.name}"><div class="famName">${m.name}</div><div class="hungerMeter"><div class="hungerFill" style="width:${e}%"></div></div><div class="famStatus">${m.food} ${energyLabel(e)}</div></div>`}).join('')}
function drawPoints(){$('points').textContent='⭐ '+store.points+' pt'}
function chosenData(){return String(store.level)==='all'?DATA:DATA.filter(q=>String(q.level)===String(store.level))}
function home(){drawPoints();show('home');const base=chosenData();const u=[...new Set(DATA.map(q=>q.unit))];$('levelGrid').querySelectorAll('button').forEach(b=>{const on=b.dataset.level===String(store.level);b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});$('levelHelp').textContent=store.level==='1'?'基本を覚える3択。正解すると＋10pt！':store.level==='2'?'意味やつながりを考える問題。正解すると＋20pt！':store.level==='3'?'順番・理由・資料を考える問題。正解すると＋35pt！':'やさしい・ふつう・むずかしいを全部まぜる！';$('familyGrid').innerHTML=familyMarkup();$('units').replaceChildren();u.forEach(unit=>{const n=base.filter(q=>q.unit===unit),idset=new Set(n.map(x=>x.id)),done=store.history.filter(x=>idset.has(x.id)).length,ok=store.history.filter(x=>idset.has(x.id)&&x.correct).length;const b=document.createElement('button');b.className='btn unitBtn';b.textContent=unit+'（'+n.length+'問） '+(done?'挑戦 '+done+'回 ／ 正解 '+ok+'回':'まだやってない！');b.disabled=n.length===0;b.addEventListener('click',()=>start(n.map(x=>x.id),unit));$('units').append(b)});$('resume').style.display=store.session?'block':'none';$('weak').disabled=!store.weak.length;$('fav').disabled=!store.favorites.length;$('all').textContent='🎯 この難易度からランダム20問（全'+base.length+'問）';$('all').disabled=base.length===0;}
function shuffle(arr){arr=[...arr];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function start(ids,label){if(!ids.length)return;store.session={ids:shuffle(ids),label,index:0,selected:null,correct:0,answered:0,done:[],start:Date.now(),reaction:null};save();render()}
function render(){const s=store.session;if(!s){home();return;}if(s.index>=s.ids.length){finish();return;}show('quiz');drawPoints();const q=DATA.find(x=>x.id===s.ids[s.index]);if(!q){store.session=null;save();home();return;}$('unitBadge').textContent=q.unit;$('indexBadge').textContent=(s.index+1)+' / '+s.ids.length+'問';$('levelBadge').textContent=['','🍎 やさしい ＋10pt','🍪 ふつう ＋20pt','🏆 むずかしい ＋35pt'][q.level];$('bar').style.width=(s.index/s.ids.length*100)+'%';$('question').textContent=q.q;const area=$('answers');area.replaceChildren();q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='ans'+(s.selected!==null?(i===q.answer?' ok':i===s.selected?' ng':''):'');b.textContent=['ア','イ','ウ','エ'][i]+'　'+c;b.disabled=s.selected!==null;b.addEventListener('click',()=>answer(i));area.append(b)});$('star').textContent=store.favorites.includes(q.id)?'❤️ お気に入り登録中':'☆ お気に入りに入れる';$('feedback').classList.toggle('hidden',s.selected===null);$('next').classList.toggle('hidden',s.selected===null);$('reaction').classList.toggle('hidden',s.selected===null);
if(s.selected!==null){const r=s.reaction||{},m=MASCOTS.find(x=>x.id===r.mascot)||mascot(s.index),ok=s.selected===q.answer;const photo=$('reactPhoto');photo.src='mascot-'+m.id+'.jpg';photo.alt=m.name;photo.classList.toggle('starving',!ok);$('reaction').classList.toggle('bad',!ok);const line=ok?({saku:'やんのかこら！ りんごをむしゃむしゃ！',porg:'ピヨヨー！ おさかなパクッ！',hollow:'宿題だ！ ホームワークをもぐもぐ！',huggy:'クッキー！ うまうま大ジャンプ！'}[m.id]):({saku:'りんごが遠のいたぁ…ばたん！',porg:'おさかなが逃げた！ぺしゃん…',hollow:'ホームワークがない…しぼしぼ…',huggy:'クッキーをくれぇ…ぱたり…'}[m.id]);$('reactMessage').textContent=m.name+'「'+line+'」';$('reactDetails').textContent=(ok?'🎊 正解！ ':'おっと！ ')+(r.pt>0?'＋'+r.pt+'pt':r.pt<0?'−'+Math.abs(r.pt)+'pt':'0pt')+' ／ '+m.food+' '+energyLabel(energy(m.id));$('feedback').textContent=(ok?'✨ よくできた！':'💡 ここを覚えて次こそ！')+'\n'+q.why;}
}
function answer(i){const s=store.session;if(!s||s.selected!==null)return;const q=DATA.find(x=>x.id===s.ids[s.index]);const ok=i===q.answer;const recovery=ok&&store.weak.includes(q.id);let pt=ok?(q.level===3?35:q.level===2?20:10):(q.level===1?-3:0);if(recovery)pt+=5;const m=mascot(store.history.length);const delta=ok?(q.level===3?33:q.level===2?24:17):(q.level===1?-19:-12);store.energy[m.id]=Math.min(100,Math.max(0,energy(m.id)+delta));s.selected=i;s.answered++;if(ok){s.correct++;store.weak=store.weak.filter(x=>x!==q.id)}else if(!store.weak.includes(q.id))store.weak.push(q.id);store.points=Math.max(0,store.points+pt);s.reaction={mascot:m.id,pt,recovery};store.history.push({unit:q.unit,correct:ok,level:q.level,at:Date.now(),id:q.id});save();render();}
function next(){const s=store.session;if(!s||s.selected===null)return;s.index++;s.selected=null;s.reaction=null;save();if(s.index>0&&s.index%5===0){const m=mascot(Math.floor(s.index/5)-1);$('cheerImage').src='mascot-'+m.id+'.jpg';$('cheerImage').alt=m.name;$('cheerTitle').textContent='🎉 '+s.index+'問突破！';$('cheerText').textContent='正解でもまちがいでも、ここまで進んだぞ！ '+m.name+'「おなかも心も大騒ぎ！ 次の5問もいくぞ！」';$('cheerFamily').innerHTML=familyMarkup();$('cheer').classList.remove('hidden')}else if(s.index>=s.ids.length)finish();else render()}
function finish(){const s=store.session;if(!s)return;show('finish');$('summary').textContent=s.answered+'問チャレンジ・正解 '+s.correct+'問！ ⭐合計 '+store.points+'pt。ぬいぐるみをもっと満腹にするなら、また挑戦！';store.session=null;save();drawPoints();}
$('mascotRow').innerHTML=MASCOTS.map(m=>'<img src="mascot-'+m.id+'.jpg" alt="'+m.name+'">').join('');$('back').onclick=home;$('next').onclick=next;$('resume').onclick=render;$('star').onclick=()=>{const s=store.session;if(!s)return;const id=s.ids[s.index];store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render()};$('weak').onclick=()=>start(store.weak,'苦手だけ復習');$('fav').onclick=()=>start(store.favorites,'お気に入り復習');$('all').onclick=()=>start(shuffle(chosenData().map(x=>x.id)).slice(0,20),'まとめ20問');$('again').onclick=home;$('cheerNext').onclick=()=>{$('cheer').classList.add('hidden');if(store.session?.index>=store.session?.ids.length)finish();else render()};$('levelGrid').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{store.level=b.dataset.level;save();home()}));home();
