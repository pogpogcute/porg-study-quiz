<script>
'use strict';
const BANK=[{"id":"q1","cat":"flower","stem":"アブラナの花を調べると、先端に黄色い粉のようなものが付いた細い部分があった。この粉をつくる部分はどこか。","options":["やく","柱頭","胚珠","子房"],"answer":"やく","ex":"花粉をつくるのはおしべの先の「やく」。","fig":"flower","skill":""},{"id":"q2","cat":"flower","stem":"花粉がめしべの先に付いた。この出来事を何というか。","options":["受粉","受精","発芽","蒸散"],"answer":"受粉","ex":"花粉が柱頭につくのが受粉。受精はそのあとに起こる。","fig":"flower","skill":""},{"id":"q3","cat":"flower","stem":"花が咲いたあと、子房が大きく成長した。子房は何になるか。","options":["果実","種子","花粉","やく"],"answer":"果実","ex":"子房は果実に、胚珠は種子になる。","fig":"","skill":""},{"id":"q4","cat":"flower","stem":"花が咲いたあと、胚珠が成長した。胚珠は何になるか。","options":["種子","果実","がく","花弁"],"answer":"種子","ex":"胚珠が種子、子房が果実になる。","fig":"","skill":""},{"id":"q5","cat":"flower","stem":"めしべを切って内部を観察した。胚珠が入っている、根元のふくらんだ部分はどれか。","options":["子房","柱頭","やく","花弁"],"answer":"子房","ex":"胚珠が入っているめしべの根元の部分は子房。","fig":"flower","skill":""},{"id":"q6","cat":"flower","stem":"マツの雌花とアブラナの花を比較した。マツの特徴として正しいものはどれか。","options":["胚珠がむき出しになっている","子房の中に胚珠がある","花弁が4枚ある","果実の中に種子ができる"],"answer":"胚珠がむき出しになっている","ex":"マツは裸子植物。胚珠が子房に包まれていない。","fig":"","skill":""},{"id":"q7","cat":"flower","stem":"アブラナの花を数えると、花弁が4枚あった。アブラナのおしべはふつう何本あるか。","options":["6本","4本","2本","8本"],"answer":"6本","ex":"アブラナは花弁4枚、おしべ6本（長い4本・短い2本）。","fig":"","skill":""},{"id":"q8","cat":"flower","stem":"虫に花粉を運んでもらう花にはどのような特徴が多いか。","options":["目立つ花弁や蜜がある","花弁がまったくなく必ず緑色である","花粉が必ず水に浮く","胚珠が葉の裏にある"],"answer":"目立つ花弁や蜜がある","ex":"虫媒花には、虫を引き付ける花弁や蜜があることが多い。","fig":"","skill":""},{"id":"q9","cat":"flower","stem":"受粉と受精の説明の組み合わせとして正しいものはどれか。","options":["受粉は柱頭に花粉がつくこと、受精は雄の核と卵細胞の核が合体すること","受粉は根が伸びること、受精は葉が開くこと","受粉も受精も花が落ちること","受粉は種子が発芽すること、受精は花粉が飛ぶこと"],"answer":"受粉は柱頭に花粉がつくこと、受精は雄の核と卵細胞の核が合体すること","ex":"2つは別の出来事。受粉したあとに受精が起こる。","fig":"","skill":""},{"id":"q10","cat":"flower","stem":"学校でアブラナの花を分解した。めしべの先端部分を確かめたい。観察するのはどこか。","options":["柱頭","胚珠","花弁","がく"],"answer":"柱頭","ex":"柱頭はめしべのいちばん先。花粉を受け取る場所。","fig":"flower","skill":""},{"id":"q11","cat":"force","stem":"ばねばかりを使う実験で、目盛りが2.0Nを示した。Nは何の単位か。","options":["力の大きさ","物体の質量","体積","速さ"],"answer":"力の大きさ","ex":"N（ニュートン）は力の大きさの単位。gは質量の単位。","fig":"","skill":""},{"id":"q12","cat":"force","stem":"日本の地表付近で、質量200gの物体に働く重力はおよそ何Nか。ただし100gにつき約1Nとする。","options":["2N","0.2N","20N","200N"],"answer":"2N","ex":"100gで約1Nなので、200gでは約2N。","fig":"","skill":""},{"id":"q13","cat":"force","stem":"静止した机の上の本に働く重力の向きはどれか。","options":["鉛直下向き","鉛直上向き","水平右向き","水平左向き"],"answer":"鉛直下向き","ex":"重力は地球の中心に向かって働く。","fig":"","skill":""},{"id":"q14","cat":"force","stem":"物体にはたらく力を矢印で表すとき、矢印の長さは何を表すか。","options":["力の大きさ","力の種類","物体の質量だけ","時間の長さ"],"answer":"力の大きさ","ex":"矢印の向きは力の向き、長さは力の大きさ。","fig":"force","skill":""},{"id":"q15","cat":"force","stem":"図のように、同じ一直線上で右に3N、左に3Nの力が働く。合力は何Nか。","options":["0N","3N","6N","9N"],"answer":"0N","ex":"同じ大きさの反対向きの力は打ち消し合う。","fig":"force","skill":""},{"id":"q16","cat":"force","stem":"図のように、同じ一直線上で右に2N、右に3Nの力が働く。合力の大きさは。","options":["5N","1N","6N","0N"],"answer":"5N","ex":"同じ向きに働く力は足し算で求める。","fig":"","skill":""},{"id":"q17","cat":"force","stem":"物体を押したら形が変わった。このとき確かめられた力の働きは何か。","options":["物体の形を変える","原子を必ず増やす","物体の質量を必ず減らす","音を必ず消す"],"answer":"物体の形を変える","ex":"力には物体を変形させる働きがある。","fig":"","skill":""},{"id":"q18","cat":"force","stem":"机の上にある本が静止している。重力と、机が本を上向きに押す力の関係は。","options":["大きさが等しく向きが反対","同じ向きである","両方ともゼロである","重力だけが働く"],"answer":"大きさが等しく向きが反対","ex":"本が静止しているときは、上下の力がつり合っている。","fig":"","skill":""},{"id":"q19","cat":"force","stem":"ばねに1Nを加えると2cm伸びた。同じばねに2Nを加えると何cm伸びるか。ただし比例する範囲内とする。","options":["4cm","1cm","2cm","8cm"],"answer":"4cm","ex":"ばねの伸びは力に比例する。力が2倍なら伸びも2倍。","fig":"","skill":""},{"id":"q20","cat":"force","stem":"物体を水中に入れると軽く感じた。水から物体に上向きに働く力は何か。","options":["浮力","重力","摩擦力","磁力"],"answer":"浮力","ex":"水中の物体には上向きの浮力が働く。","fig":"","skill":""},{"id":"q21","cat":"electrolysis","stem":"水に電流を流して2種類の気体を発生させた。この化学変化を何というか。","options":["電気分解","酸化","凝固","蒸留"],"answer":"電気分解","ex":"電流を使って1種類の物質を分解することを電気分解という。","fig":"electrolysis","skill":""},{"id":"q22","cat":"electrolysis","stem":"水の電気分解で、−極側に集まった気体に火を近づけると音を立てて燃えた。気体は何か。","options":["水素","酸素","窒素","二酸化炭素"],"answer":"水素","ex":"−極で発生するのは水素。火を近づけるとポンと音がする。","fig":"electrolysis","skill":""},{"id":"q23","cat":"electrolysis","stem":"水の電気分解で、＋極側の気体に火の消えかかった線香を入れると激しく燃えた。この気体は何か。","options":["酸素","水素","窒素","二酸化炭素"],"answer":"酸素","ex":"＋極でできる酸素は、ものを燃やす働きがある。","fig":"electrolysis","skill":""},{"id":"q24","cat":"electrolysis","stem":"水の電気分解で、−極側の気体が18mL集まった。＋極側にはおよそ何mL集まるか。","options":["9mL","18mL","27mL","36mL"],"answer":"9mL","ex":"水素と酸素の体積比は2対1。酸素は水素の半分。","fig":"","skill":""},{"id":"q25","cat":"electrolysis","stem":"水の電気分解で、＋極に6mLの気体が集まった。−極に集まる気体の体積はおよそ何mLか。","options":["12mL","3mL","6mL","24mL"],"answer":"12mL","ex":"＋極の酸素が6mLなら、−極の水素は2倍の12mL。","fig":"","skill":""},{"id":"q26","cat":"electrolysis","stem":"水を電気分解する化学反応式として正しいものはどれか。","options":["2H₂O → 2H₂ + O₂","H₂O → H₂ + O₂","2H₂O → H₂ + 2O₂","H₂O → H₂ + 2O₂"],"answer":"2H₂O → 2H₂ + O₂","ex":"反応前後の水素原子と酸素原子の数をそろえる。","fig":"","skill":""},{"id":"q27","cat":"electrolysis","stem":"電流を流して水を分解するため、うすい水酸化ナトリウム水溶液を用いた。理由として最も適切なものは。","options":["水に電流を流れやすくするため","水を青色にするため","気体を冷やすため","酸素を燃やすため"],"answer":"水に電流を流れやすくするため","ex":"純粋な水は電流が流れにくいので電解質を加える。","fig":"","skill":""},{"id":"q28","cat":"electrolysis","stem":"発生した気体Aは火のついたマッチを近づけると音を出して燃え、気体Bは線香の火を強くした。AとBの組み合わせは。","options":["Aは水素、Bは酸素","Aは酸素、Bは水素","Aは二酸化炭素、Bは酸素","Aは窒素、Bは水素"],"answer":"Aは水素、Bは酸素","ex":"ポンと燃えるのは水素。線香の火を強くするのは酸素。","fig":"","skill":""},{"id":"q29","cat":"electrolysis","stem":"水の電気分解を行うとき、−極で発生した気体の体積は＋極の何倍になるか。","options":["約2倍","約1倍","約3倍","約半分"],"answer":"約2倍","ex":"水素は酸素の約2倍の体積で発生する。","fig":"","skill":""},{"id":"q30","cat":"electrolysis","stem":"水の電気分解では水が水素と酸素に変わる。この実験から分かることは。","options":["水は水素原子と酸素原子からできている","水に炭素原子が必ず含まれる","水は1種類の原子だけでできている","水は化学変化しても必ず水のままである"],"answer":"水は水素原子と酸素原子からできている","ex":"水分子H₂Oは水素原子と酸素原子からできている。","fig":"","skill":""},{"id":"q31","cat":"animals","stem":"カエルの子は主にえらで、成体は主に肺と皮膚で呼吸する。カエルはどの仲間か。","options":["両生類","魚類","鳥類","ほ乳類"],"answer":"両生類","ex":"両生類は成長に伴って呼吸のしかたが変わる。","fig":"","skill":""},{"id":"q32","cat":"animals","stem":"クジラは海で暮らすが肺で呼吸し、子を母乳で育てる。クジラの分類は。","options":["ほ乳類","魚類","両生類","は虫類"],"answer":"ほ乳類","ex":"生活場所ではなく体のつくりや育て方で分類する。","fig":"","skill":""},{"id":"q33","cat":"animals","stem":"ペンギンは飛べないが羽毛でおおわれ卵を産む。分類は。","options":["鳥類","ほ乳類","魚類","両生類"],"answer":"鳥類","ex":"鳥類の特徴は羽毛。飛べなくても鳥類になる。","fig":"","skill":""},{"id":"q34","cat":"animals","stem":"トカゲの体表は乾いたうろこでおおわれている。分類は。","options":["は虫類","両生類","魚類","鳥類"],"answer":"は虫類","ex":"トカゲは、は虫類に分類される。","fig":"","skill":""},{"id":"q35","cat":"animals","stem":"下のうち、セキツイ動物に当てはまらないものは。","options":["バッタ","カエル","ハト","メダカ"],"answer":"バッタ","ex":"昆虫のバッタには背骨がない。","fig":"","skill":""},{"id":"q36","cat":"animals","stem":"カブトムシを観察すると脚が6本あり、体は頭・胸・腹に分かれていた。何の仲間か。","options":["昆虫類","クモ類","甲殻類","軟体動物"],"answer":"昆虫類","ex":"昆虫は脚が6本、体は頭・胸・腹に分かれる。","fig":"","skill":""},{"id":"q37","cat":"animals","stem":"イカやタコのように背骨がなく、内臓が外とう膜でおおわれる仲間は。","options":["軟体動物","節足動物","魚類","は虫類"],"answer":"軟体動物","ex":"イカやタコは軟体動物。","fig":"","skill":""},{"id":"q38","cat":"animals","stem":"魚類とほ乳類を比較するとき、分類の決め手になるものとして適切なのは。","options":["呼吸の仕方や子の育て方","泳ぐ速さだけ","体の大きさだけ","住む場所だけ"],"answer":"呼吸の仕方や子の育て方","ex":"魚類は主にえら呼吸、ほ乳類は肺呼吸をする。","fig":"","skill":""},{"id":"q39","cat":"animals","stem":"次のうち、外界の温度によって体温が変化しやすい仲間はどれか。","options":["は虫類","ほ乳類","鳥類","どの動物でも変化しない"],"answer":"は虫類","ex":"は虫類は変温動物、ほ乳類と鳥類は恒温動物。","fig":"","skill":""},{"id":"q40","cat":"animals","stem":"サンショウウオを観察した。幼生は水中生活をし、成体は肺や皮膚で呼吸する。分類は。","options":["両生類","ほ乳類","魚類","鳥類"],"answer":"両生類","ex":"サンショウウオは両生類。","fig":"","skill":""},{"id":"q41","cat":"sediment","stem":"地層から取り出した岩石には、直径5mm程度の丸い粒が多く含まれていた。この堆積岩は。","options":["れき岩","砂岩","泥岩","凝灰岩"],"answer":"れき岩","ex":"直径2mm以上の粒をれきという。れきが固まった岩はれき岩。","fig":"sediment","skill":""},{"id":"q42","cat":"sediment","stem":"地層から砂粒が集まって固まった岩石が見つかった。何というか。","options":["砂岩","泥岩","れき岩","石灰岩"],"answer":"砂岩","ex":"砂の粒が集まってできるのが砂岩。","fig":"","skill":""},{"id":"q43","cat":"sediment","stem":"粒が細かく、泥が固まってできた堆積岩は。","options":["泥岩","れき岩","花こう岩","安山岩"],"answer":"泥岩","ex":"泥岩は泥の細かい粒からできた岩石。","fi ,"ex":"4.0−2.4＝1.6g。","fig":"","skill":""},{"id":"q65","cat":"oxidation","stem":"マグネシウムと酸素が結びつく質量比を3対2とする。マグネシウム6gに結びつく酸素は何gか。","options":["4g","2g","3g","9g"],"answer":"4g","ex":"3対2なので、Mg6gなら酸素4g。","fig":"","skill":""},{"id":"q66","cat":"oxidation","stem":"銅と酸素が結びつく質量比を4対1とする。銅8gと完全に結びつく酸素は何gか。","options":["2g","4g","8g","12g"],"answer":"2g","ex":"銅8gは4gの2倍だから、酸素も1gの2倍。","fig":"","skill":""},{"id":"q67","cat":"oxidation","stem":"十分に加熱してマグネシウムを酸化させた。加熱後の粉末の質量が増えた理由は。","options":["空気中の酸素が結びついたから","粉末の数が増えたから","光を吸収して重くなったから","マグネシウムが水になったから"],"answer":"空気中の酸素が結びついたから","ex":"増えた質量は結びついた酸素の質量。","fig":"","skill":""},{"id":"q68","cat":"oxidation","stem":"鉄と硫黄を混ぜて加熱した変化と、マグネシウムを燃やした変化の共通点は。","options":["新しい物質ができる化学変化である","どちらも酸素と結びつく酸化だけである","どちらも水になる","どちらも必ず質量が減る"],"answer":"新しい物質ができる化学変化である","ex":"鉄＋硫黄は化合、Mg＋酸素は酸化。どちらも新しい物質ができる。","fig":"","skill":""},{"id":"q69","cat":"oxidation","stem":"炭素を酸素中で完全に燃やした。できた気体を石灰水に通すと白くにごった。気体は。","options":["二酸化炭素","酸素","水素","窒素"],"answer":"二酸化炭素","ex":"炭素が酸素と反応してCO₂ができる。","fig":"","skill":""},{"id":"q70","cat":"oxidation","stem":"密閉した容器の中で銅を加熱して酸化させた。容器全体の質量はどうなるか。","options":["変わらない","必ず増える","必ず減る","必ず2倍になる"],"answer":"変わらない","ex":"閉じた系では、酸素が銅に結びついても全体の質量は同じ。","fig":"","skill":""},{"id":"q71","cat":"leaf","stem":"葉の裏側の表皮を顕微鏡で見ると、2つの孔辺細胞に囲まれたすき間があった。このすき間は。","options":["気孔","道管","師管","胚珠"],"answer":"気孔","ex":"気孔は気体や水蒸気の出入り口。","fig":"leaf","skill":""},{"id":"q72","cat":"leaf","stem":"葉の断面のAは外側をおおう一層の細胞である。これを何というか。","options":["表皮","道管","師管","海綿状組織"],"answer":"表皮","ex":"葉の表面をおおうのは表皮。","fig":"leaf","skill":""},{"id":"q73","cat":"leaf","stem":"葉の断面のBには細長い細胞が密に並び、葉緑体が多い。この組織は。","options":["柵状組織","海綿状組織","維管束","表皮"],"answer":"柵状組織","ex":"柵状組織には葉緑体が多く光合成が盛ん。","fig":"leaf","skill":""},{"id":"q74","cat":"leaf","stem":"葉の断面のCには細胞間のすき間が多い。この組織は。","options":["海綿状組織","柵状組織","維管束","孔辺細胞"],"answer":"海綿状組織","ex":"海綿状組織には気体が通るすき間が多い。","fig":"leaf","skill":""},{"id":"q75","cat":"leaf","stem":"根から吸収された水や無機養分が、葉へ運ばれるとき主に通る管は。","options":["道管","師管","気孔","柱頭"],"answer":"道管","ex":"道管は根からの水や無機養分を運ぶ。","fig":"leaf","skill":""},{"id":"q76","cat":"leaf","stem":"葉で光合成によってつくられた養分が、ほかの部分へ運ばれるときに通る管は。","options":["師管","道管","気孔","孔辺細胞"],"answer":"師管","ex":"師管は光合成でつくられた養分を運ぶ。","fig":"leaf","skill":""},{"id":"q77","cat":"leaf","stem":"植物の茎や葉を透明な袋で覆うと内側に水滴がついた。水が水蒸気として出る現象は。","options":["蒸散","受粉","受精","発芽"],"answer":"蒸散","ex":"蒸散によって葉から水蒸気が出た後、袋内で水滴になる。","fig":"","skill":""},{"id":"q78","cat":"leaf","stem":"同じ植物の葉の表だけにワセリンをぬった場合と、裏だけにぬった場合を比べた。一般に裏だけにぬった方が蒸散が減りやすい理由は。","options":["葉の裏に気孔が多いから","葉の裏に根があるから","葉の裏では光合成ができないから","ワセリンが水をつくるから"],"answer":"葉の裏に気孔が多いから","ex":"多くの陸上植物で気孔は葉の裏側に多い。","fig":"","skill":""},{"id":"q79","cat":"leaf","stem":"葉をヨウ素液で調べると青紫色になった。葉にできていた養分は何か。","options":["デンプン","食塩","タンパク質","脂肪"],"answer":"デンプン","ex":"ヨウ素液が青紫色になるのはデンプンがあるとき。","fig":"","skill":""},{"id":"q80","cat":"leaf","stem":"葉のつくりについて、道管と師管がまとまった部分は何か。","options":["維管束","表皮","気孔","子房"],"answer":"維管束","ex":"維管束は道管と師管がまとまった通り道。","fig":"leaf","skill":""}];
const CATS={flower:['🌸','花のつくり'],force:['🧲','力のはたらき'],electrolysis:['💧','水の電気分解'],animals:['🐾','動物の分類'],sediment:['🪨','堆積岩'],model:['⚛️','化学変化のモデル'],oxidation:['🔥','酸化'],leaf:['🌿','葉のつくり']};
const KEYS=Object.keys(CATS);
const $=id=>document.getElementById(id),screen=$('screen');
const SAVE_KEY='rika-exam-realistic-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b};
const fresh=()=>({version:1,view:'home',quiz:null,lastWrong:[],history:[]});
let saved=fresh(),storageOK=false;
try{const k='__rika_storagetest';localStorage.setItem(k,'1');storageOK=localStorage.getItem(k)==='1';localStorage.removeItem(k)}catch(e){}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(x&&x.version===1&&x.quiz!==undefined&&['home','quiz','result'].includes(x.view))return x;}catch(e){}try{const x=JSON.parse(sessionStorage.getItem(SAVE_KEY)||'null');if(x&&x.version===1&&x.quiz!==undefined)return x}catch(e){}return fresh()}
saved=load();
function store(){const s=JSON.stringify(saved);try{localStorage.setItem(SAVE_KEY,s)}catch(e){}try{sessionStorage.setItem(SAVE_KEY,s)}catch(e){}}
function get(id){return BANK.find(q=>q.id===id)}
function start(mode,cat){let list;if(mode==='review'){list=saved.lastWrong.filter(id=>!!get(id));if(!list.length){renderHome();return}}else if(mode==='unit'){list=shuf(BANK.filter(q=>q.cat===cat).map(q=>q.id))}else{const per=mode==='exam40'?5:3;list=shuf(KEYS.flatMap(cat=>shuf(BANK.filter(q=>q.cat===cat)).slice(0,per).map(q=>q.id)))}
const choices={};for(const id of list)choices[id]=shuf([0,1,2,3]);saved.quiz={mode,cat:cat||null,ids:list,choices,idx:0,picked:null,committed:false,answers:{},hints:[],started:Date.now()};saved.view='quiz';store();render();scrollTo(0,0)}
function current(){const s=saved.quiz;return s&&s.ids[s.idx]?get(s.ids[s.idx]):null}
function title(mode,cat){return mode==='exam40'?'40問・実力テスト':mode==='exam24'?'24問・本番チャレンジ':mode==='review'?'まちがい直し':CATS[cat]?.[1]+' 特訓'}
function fmtOption(q,i){return q.options[saved.quiz.choices[q.id][i]]}
function render(){if(saved.view==='quiz'&&saved.quiz&&saved.quiz.idx<saved.quiz.ids.length){renderQuiz();return}if(saved.view==='result'&&saved.quiz){renderResult();return}renderHome()}
function renderHome(){saved.view='home';store();const q=saved.quiz,canResume=q&&q.idx<q.ids.length;screen.innerHTML=`<section class="panel"><div class="hero"><div><h1>実戦問題で、得点アップをめざそう！</h1><p>読む → 考える → 答える。<br>本番形式と単元練習を選べるよ。</p></div><div class="heroArt">📚</div></div>${canResume?`<button class="btn fill soft" data-do="resume">▶ ${esc(title(q.mode,q.cat))} のつづきから（${q.idx+1}問目）</button>`:''}<h2 class="section">本番形式で挑戦</h2><div class="modecards"><button class="modecard" data-do="exam24"><div class="em">🎯</div><b>24問 本番チャレンジ</b><small>8単元から各3問。答え合わせは最後。時間制限なし。</small></button><button class="modecard" data-do="exam40"><div class="em">🏅</div><b>40問 実力テスト</b><small>8単元から各5問。問題が毎回変わる総合テスト。</small></button></div><h2 class="section">苦手な単元を特訓</h2><div class="unitgrid">${KEYS.map(key=>`<button class="unit" data-do="unit" data-cat="${key}">${CATS[key][0]} ${CATS[key][1]}<small>各10問・解いたらすぐ解説</small></button>`).join('')}</div>${saved.lastWrong.length?`<button class="btn fill secondary" data-do="review">↻ 前回まちがえた${saved.lastWrong.length}問だけ復習</button>`:''}<p class="info">本番形式は解答を最後まで見せません。単元特訓では1問ずつ答え合わせと短い解説が出ます。どちらも途中経過を保存します。</p></section>`;}

function renderQuiz(){const s=saved.quiz,q=current();if(!q){saved.view='result';store();renderResult();return}const exam=s.mode.startsWith('exam');const pct=100*s.idx/s.ids.length;const recorded=s.answers[q.id],sel=s.picked;const isReview=s.mode==='review';const selectedAnswer=sel===null?null:fmtOption(q,sel);const wasRight=s.committed&&recorded&&recorded.choice===q.answer;screen.innerHTML=`<section class="panel"><button class="back" data-do="home">← 単元選択へ戻る（進捗は残ります）</button><div class="pagehead"><span class="tag">${esc(title(s.mode,s.cat))}</span><span class="count">第 ${s.idx+1} 問 ／ ${s.ids.length} 問</span></div><div class="progress"><div style="width:${pct}%"></div></div><p class="subtext">${esc(q.skill||'実験・観察・考察')}　${exam?'本番モード：解説は最後に表示':'練習モード：答えたら解説を表示'}</p><div class="qtext">${esc(q.stem)}</div>${q.fig&&figures[q.fig]?`<div class="fig">${figures[q.fig]}</div>`:''}<div>${[0,1,2,3].map(i=>`<button class="opt ${sel===i?'selected':''} ${s.committed&&fmtOption(q,i)===q.answer?'right':s.committed&&sel===i&&fmtOption(q,i)!==q.answer?'wrong':''}" data-do="pick" data-i="${i}" ${s.committed?'disabled':''}><span class="letter">${['ア','イ','ウ','エ'][i]}</span><span>${esc(fmtOption(q,i))}</span></button>`).join('')}</div>${!exam&&!s.committed?`<button class="btn secondary tiny" data-do="hint">${s.hints.includes(q.id)?'💡 問題文のヒントを表示中':'💡 何を聞かれている？（ヒント）'}</button>${s.hints.includes(q.id)?`<div class="info">${esc(q.skill||'最後の「何か」「どれか」に注目し、実験で変化したものを見つけよう。')}。問題文の最後の問いを読み、条件に合う答えを探そう。</div>`:''}`:''}${s.committed?`<div class="feedback ${wasRight?'good':'bad'}"><b>${wasRight?'正解！':'ここを覚えよう！'}</b><div>答え：${esc(q.answer)}</div><div>${esc(q.ex)}</div></div><button class="btn fill" data-do="next">${s.idx===s.ids.length-1?'結果を見る →':'次の問題へ →'}</button>`:`<button class="btn fill" data-do="commit" ${sel===null?'disabled':''}>${exam?'この答えで決定して次へ →':'答え合わせする →'}</button><button class="btn secondary tiny" data-do="skip">わからない・とばす</button>`}<div class="note">回答や問題番号は自動保存されます。リロードしても同じところから再開できます。</div></section>`;}
function commit(skip=false){const s=saved.quiz,q=current();if(!q||s.committed)return;if(!skip&&s.picked===null)return;const choice=skip?null:fmtOption(q,s.picked);s.answers[q.id]={choice,correct:choice===q.answer,assisted:s.hints.includes(q.id)};s.committed=true;store();if(s.mode.startsWith('exam')){next()}else renderQuiz()}
function next(){const s=saved.quiz;s.idx++;s.picked=null;s.committed=false;if(s.idx>=s.ids.length){saved.lastWrong=s.ids.filter(id=>!s.answers[id]||!s.answers[id].correct);saved.history=(saved.history||[]).slice(-9).concat([{date:Date.now(),mode:s.mode,total:s.ids.length,score:s.ids.length-saved.lastWrong.length}]);saved.view='result'}store();render();scrollTo(0,0)}
function renderResult(){const s=saved.quiz;if(!s)return renderHome();const wrong=s.ids.filter(id=>!s.answers[id]||!s.answers[id].correct);const score=s.ids.length-wrong.length;const grouped=KEYS.filter(c=>s.ids.some(id=>get(id).cat===c));screen.innerHTML=`<section class="panel"><div class="hero"><div><h1>${score===s.ids.length?'全問正解！':'最後までやりきったね！'}</h1><p>${esc(title(s.mode,s.cat))} の結果</p></div><div class="heroArt">🏆</div></div><div class="score" style="text-align:center;margin:15px">${score}<small> / ${s.ids.length} 問 正解</small></div><div class="info">${wrong.length?'間違えた問題は下の「解説を見る」で確認できるよ。':'よく覚えられているね！'} ヒントを使った問題は実力確認のときにもう一度挑戦してみよう。</div><h2 class="section">単元別の正解数</h2>${grouped.map(c=>{const ids=s.ids.filter(id=>get(id).cat===c);const n=ids.filter(id=>s.answers[id]&&s.answers[id].correct).length;return `<div class="resultsrow"><strong>${CATS[c][0]} ${CATS[c][1]}</strong><span class="num">${n} / ${ids.length} 問</span></div>`}).join('')}<h2 class="section">まちがえた問題・解説</h2>${wrong.length?wrong.map(id=>{const q=get(id),a=s.answers[id];return `<details class="miss"><summary>${esc(CATS[q.cat][1])}：${esc(q.stem.slice(0,44))}${q.stem.length>44?'…':''}</summary><p>あなたの回答：${esc(a&&a.choice!==null?a.choice:'わからない')}</p><p><b>正解：${esc(q.answer)}</b></p><p>${esc(q.ex)}</p></details>`}).join(''):'<div class="feedback good">全問正解！ このテストはよく理解できています。</div>'}${wrong.length?`<button class="btn fill" data-do="review">↻ まちがえた${wrong.length}問を練習</button>`:''}<button class="btn fill secondary" data-do="home">単元選択へ戻る</button><button class="btn fill secondary" data-do="restart">同じ形式で新しい問題に挑戦</button></section>`;}
function saveFile(){try{const blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rika_progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch(e){alert('保存できませんでした。Chromeで開いてください。')}}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.version!==1||!['home','quiz','result'].includes(s.view)||!s.quiz&&s.view!=='home'||s.quiz&&!Array.isArray(s.quiz.ids))throw Error('形式が合いません');saved=s;store();render();alert('保存した続きから再開できます。')}catch(e){alert('進捗ファイルを読み込めませんでした。')}};r.readAsText(f);e.target.value=''}
screen.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b)return;const op=b.dataset.do;if(op==='exam24'||op==='exam40'){start(op);return}if(op==='unit'){start('unit',b.dataset.cat);return}if(op==='review'){start('review');return}if(op==='resume'){saved.view='quiz';store();render();return}if(op==='home'){renderHome();scrollTo(0,0);return}if(op==='pick'){if(saved.quiz.committed)return;saved.quiz.picked=Number(b.dataset.i);store();renderQuiz();return}if(op==='hint'){const id=current()?.id;if(id&&!saved.quiz.hints.includes(id))saved.quiz.hints.push(id);store();renderQuiz();return}if(op==='skip'){commit(true);return}if(op==='commit'){commit();return}if(op==='next'){next();return}if(op==='restart'){const s=saved.quiz;if(!s)return;start(s.mode,s.cat)}});
$('backup').onclick=saveFile;$('importBtn').onclick=()=>$('importInput').click();$('importInput').onchange=handleImport;
if(!storageOK){$('savechip').textContent='進捗保存に注意';$('storageWarning').classList.remove('hidden')}
window.addEventListener('pagehide',store);render();
