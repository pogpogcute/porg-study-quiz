員です。","tokens":["the","a","She's","of","team","member","basketball"],"answer":["She's","a","member","of","the","basketball","team"],"rule":"a member of ～ ＝ ～の一員。","sourceSection":"5 並べ替え"},{"type":"mc","cat":"英作文","jp":"あなたのおじさんはどこに住んでいますか。","stem":"いちばん自然な英文は？","choices":["Where does your uncle live?","Where your uncle does live?","Where is your uncle live?"],"ans":0,"rule":"does のあと、生まれたまま live！","sourceSection":"6 英作文"},{"type":"mc","cat":"英作文","jp":"私は彼からたくさんのことを学びました。","stem":"いちばん自然な英文は？","choices":["I learned a lot from him.","I learned him a lot.","I study a lot by him."],"ans":0,"rule":"learn ～ from 人 ＝ 人から～を学ぶ。","sourceSection":"6 英作文"}]};const K={state:"year_eng_state_v1",stats:"year_eng_stats_v1",history:"year_eng_history_v1"};const $=id=>document.getElementById(id);function load(k,d){try{let x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function sec(id){return DATA.sections.find(s=>s.id===id)}function statKey(sid,idx){return sid+"_"+idx}function initStats(){let s=load(K.stats,{});DATA.sections.forEach(x=>x.questions.forEach((q,i)=>{let k=statKey(x.id,i);if(!s[k])s[k]={r:0,w:0,m:0}}));return s}let STATS=initStats(),STATE=load(K.state,null);function saveAll(){save(K.stats,STATS);save(K.state,STATE)}function weak(){let a=[];DATA.sections.forEach(s=>s.questions.forEach((q,i)=>{let r=STATS[statKey(s.id,i)];if(r.w>0&&r.m<2)a.push({sid:s.id,idx:i,score:r.w-r.r})}));return a.sort((a,b)=>b.score-a.score)}function getQ(item){if(item.final)return DATA.final[item.idx];return sec(item.sid).questions[item.idx]}function akey(){return STATE.index+"_"+STATE.mode}function rec(){return STATE.answers[akey()]||null}function home(){let w=weak(),h=load(K.history,[]);let html=`<div class="start"><h2>1年分を、単元ごとに総復習</h2><p>中間・期末・習熟度とは別の、1年まとめ専用です。</p><div class="panel">文字入力なし。穴埋めは選択、並べ替えは語句タップ、英作文は完成文を選びます。1問ごとに自動保存します。</div>`;if(STATE&&!STATE.done&&STATE.items&&STATE.index<STATE.items.length)html+=`<button class="btn main" id="resume">途中から再開（${STATE.index+1}/${STATE.items.length}）</button>`;html+=`<div class="grid">`;DATA.sections.forEach(s=>{html+=`<div class="unit"><h3>${s.title}</h3><p>${s.questions.length}問</p><button class="btn good" data-sec="${s.id}">この単元をやる</button></div>`});html+=`</div><button class="btn main" id="final">1年まとめテスト 20問</button>`;if(w.length)html+=`<button class="btn hint" id="weak">苦手だけ（${Math.min(20,w.length)}問）</button>`;if(h.length)html+=`<button class="btn sub" id="hist">履歴を見る</button>`;html+=`</div>`;$('app').innerHTML=html;$('bar').style.width='0%';let r=$('resume');if(r)r.onclick=render;document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>startSection(b.dataset.sec));$('final').onclick=startFinal;let wb=$('weak');if(wb)wb.onclick=startWeak;let hb=$('hist');if(hb)hb.onclick=showHistory}function startSection(sid){let s=sec(sid);STATE={mode:'section',sid,items:s.questions.map((q,i)=>({sid,idx:i})),index:0,score:0,miss:0,answers:{},done:false,breakSeen:{}};saveAll();render()}function startFinal(){STATE={mode:'final',items:DATA.final.map((q,i)=>({final:true,idx:i})),index:0,score:0,miss:0,answers:{},done:false,breakSeen:{}};saveAll();render()}function startWeak(){let w=weak().slice(0,20);STATE={mode:'weak',items:w.map(x=>({sid:x.sid,idx:x.idx})),index:0,score:0,miss:0,answers:{},done:false,breakSeen:{}};saveAll();render()}function enOptionOrder(q){let key=(STATE?.mode||'')+'|'+(STATE?.sid||'')+'|'+(STATE?.index||0);let seed=2166136261;for(const x of key){seed=Math.imul(seed^x.charCodeAt(0),16777619)}return q.choices.map((c,i)=>({c,i})).sort((a,b)=>{function hash(i){let z=(seed^Math.imul(i+1,0x9e3779b9))|0;z^=z>>>16;z=Math.imul(z,0x85ebca6b);z^=z>>>13;return z>>>0}return hash(a.i)-hash(b.i)});}
function render(){if(!STATE||STATE.done)return home();if(STATE.index>=STATE.items.length)return finish();if(STATE.items.length>10&&STATE.index>0&&STATE.index%10===0&&!STATE.breakSeen[STATE.index])return showBreak();let item=STATE.items[STATE.index],q=getQ(item),r=rec();let mode=STATE.mode==='final'?'1年まとめテスト':STATE.mode==='weak'?'苦手特訓':sec(STATE.sid).title;let instr=q.type==='order'?'【語句を正しい順にタップしよう】':'【いちばん合う答えを1つ選ぼう】';let html=`<div class="meta"><span class="pill cat">${q.cat}</span><span class="pill mode">${mode}</span></div><div class="instruction">${instr}</div><div class="jp">${q.jp}</div>`;if(q.type==='order'){let order=r&&r.order?r.order:[];html+=`<div class="built" id="built">${order.map(x=>`<button class="token" data-built="${x.i}">${x.t}</button>`).join('')}</div><div class="tokens">${q.tokens.map((t,i)=>`<button class="token ${order.some(x=>x.i===i)?'used':''}" data-token="${i}">${t}</button>`).join('')}</div><button class="btn main" id="checkOrder">これで答える</button>`}else{html+=`<div class="stem">${q.stem}</div><div class="choices">${enOptionOrder(q).map(({c,i})=>`<button class="choice" data-choice="${i}">${c}</button>`).join('')}</div>`}html+=`<div id="fb">${r?'':'<div class="feedback">答えを選んでください。</div>'}</div><div class="controls"><button class="btn sub" id="back">← 前へ</button><button class="btn hint" id="hint">ヒント</button><button class="btn main" id="next">次へ →</button></div><div class="stats"><span class="stat">正解 ${STATE.score}</span><span class="stat">ミス ${STATE.miss}</span><span class="stat">${STATE.index+1}/${STATE.items.length}</span></div><div class="tiny">自動保存済み</div>`;$('app').innerHTML=html;$('bar').style.width=Math.round(STATE.index/STATE.items.length*100)+'%';$('back').disabled=STATE.index===0;$('next').disabled=!r;$('back').onclick=()=>{if(STATE.index>0){STATE.index--;saveAll();render()}};$('next').onclick=()=>{STATE.index++;saveAll();render()};$('hint').onclick=()=>{$('fb').innerHTML=`<div class="feedback"><div class="rule">${q.rule}</div></div>`};if(q.type==='order'){if(!r)setupOrder(q,item);else showOrderResult(q,r)}else{document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submitMC(q,item,Number(b.dataset.choice)));if(r)showMCResult(q,r)}}function setupOrder(q,item){let selected=[];document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.token);if(selected.some(x=>x.i===i))return;selected.push({i,t:q.tokens[i]});draw()});$('checkOrder').onclick=()=>submitOrder(q,item,selected);function draw(){$('built').innerHTML=selected.map(x=>`<button class="token" data-rm="${x.i}">${x.t}</button>`).join('');document.querySelectorAll('[data-token]').forEach(b=>b.classList.toggle('used',selected.some(x=>x.i===Number(b.dataset.token))));document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.rm);selected=selected.filter(x=>x.i!==i);draw()})}}function submitOrder(q,item,selected){if(!selected.length)return;let ans=selected.map(x=>x.t).join(' ').toLowerCase(),cor=q.answer.join(' ').toLowerCase();record(item,ans===cor,{order:selected})}function submitMC(q,item,choice){record(item,choice===q.ans,{choice})}function record(item,ok,extra){if(rec())return;STATE.answers[akey()]={ok,...extra};if(ok)STATE.score++;else STATE.miss++;if(!item.final&&item.sid){let s=STATS[statKey(item.sid,item.idx)];if(ok){s.r++;s.m=Math.min(3,s.m+1)}else{s.w++;s.m=Math.max(-2,s.m-1)}}saveAll();try{dispatchEvent(new CustomEvent("boku:mascot-answer",{detail:{correct:!!ok}}))}catch(e){}render()}function showMCResult(q,r){document.querySelectorAll('[data-choice]').forEach(b=>{const i=Number(b.dataset.choice);b.disabled=true;if(i===q.ans)b.classList.add('correct');if(i===r.choice&&!r.ok)b.classList.add('wrong')});$('next').disabled=false;$('fb').innerHTML=r.ok?`<div class="feedback"><div class="result ok">〇 正解！</div><div class="rule">${q.rule}</div></div>`:`<div class="feedback"><div class="result ng">× おしい！</div><div>正解：<b>${q.choices[q.ans]}</b></div><div class="rule">${q.rule}</div></div>`}function showOrderResult(q,r){document.querySelectorAll('[data-token],[data-built],#checkOrder').forEach(b=>b.disabled=true);$('next').disabled=false;$('fb').innerHTML=r.ok?`<div class="feedback"><div class="result ok">〇 正解！</div><div class="rule">${q.rule}</div></div>`:`<div class="feedback"><div class="result ng">× おしい！</div><div>正しい語順：<b>${q.answer.join(' ')}</b></div><div class="rule">${q.rule}</div></div>`}function showBreak(){STATE.breakSeen[STATE.index]=true;saveAll();$('app').innerHTML=`<div class="start"><h2>${STATE.index}問クリア！</h2><p>ここで一度区切れます。<br><b>ここまで自動保存済みです。</b></p><button class="btn main" id="cont">つづける</button><button class="btn sub" id="stop">今日はここまで</button></div>`;$('cont').onclick=render;$('stop').onclick=home}function finish(){let hist=load(K.history,[]);hist.unshift({time:Date.now(),mode:STATE.mode,sid:STATE.sid||'',score:STATE.score,miss:STATE.miss,total:STATE.items.length});save(K.history,hist.slice(0,20));STATE.done=true;saveAll();$('bar').style.width='100%';$('app').innerHTML=`<div class="start"><h2>終了！</h2><p>正解 <b>${STATE.score}</b>　ミス <b>${STATE.miss}</b></p><div class="panel">結果は保存しました。トップから別の単元や苦手特訓に進めます。</div><button class="btn main" id="home">トップへ</button></div>`;$('home').onclick=()=>{STATE=null;save(K.state,null);home()}}function showHistory(){let h=load(K.history,[]);$('app').innerHTML=`<div class="start"><h2>履歴</h2><div class="panel">${h.map(x=>`<b>${new Date(x.time).toLocaleString('ja-JP')}</b><br>${x.mode==='section'?(sec(x.sid)?.title||'単元'):(x.mode==='final'?'1年まとめテスト':'苦手特訓')}　正解 ${x.score} / ミス ${x.miss}<br><br>`).join('')}</div><button class="btn sub" id="home2">戻る</button></div>`;$('home2').onclick=home}home();</script><script src="study-ote.js?v=1" defer></script>
