<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二学期期末 地理 中部地方</title><style>body{font-family:system-ui,sans-serif;background:#f0f5ff;color:#172a47;margin:0;font-size:22px}.wrap{max-width:680px;margin:auto;padding:18px}h1{font-size:30px}.panel{background:white;border-radius:22px;padding:22px;box-shadow:0 5px 15px #0001}button{font:inherit;border:2px solid #b5c9e8;border-radius:16px;background:white;color:#172a47;padding:16px;margin:8px 0;width:100%;text-align:left}button.selected{background:#d5e6ff;border-color:#3067d4}button.primary{background:#285fc7;color:white;text-align:center;font-weight:bold}button:disabled{opacity:.5}.small{font-size:17px;color:#4e6482}.feedback{background:#fff4d8;padding:16px;border-radius:14px;margin-top:15px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto;font-size:17px}.q{font-size:28px;font-weight:800;margin:24px 0}a{color:#285fc7}</style><div class="wrap"><div class="top"><a href="index.html">トップへ</a><button id="sound">音 ON</button></div><h1>地理 二学期期末 中部地方</h1><p class="small">先生のプリントをもとにした25問。文字入力なし。選んでから「決定」で採点！</p><div class="panel"><div id="progress" class="small"></div><div id="question" class="q"></div><div id="choices"></div><button class="primary" id="confirm" disabled>選んでから決定</button><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden">次の問題へ</button></div><p class="small" id="stats"></p><button id="restart">最初からやり直す</button></div><script>const BANK=[{"q": "東海の夏から秋に雨が多い理由は？", "o": ["黒潮の影響で暖かく、太平洋側の気候だから", "冬の北西季節風で雪が多いから", "内陸で雨が少ないから"], "a": "黒潮の影響で暖かく、太平洋側の気候だから", "e": "東海は暖流の黒潮の影響を受け、夏から秋に雨が多い。"}, {"q": "中央高地の気候の特徴は？", "o": ["内陸で夏と冬、昼と夜の気温差が大きい", "冬も暖かく気温差が小さい", "一年中雪が多い"], "a": "内陸で夏と冬、昼と夜の気温差が大きい", "e": "中央高地は内陸性の気候。"}, {"q": "北陸で冬に雪が多い理由は？", "o": ["日本海から湿った季節風が山地にぶつかるから", "黒潮が夏の雨を運ぶから", "内陸で乾燥するから"], "a": "日本海から湿った季節風が山地にぶつかるから", "e": "北西の季節風が日本海の水分を運び、山地で雪を降らせる。"}, {"q": "名古屋周辺で自動車工業が発達した理由は？", "o": ["繊維機械の製造技術を自動車生産に生かしたから", "冬の積雪が多かったから", "高原野菜の栽培が盛んだったから"], "a": "繊維機械の製造技術を自動車生産に生かしたから", "e": "繊維工業から機械技術が発達し、自動車工業につながった。"}, {"q": "名古屋周辺の工業で輸送に便利な理由は？", "o": ["高速道路や港が近いから", "高い山に囲まれているから", "雪が多く農業ができないから"], "a": "高速道路や港が近いから", "e": "高速道路と港が製品輸送に役立つ。"}, {"q": "東海で施設園芸農業が盛んな理由は？", "o": ["温暖で大都市へ運びやすいから", "冬に積雪が多いから", "高原で夏も涼しいから"], "a": "温暖で大都市へ運びやすいから", "e": "温暖な気候と大消費地への交通の便利さ。"}, {"q": "中央高地で昔盛んだった産業は？", "o": ["製糸業", "自動車工業", "石油化学工業"], "a": "製糸業", "e": "かつて蚕から生糸を作る製糸業が盛んだった。"}, {"q": "中央高地で製糸業のあと発達した工業は？", "o": ["精密機械工業", "造船業", "鉄鋼業"], "a": "精密機械工業", "e": "時計などの精密機械工業が発達した。"}, {"q": "中央高地で1980年代以降に進出した工業は？", "o": ["電気機械工業", "製糸業", "漁業"], "a": "電気機械工業", "e": "高速道路沿いなどに電気機械工業の工場が進出。"}, {"q": "北陸で地場産業が発達した理由は？", "o": ["雪の多い冬に農業以外の副業をしていたから", "黒潮で温暖だったから", "大都市で自動車を大量生産したから"], "a": "雪の多い冬に農業以外の副業をしていたから", "e": "冬の副業で培った技術が受け継がれた。"}, {"q": "飛騨・木曽・赤石の3山脈をまとめて？", "o": ["日本アルプス", "日本海溝", "関東山地"], "a": "日本アルプス", "e": "飛騨山脈・木曽山脈・赤石山脈。"}, {"q": "日本最大級で自動車工業が盛んな工業地帯は？", "o": ["中京工業地帯", "京浜工業地帯", "阪神工業地帯"], "a": "中京工業地帯", "e": "中京は名古屋を中心とする工業地帯。"}, {"q": "静岡県の太平洋沿岸で製紙・パルプが盛んな地域は？", "o": ["東海工業地域", "中京工業地帯", "北陸工業地域"], "a": "東海工業地域", "e": "東海工業地域は静岡県の沿岸部など。"}, {"q": "都市向けに野菜や花を育てる農業は？", "o": ["園芸農業", "遠洋漁業", "稲作"], "a": "園芸農業", "e": "園芸農業は野菜や花などを栽培する。"}, {"q": "出荷時期を遅らせる栽培方法は？", "o": ["抑制栽培", "促成栽培", "二毛作"], "a": "抑制栽培", "e": "抑制栽培は出荷を遅らせる。"}, {"q": "菊に電灯を当て、開花を遅らせる栽培は？", "o": ["電照菊の抑制栽培", "促成栽培", "二期作"], "a": "電照菊の抑制栽培", "e": "菊は日照時間を調整して開花時期を遅らせる。"}, {"q": "温室などの施設を使う農業は？", "o": ["施設園芸農業", "遠洋漁業", "高原野菜栽培"], "a": "施設園芸農業", "e": "施設園芸はビニールハウスや温室を使う。"}, {"q": "遠い海で長期間かけて行う漁業は？", "o": ["遠洋漁業", "沿岸漁業", "養殖業"], "a": "遠洋漁業", "e": "遠洋漁業は遠い海域で行う。"}, {"q": "夏の涼しさを利用し標高の高い場所で育てる野菜は？", "o": ["高原野菜", "促成栽培の野菜", "熱帯果実"], "a": "高原野菜", "e": "標高約1000mの高原の涼しさを利用。"}, {"q": "時計やカメラなど精密な機械を作る工業は？", "o": ["精密機械工業", "重化学工業", "製糸業"], "a": "精密機械工業", "e": "時計やカメラなどの精密機械。"}, {"q": "「冬に雪が多い」はどの地域の特徴？", "o": ["北陸", "東海", "中央高地"], "a": "北陸", "e": "北陸は日本海側で積雪が多い。"}, {"q": "「昼夜の気温差が大きい」はどこ？", "o": ["中央高地", "北陸", "東海"], "a": "中央高地", "e": "内陸の中央高地の特徴。"}, {"q": "「暖かく、大都市へ輸送しやすい」は何の説明？", "o": ["東海の施設園芸農業", "北陸の地場産業", "中央高地の精密機械工業"], "a": "東海の施設園芸農業", "e": "東海の農業の発達理由。"}, {"q": "「冬の副業の技術」は何につながった？", "o": ["北陸の地場産業", "名古屋の自動車工業", "東海の園芸農業"], "a": "北陸の地場産業", "e": "北陸の伝統的な技術が産業へ。"}, {"q": "「繊維工業の技術」は何につながった？", "o": ["名古屋周辺の自動車工業", "北陸の漁業", "東海の施設園芸農業"], "a": "名古屋周辺の自動車工業", "e": "繊維機械の製造技術が自動車生産へ。"}];let n=Number(localStorage.getItem('geography_term_n')||0),score=Number(localStorage.getItem('geography_term_score')||0),chosen=null,locked=false,muted=false;const $=id=>document.getElementById(id);function beep(ok){if(muted)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type=ok?'sine':'sawtooth';osc.frequency.value=ok?660:180;gain.gain.value=.07;osc.start();osc.stop(ctx.currentTime+.17);osc.onended=()=>ctx.close()}catch(e){}}function render(){chosen=null;locked=false;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('confirm').classList.remove('hidden');$('confirm').disabled=true;if(n>=BANK.length){$('progress').textContent='全問終了';$('question').textContent='おつかれさま！ '+score+' / '+BANK.length+' 問正解';$('choices').replaceChildren();$('confirm').classList.add('hidden');return}let q=BANK[n];$('progress').textContent=(n+1)+' / '+BANK.length+' 問';$('question').textContent=q.q;let box=$('choices');box.replaceChildren();let options=q.o.map((v,i)=>({v,k:(i+n*7)%3})).sort((a,b)=>a.k-b.k);options.forEach(({v})=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;chosen=v;box.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));$('confirm').disabled=false;$('confirm').textContent='これで決定する'};box.append(b)});$('confirm').textContent='選んでから決定';$('stats').textContent='これまでの正解 '+score+' 問'}$('confirm').onclick=()=>{if(!chosen||locked)return;locked=true;let q=BANK[n],ok=chosen===q.a;if(ok)score++;beep(ok);$('feedback').classList.remove('hidden');$('feedback').textContent=(ok?'大正解！ さくちゃんがリンゴをGET！':'おしい！ ここで覚えよう！')+' 正解は「'+q.a+'」。 '+q.e;$('confirm').classList.add('hidden');$('next').classList.remove('hidden');$('stats').textContent='これまでの正解 '+score+' 問';localStorage.setItem('geography_term_score',score)};$('next').onclick=()=>{n++;localStorage.setItem('geography_term_n',n);render()};$('restart').onclick=()=>{if(confirm('最初からやり直しますか？')){n=0;score=0;localStorage.setItem('geography_term_n',0);localStorage.setItem('geography_term_score',0);render()}};$('sound').onclick=()=>{muted=!muted;$('sound').textContent='音 '+(muted?'OFF':'ON');if(!muted)beep(true)};render();</script></html>
