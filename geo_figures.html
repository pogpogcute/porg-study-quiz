fig": null}, {"unit": "雨温図", "level": 2, "prompt": "図の気温が低く、冬の寒さが強いのは？", "type": "mc", "options": ["北海道", "南西諸島", "日本海側"], "answer": 0, "why": "冬の気温が0℃より下になる点に注目。", "fig": "climate-cold"}, {"unit": "雨温図", "level": 2, "prompt": "図の一年中暖かい気候は？", "type": "mc", "options": ["北海道", "南西諸島", "日本海側"], "answer": 1, "why": "冬でも気温が高いグラフです。", "fig": "climate-warm"}, {"unit": "雨温図", "level": 2, "prompt": "冬に雪が多い日本海側の雨温図は？", "type": "mc", "options": ["北海道", "南西諸島", "日本海側"], "answer": 2, "why": "12月〜2月の青い棒が高い。", "fig": "climate-snow"}, {"unit": "雨温図", "level": 2, "prompt": "夏の降水量が多い太平洋側の雨温図は？", "type": "mc", "options": ["太平洋側", "瀬戸内", "中央高地"], "answer": 0, "why": "6月〜9月の青い棒が高くなる。", "fig": "climate-summer"}, {"unit": "雨温図", "level": 2, "prompt": "年間の降水量が比較的少ない気候は？", "type": "mc", "options": ["太平洋側", "瀬戸内", "中央高地"], "answer": 1, "why": "青い棒が一年を通して低めです。", "fig": "climate-setouchi"}, {"unit": "雨温図", "level": 2, "prompt": "夏と冬の気温差が大きい内陸の気候は？", "type": "mc", "options": ["太平洋側", "瀬戸内", "中央高地"], "answer": 2, "why": "赤い線の上下の差が大きい。", "fig": "climate-inland"}, {"unit": "雨温図", "level": 3, "prompt": "図の赤い折れ線が表すのは？", "type": "mc", "options": ["降水量", "気温", "風向"], "answer": 1, "why": "赤い線は気温、青い棒は降水量です。", "fig": "climate-warm"}, {"unit": "雨温図", "level": 3, "prompt": "図の青い棒が表すのは？", "type": "mc", "options": ["気温", "日照時間", "降水量"], "answer": 2, "why": "青い棒は月ごとの降水量です。", "fig": "climate-snow"}, {"unit": "雨温図", "level": 3, "prompt": "この図から、冬の降水量が比較的多いと分かる理由は？", "type": "mc", "options": ["冬の青い棒が長い", "夏の赤い線が上がる", "気温が0℃になる"], "answer": 0, "why": "降水量は青い棒の高さで読み取ります。", "fig": "climate-snow"}, {"unit": "雨温図", "level": 3, "prompt": "冬の積雪が少なく、夏に雨が多い地域の説明は？", "type": "mc", "options": ["日本海側", "太平洋側", "中央高地"], "answer": 1, "why": "冬の降水量が少なく、梅雨や台風の季節に雨が多い。", "fig": "climate-summer"}, {"unit": "日本の地形", "level": 1, "prompt": "日本の国土のうち山地が占める割合は？", "type": "mc", "options": ["約4分の1", "約2分の1", "約4分の3"], "answer": 2, "why": "日本は山が多い国です。", "fig": null}, {"unit": "日本の地形", "level": 1, "prompt": "飛騨・木曽・赤石の3つの山脈をまとめて何という？", "ty const KEY='boku-proficiency-geo-figures-v1', SOURCES=[['saku','さくちゃん','🍎'],['porg','ポーグ','🐟'],['hollow','プンプン','📚'],['huggy','ハギー','🍪']];
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db||!Array.isArray(db.history))db={history:[],points:0};
let session=null,current=0,answers=0,started=Date.now(),breakAt=-1;const $=id=>document.getElementById(id);
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const UNITS=[...new Set(BANK.map(x=>x.unit))];
function indexPage(){const counts=UNITS.map(u=>{let arr=db.history.filter(x=>x.unit===u),c=arr.filter(x=>x.correct).length;return `<div class="card"><h2>${esc(u)}</h2><div class="small">このスマホで ${arr.length}問／正解 ${c}問</div><button class="btn" data-unit="${esc(u)}">この単元を勉強する</button></div>`}).join('');$('root').innerHTML=`<div class="card"><h2>どれにする？</h2><div class="grid"><button class="btn" data-level="1">🍎 やさしい 10pt</button><button class="btn" data-level="2">🍪 ふつう 20pt</button><button class="btn" data-level="3">🏆 むずかしい 35pt</button><button class="btn" data-level="0">🎲 全部まぜる</button></div><div class="small">やさしい問題を間違えたときだけ−3pt。5問ごとにぬいぐるみが大応援！</div></div>${counts}<div class="card">⭐ このスマホで獲得したポイント：${db.points}pt</div>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>start(b.dataset.unit,0));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(null,Number(b.dataset.level)));}
function start(unit,level){let pool=BANK.map((q,i)=>({...q,idx:i})).filter(q=>(!unit||q.unit===unit)&&(!level||q.level===level));if(!pool.length){alert('この難易度の問題はまだありません');return;}pool=pool.sort(()=>Math.random()-.5);session={items:pool.map(q=>q.idx),idx:0,passed:0,unit:unit||'総合',level};started=Date.now();render();}
function img(n){return `<img class="avatar" src="mascot-${n}.jpg" alt="">`}
function reaction(ok,pts){let m=SOURCES[(db.history.length-1)%4];let msg=ok?`${m[1]}「うまっ！」${m[2]}を食べて元気満タン！＋${pts}点！`:`${m[1]}「おなかが鳴った…」次の問題で取り返すぞ！`;return `<div class="reaction">${img(m[0])}<span>${msg}</span></div>`}
function render(){if(!session){indexPage();return;}if(session.idx>=session.items.length){finish();return;}if(session.idx>0&&session.idx%5===0&&breakAt!==session.idx){breakAt=session.idx;let m=SOURCES[Math.floor(session.idx/5-1)%4];$('root').innerHTML=`<div class="card"><div class="reaction">${img(m[0])}<span>${session.idx}問達成！ ${m[1]}から特大応援！ その調子！</span></div><h2>ここまでの記録は自動保存済み！</h2><button class="btn primary" id="next">次の5問へ</button><button class="btn" id="exit">今日はここまで</button></div>`;$('next').onclick=()=>render();$('exit').onclick=()=>{session=null;indexPage()};return;}let q=BANK[session.items[session.idx]];let html=`<div class="card"><div class="stat"><span>${esc(q.unit)}</span><span>${['','🍎 やさしい','🍪 ふつう','🏆 むずかしい'][q.level]}</span><span>⭐${db.points}pt</span></div><div class="meter"><div style="width:${100*session.idx/session.items.length}%"></div></div><div class="small">第 ${session.idx+1} 問 ／ ${session.items.length} 問</div><div class="question">${esc(q.prompt)}</div>${q.fig?'<div class="fig">'+figure(q.fig)+'</div>':''}<div id="answers">`;
 if(q.type==='mc')html+=q.options.map((v,i)=>`<button class="btn choice" data-answer="${i}">${String.fromCharCode(65+i)}　${esc(v)}</button>`).join('');
 if(q.type==='text')html+=`<label for="typed" class="small">短い言葉や数字を入力</label><input id="typed" autocomplete="off" placeholder="答え"><button class="btn primary" id="checkText">答え合わせ</button>`;
 if(q.type==='order')html+=`<div class="small">正しい順番にタップ</div><div id="selected" class="hint" style="min-height:52px">ここに並びます</div><div>${q.parts.map((v,i)=>({v,i})).reverse().map(x=>`<button class="token" data-token="${x.i}">${esc(x.v)}</button>`).join('')}</div><button class="btn primary" id="checkOrder">答え合わせ</button><button class="btn" id="clearOrder">やり直す</button>`;
 html+=`</div><div id="feedback"></div><button class="btn primary hidden" id="continue">次の問題へ</button></div>`;$('root').innerHTML=html;
 if(q.type==='mc')document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>judge(q,Number(b.dataset.answer)===q.answer));
 if(q.type==='text'){$('checkText').onclick=()=>{let normalize=s=>String(s).trim().replace(/[\s　,，]/g,'').toLowerCase();let x=normalize($('typed').value);if(!x)return;judge(q,[q.answer,...(q.aliases||[])].some(a=>normalize(a)===x))};}
 if(q.type==='order'){let picked=[];document.querySelectorAll('.token').forEach(b=>b.onclick=()=>{let x=Number(b.dataset.token);if(picked.includes(x))return;picked.push(x);b.classList.add('used');$('selected').textContent=picked.map(i=>q.parts[i]).join(' → ')});$('clearOrder').onclick=()=>{picked=[];document.querySelectorAll('.token').forEach(b=>b.classList.remove('used'));$('selected').textContent='ここに並びます'};$('checkOrder').onclick=()=>{if(picked.length===q.parts.length)judge(q,picked.every((x,i)=>x===i));};}
}
function judge(q,ok){if($('continue').classList.contains('hidden')===false)return;const pts=ok?(q.level===3?35:q.level===2?20:10):(q.level===1?-3:0);db.points=Math.max(0,db.points+pts);db.history.push({unit:q.unit,correct:ok,level:q.level,qid:session.items[session.idx],at:Date.now()});save();session.passed+=Number(ok);document.querySelectorAll('#answers button,#answers input').forEach(x=>x.disabled=true);$('feedback').innerHTML=reaction(ok,pts)+`<div class="hint ${ok?'':'wrong'}">${ok?'正解！':'おしい！'} ${esc(q.why)}${ok?'':`<div>答え：${esc(q.type==='mc'?q.options[q.answer]:q.type==='order'?q.parts.join(' → '):q.answer)}</div>`}</div>`;$('continue').classList.remove('hidden');$('continue').onclick=()=>{session.idx++;render();};}
function finish(){$('root').innerHTML=`<div class="card"><h2>大成功！ 今日の冒険は終了！</h2><p>今回の正解は ${session.passed} 問です。</p><div class="reaction">${img('saku')}さくちゃんたちが、ごはんパーティー！</div><button id="home" class="btn primary">ほかの単元を選ぶ</button></div>`;$('home').onclick=()=>{session=null;indexPage()};}
