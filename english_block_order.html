:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#26364f;background:#f4f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:750px;margin:auto;padding:14px}.box{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 23px #142e5d12;margin-top:12px}.title{font-size:clamp(24px,5vw,32px);font-weight:900;margin:8px 0}p{line-height:1.55}button,a.btn{min-height:48px;border:0;border-radius:13px;padding:11px 15px;font-weight:850;font-size:18px;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:4px solid #ecba42}.blue{background:#4269cd;color:#fff}.green{background:#178065;color:#fff}.light{background:#e9effd;color:#22345b}.orange{background:#fff0d2;color:#663d0b}.level{font-size:19px;font-weight:850}.subject{font-size:clamp(20px,4vw,26px);background:#f0f3ff;padding:16px;border-radius:14px;font-weight:900;line-height:1.6}.hint{font-size:17px;background:#fff7de;padding:11px;border-radius:12px}.line{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.tile{background:#ebf3ff;border:2px solid #95b6e2;color:#162941;font-size:clamp(19px,4vw,24px);max-width:100%;overflow-wrap:anywhere}.tile:disabled{opacity:.28}.built{min-height:85px;border:3px dashed #9aaccc;border-radius:15px;padding:8px;align-items:flex-start;background:#f9fbff}.built .tile{background:#def3e9;border-color:#71bf9c}.actions{display:flex;gap:8px;flex-wrap:wrap}.feedback{font-size:20px;font-weight:850;padding:12px;background:#eef9f4;border-radius:12px;margin:12px 0}.bad{background:#fff0f1}.muted{color:#52627b;font-size:16px}#progress{height:12px;background:#e5eafa;border-radius:12px;overflow:hidden;margin-top:11px}#progress>div{height:100%;width:0;background:#469b7e;transition:width .2s}.stats{display:flex;flex-wrap:wrap;gap:10px;font-weight:750}.stats span{background:#f3f5f9;border-radius:20px;padding:5px 10px}.homebuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.homebuttons button{padding:18px 9px}@media(max-width:500px){.homebuttons{grid-template-columns:1fr}.box{padding:14px}.actions button{flex:1}}
</style></head><body><main class="wrap"><div class="title">ことばのブロック並べ替え</div><div class="muted">大きなまとまり → 小さなまとまり → 単語 へ。文字入力なし、1問ずつ。</div><div id="progress"><div id="fill"></div></div><div id="app" class="box"></div><p><a href="index.html">学習トップへ戻る</a></p></main><script>const LESSONS=[{"id": "en1-0", "kind": "en", "stage": 0, "meaning": "私は毎日英語を勉強します。", "target": "I study English every day.", "blocks": ["I", "study English", "every day."], "tip": "主語 I → 動詞 study → 何を English → いつ every day"}, {"id": "en1-1", "kind": "en", "stage": 1, "meaning": "私は毎日英語を勉強します。", "target": "I study English every day.", "blocks": ["I", "study", "English", "every day."], "tip": "主語 I → 動詞 study → 何を English → いつ every day"}, {"id": "en1-2", "kind": "en", "stage": 2, "meaning": "私は毎日英語を勉強します。", "target": "I study English every day.", "blocks": ["I", "study", "English", "every", "day."], "tip": "主語 I → 動詞 study → 何を English → いつ every day"}, {"id": "en2-0", "kind": "en", "stage": 0, "meaning": "彼女は昨日テニスをしました。", "target": "She played tennis yesterday.", "blocks": ["She", "played tennis", "yesterday."], "tip": "yesterday があるので played。"}, {"id": "en2-1", "kind": "en", "stage": 1, "meaning": "彼女は昨日テニスをしました。", "target": "She played tennis yesterday.", "blocks": ["She", "played", "tennis", "yesterday."], "tip": "yesterday があるので played。"}, {"id": "en2-2", "kind": "en", "stage": 2, "meaning": "彼女は昨日テニスをしました。", "target": "She played tennis yesterday.", "blocks": ["She", "played", "tennis", "yesterday."], "tip": "yesterday があるので played。"}, {"id": "en3-0", "kind": "en", "stage": 0, "meaning": "私は今、音楽を聞いています。", "target": "I am listening to music now.", "blocks": ["I", "am listening to music", "now."], "tip": "今していること：am + 動詞ing。"}, {"id": "en3-1", "kind": "en", "stage": 1, "meaning": "私は今、音楽を聞いています。", "target": "I am listening to music now.", "blocks": ["I", "am listening", "to music", "now."], "tip": "今していること：am + 動詞ing。"}, {"id": "en3-2", "kind": "en", "stage": 2, "meaning": "私は今、音楽を聞いています。", "target": "I am listening to music now.", "blocks": ["I", "am", "listening", "to", "music", "now."], "tip": "今していること：am + 動詞ing。"}, {"id": "en4-0", "kind": "en", "stage": 0, "meaning": "彼はそのとき本を読んでいました。", "target": "He was reading a book then.", "blocks": ["He", "was reading a book", "then."], "tip": "過去のそのとき：was + 動詞ing。"}, {"id": "en4-1", "kind": "en", "stage": 1, "meaning": "彼はそのとき本を読んでいました。", "target": "He was reading a book then.", "blocks": ["He", "was reading", "a book", "then."], "tip": "過去のそのとき：was + 動詞ing。"}, {"id": "en4-2", "kind": "en", "stage": 2, "meaning": "彼はそのとき本を読んでいました。", "target": "He was reading a book then.", "blocks": ["He", "was", "reading", "a", "book", "then."], "tip": "過去のそのとき：was + 動詞ing。"}, {"id": "en5-0", "kind": "en", "stage": 0, "meaning": "あなたはサッカーが好きですか。", "target": "Do you like soccer?", "blocks": ["Do you", "like soccer?"], "tip": "一般動詞の質問：Do → you → like。"}, {"id": "en5-1", "kind": "en", "stage": 1, "meaning": "あなたはサッカーが好きですか。", "target": "Do you like soccer?", "blocks": ["Do", "you", "like soccer?"], "tip": "一般動詞の質問：Do → you → like。"}, {"id": "en5-2", "kind": "en", "stage": 2, "meaning": "あなたはサッカーが好きですか。", "target": "Do you like soccer?", "blocks": ["Do", "you", "like", "soccer?"], "tip": "一般動詞の質問：Do → you → like。"}, {"id": "en6-0", "kind": "en", "stage": 0, "meaning": "彼女は昨日、何を食べましたか。", "target": "What did she eat yesterday?", "blocks": ["What did she", "eat", "yesterday?"], "tip": "疑問詞 What → did → 主語 she → 動詞の原形 eat。"}, {"id": "en6-1", "kind": "en", "stage": 1, "meaning": "彼女は昨日、何を食べましたか。", "target": "What did she eat yesterday?", "blocks": ["What", "did she", "eat", "yesterday?"], "tip": "疑問詞 What → did → 主語 she → 動詞の原形 eat。"}, {"id": "en6-2", "kind": "en", "stage": 2, "meaning": "彼女は昨日、何を食べましたか。", "target": "What did she eat yesterday?", "blocks": ["What", "did", "she", "eat", "yesterday?"], "tip": "疑問詞 What → did → 主語 she → 動詞の原形 eat。"}, {"id": "en7-0", "kind": "en", "stage": 0, "meaning": "私は昨日、公園へ行きませんでした。", "target": "I did not go to the park yesterday.", "blocks": ["I", "did not go", "to the park", "yesterday."], "tip": "過去の否定は did not + 原形 go。"}, {"id": "en7-1", "kind": "en", "stage": 1, "meaning": "私は昨日、公園へ行きませんでした。", "target": "I did not go to the park yesterday.", "blocks": ["I", "did not", "go", "to the park", "yesterday."], "tip": "過去の否定は did not + 原形 go。"}, {"id": "en7-2", "kind": "en", "stage": 2, "meaning": "私は昨日、公園へ行きませんでした。", "target": "I did not go to the park yesterday.", "blocks": ["I", "did", "not", "go", "to", "the", "park", "yesterday."], "tip": "過去の否定は did not + 原形 go。"}, {"id": "en8-0", "kind": "en", "stage": 0, "meaning": "机の上に三冊の本があります。", "target": "There are three books on the desk.", "blocks": ["There are", "three books", "on the desk."], "tip": "複数の本なので There are。"}, {"id": "en8-1", "kind": "en", "stage": 1, "meaning": "机の上に三冊の本があります。", "target": "There are three books on the desk.", "blocks": ["There", "are", "three books", "on the desk."], "tip": "複数の本なので There are。"}, {"id": "en8-2", "kind": "en", "stage": 2, "meaning": "机の上に三冊の本があります。", "target": "There are three books on the desk.", "blocks": ["There", "are", "three", "books", "on", "the", "desk."], "tip": "複数の本なので There are。"}, {"id": "en9-0", "kind": "en", "stage": 0, "meaning": "この猫はあの猫より小さいです。", "target": "This cat is smaller than that cat.", "blocks": ["This cat", "is smaller than", "that cat."], "tip": "比較級 + than で「〜より」。"}, {"id": "en9-1", "kind": "en", "stage": 1, "meaning": "この猫はあの猫より小さいです。", "target": "This cat is smaller than that cat.", "blocks": ["This cat", "is", "smaller than", "that cat."], "tip": "比較級 + than で「〜より」。"}, {"id": "en9-2", "kind": "en", "stage": 2, "meaning": "この猫はあの猫より小さいです。", "target": "This cat is smaller than that cat.", "blocks": ["This", "cat", "is", "smaller", "than", "that", "cat."], "tip": "比較級 + than で「〜より」。"}, {"id": "en10-0", "kind": "en", "stage": 0, "meaning": "彼はクラスで一番背が高いです。", "target": "He is the tallest in his class.", "blocks": ["He", "is the tallest", "in his class."], "tip": "最上級は the + 形容詞の最上級。"}, {"id": "en10-1", "kind": "en", "stage": 1, "meaning": "彼はクラスで一番背が高いです。", "target": "He is the tallest in his class.", "blocks": ["He", "is", "the tallest", "in his class."], "tip": "最上級は the + 形容詞の最上級。"}, {"id": "en10-2", "kind": "en", "stage": 2, "meaning": "彼はクラスで一番背が高いです。", "target": "He is the tallest in his class.", "blocks": ["He", "is", "the", "tallest", "in", "his", "class."], "tip": "最上級は the + 形容詞の最上級。"}, {"id": "en11-0", "kind": "en", "stage": 0, "meaning": "私は放課後に宿題をしなければなりません。", "target": "I must do my homework after school.", "blocks": ["I", "must do my homework", "after school."], "tip": "must のあとには動詞の原形 do。"}, {"id": "en11-1", "kind": "en", "stage": 1, "meaning": "私は放課後に宿題をしなければなりません。", "target": "I must do my homework after school.", "blocks": ["I", "must do", "my homework", "after school."], "tip": "must のあとには動詞の原形 do。"}, {"id": "en11-2", "kind": "en", "stage": 2, "meaning": "私は放課後に宿題をしなければなりません。", "target": "I must do my homework after school.", "blocks": ["I", "must", "do", "my", "homework", "after", "school."], "tip": "must のあとには動詞の原形 do。"}, {"id": "en12-0", "kind": "en", "stage": 0, "meaning": "私たちは先週、動物園を訪れました。", "target": "We visited the zoo last week.", "blocks": ["We", "visited the zoo", "last week."], "tip": "last week があるので visited。"}, {"id": "en12-1", "kind": "en", "stage": 1, "meaning": "私たちは先週、動物園を訪れました。", "target": "We visited the zoo last week.", "blocks": ["We", "visited", "the zoo", "last week."], "tip": "last week があるので visited。"}, {"id": "en12-2", "kind": "en", "stage": 2, "meaning": "私たちは先週、動物園を訪れました。", "target": "We visited the zoo last week.", "blocks": ["We", "visited", "the", "zoo", "last", "week."], "tip": "last week があるので visited。"}, {"id": "jp1", "kind": "jp", "stage": 0, "meaning": "「だれが → 何を → どうした」の順に並べよう。", "target": "妹が りんごを 食べました。", "blocks": ["妹が", "りんごを", "食べました。"], "tip": "妹が=だれが、りんごを=何を、食べました=どうした。"}, {"id": "jp2", "kind": "jp", "stage": 0, "meaning": "「だれが → どこで → どうした」の順に並べよう。", "target": "私は 図書館で 勉強しました。", "blocks": ["私は", "図書館で", "勉強しました。"], "tip": "は=話題、で=場所、最後に動き。"}, {"id": "jp3", "kind": "jp", "stage": 0, "meaning": "「いつ → だれが → 何をした」の順に並べよう。", "target": "昨日 兄は サッカーをしました。", "blocks": ["昨日", "兄は", "サッカーをしました。"], "tip": "最初にいつ、最後に行動を置きます。"}, {"id": "jp4", "kind": "jp", "stage": 0, "meaning": "「だれが → 何を → どうした」の順に並べよう。", "target": "先生は 黒板に 字を書きました。", "blocks": ["先生は", "黒板に", "字を書きました。"], "tip": "だれが → どこに → 何をした、のまとまり。"}, {"id": "jp5", "kind": "jp", "stage": 0, "meaning": "「いつ → どこで → 何があった」の順に並べよう。", "target": "今朝 校庭で 集会がありました。", "blocks": ["今朝", "校庭で", "集会がありました。"], "tip": "いつ・どこでをまとめ、最後に出来事。"}, {"id": "jp6", "kind": "jp", "stage": 0, "meaning": "「だれが → どこに → どうした」の順に並べよう。", "target": "父は スーパーへ 行きました。", "blocks": ["父は", "スーパーへ", "行きました。"], "tip": "へ=向かう場所、行きました=動き。"}];
const STORE='boku_block_order_v1';let saved;try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){saved={}}const S={done:saved.done||{},retry:saved.retry||{},active:saved.active||null};let work=[],selected=[],locked=false,showHint=false;const $=x=>document.getElementById(x);function persist(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}function escapeHTML(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function shuffleBlocks(a,key){let x=key*37+17;let b=a.map((text,i)=>({text,i}));for(let i=b.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;let j=x%(i+1);[b[i],b[j]]=[b[j],b[i]]}if(b.every((v,i)=>v.i===i)&&b.length>1)[b[0],b[1]]=[b[1],b[0]];return b}
function group(kind,stage){return LESSONS.filter(q=>q.kind===kind&&(kind==='jp'||q.stage===stage))}function start(kind,stage=0,retry=false){let q=group(kind,stage);if(retry)q=q.filter(v=>S.retry[v.id]);if(!q.length){home();return}S.active={kind,stage,retry,ids:q.map(v=>v.id),index:0,correct:0};persist();render()}function currentSet(){if(!S.active)return[];return (S.active.ids||group(S.active.kind,S.active.stage).map(v=>v.id)).map(id=>LESSONS.find(q=>q.id===id)).filter(Boolean)}function home(){persist();let num=Object.keys(S.retry).length,html='<h2>どの練習をする？</h2><p>大きなブロックから始めて、慣れたら単語へ。間違えても減点なし！</p><div class="homebuttons">';[['en',0,'① 英語 大きなブロック'],['en',1,'② 英語 小さなブロック'],['en',2,'③ 英語 単語ひとつずつ'],['jp',0,'④ 日本語 意味のブロック']].forEach(([k,s,l])=>{let q=group(k,s),done=q.filter(x=>S.done[x.id]).length;html+=`<button class="light" data-kind="${k}" data-stage="${s}">${l}<div class="muted">${done}/${q.length}問 正解経験あり</div></button>`});html+='</div>';if(S.active && S.active.index<currentSet().length)html+=`<p><button class="green" id="resume">前回の続き（${S.active.index+1}問目から）</button></p>`;if(num)html+=`<p><button class="orange" id="retry">★ 間違えた問題を復習（${num}問）</button></p>`;html+='<p class="muted">同じ意味の文でも語順が複数正しい場合があります。この練習は表示されたモデル文の語順に合わせて組み立てます。</p>';$('app').innerHTML=html;$('fill').style.width='0%';document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>start(b.dataset.kind,Number(b.dataset.stage)));if($('retry'))$('retry').onclick=()=>retryMenu();if($('resume'))$('resume').onclick=render}
function retryMenu(){let miss=LESSONS.filter(q=>S.retry[q.id]);$('app').innerHTML=`<h2>復習したい練習</h2><p>${miss.length}問あります。</p><div class="homebuttons"></div><p><button class="light" id="backhome">戻る</button></p>`;let el=document.querySelector('.homebuttons');[['en',0,'英語 大きなブロック'],['en',1,'英語 小さなブロック'],['en',2,'英語 単語'],['jp',0,'日本語']].forEach(([k,s,l])=>{let n=miss.filter(q=>q.kind===k&&q.stage===s).length;if(n){let b=document.createElement('button');b.className='orange';b.textContent=`${l}（${n}問）`;b.onclick=()=>start(k,s,true);el.appendChild(b)}});$('backhome').onclick=home}
function render(){let q=currentSet(),a=S.active;if(!a||a.index>=q.length){finish();return}let item=q[a.index];locked=false;showHint=false;selected=[];work=shuffleBlocks(item.blocks,a.index+item.target.length+item.stage*13);let stageNames=['大きなブロック','小さなブロック','単語ひとつずつ'];$('fill').style.width=(100*a.index/q.length)+'%';$('app').innerHTML=`<div class="stats"><span>${item.kind==='en'?'英語':'日本語'}　${item.kind==='en'?stageNames[item.stage]:'意味のブロック'}</span><span>${a.index+1}/${q.length}問</span><span>今回の正解 ${a.correct}</span></div><h2 class="level">${item.kind==='en'?'日本語の意味を見て並べよう':'指定された役割の順に並べよう'}</h2><div class="subject">${escapeHTML(item.meaning)}</div><p class="muted">下のブロックを順にタップ。上の並びをタップすると戻せます。</p><div class="line built" id="built" aria-label="組み立てた文"></div><div class="line" id="tokens" aria-label="ブロックの選択肢"></div><div class="actions"><button class="light" id="hint">ヒント</button><button class="light" id="clear">やり直し</button><button class="blue" id="check">これで決定！</button></div><div id="note" aria-live="polite"></div><p><button class="light" id="backHome">コース選択へ戻る</button></p>`;$('hint').onclick=()=>{showHint=true;$('note').innerHTML=`<div class="hint">${escapeHTML(item.tip)}</div>`};$('clear').onclick=()=>{selected=[];draw()};$('check').onclick=check;$('backHome').onclick=home;draw()}
function draw(){let item=currentSet()[S.active.index];$('built').innerHTML=selected.map((n,i)=>`<button class="tile" data-remove="${i}">${escapeHTML(item.blocks[n])}</button>`).join('');$('tokens').innerHTML=work.map(b=>`<button class="tile" data-pick="${b.i}" ${selected.includes(b.i)?'disabled':''}>${escapeHTML(b.text)}</button>`).join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(locked)return;selected.push(Number(b.dataset.pick));draw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(locked)return;selected.splice(Number(b.dataset.remove),1);draw()});$('check').disabled=selected.length!==item.blocks.length||locked}
function norm(s){return s.replace(/[。．.？?\s]/g,'').toLowerCase()};function check(){let a=S.active,q=currentSet(),item=q[a.index];if(selected.length!==item.blocks.length)return;let got=selected.map(n=>item.blocks[n]).join(' '),ok=norm(got)===norm(item.blocks.join(' '));locked=true;S.done[item.id]=S.done[item.id]||ok;if(ok){a.correct++;delete S.retry[item.id]}else{S.retry[item.id]=true}a.index++;persist();document.querySelectorAll('[data-pick],[data-remove],#check,#clear').forEach(b=>b.disabled=true);$('note').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?'正解！ ブロックを組み立てられたね！':'おしい！ 次はここを意識しよう。'}<div class="hint">モデル文：${escapeHTML(item.target)}</div><div class="muted">${escapeHTML(item.tip)}</div></div><button class="green" id="next">${a.index>=q.length?'結果を見る':'次の問題へ →'}</button>`;$('next').onclick=render;try{window.dispatchEvent(new CustomEvent('boku:mascot-answer',{detail:{correct:ok}}))}catch(e){}}
function finish(){let a=S.active;if(!a){home();return}let q=group(a.kind,a.stage),count=a.correct;$('fill').style.width='100%';$('app').innerHTML=`<h2>コース終了！</h2><div class="subject">今回の正解　${count}問</div><p>間違えた問題は「復習」に残ります。正解できれば復習リストから外れます。</p><button class="green" id="return">コース選択へ戻る</button>`;$('return').onclick=home;S.active=null;persist()}if(S.active&&currentSet().length){render()}else home();</script><script src="study-ote.js?v=1" defer></script><script src="study-plush-league.js?v=2" defer></script><script src="study-sound.js?v=20261102" defer></script></body></html>
