<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二学期期末・技術｜苦手を見分けるクイズ</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#20354d;background:#eff7fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf8f1,#f8f5ff);min-height:100vh}main{max-width:760px;margin:auto;padding:16px 14px 55px}h1{font-size:clamp(25px,6vw,37px)}h2{font-size:25px}p{line-height:1.6}button,a{font:inherit}button{cursor:pointer}.back{display:inline-block;padding:11px 15px;background:white;border:2px solid #c9d6e4;border-radius:99px;color:#213e5b;text-decoration:none;font-weight:800}.panel{background:white;border-radius:24px;padding:20px;margin-top:18px;border:2px solid #d5e6f3}.unit{display:block;width:100%;text-align:left;background:#f2f8ff;color:#234667;border:2px solid #bed3e6;border-radius:16px;padding:15px;margin:12px 0;font-size:21px;font-weight:850}.unit small{display:block;font-size:15px;margin-top:5px}.heading{font-size:17px;font-weight:800;color:#43704f}.stem{font-size:clamp(24px,5vw,33px);line-height:1.55;font-weight:900}.answers{display:grid;gap:12px}.choice{width:100%;min-height:70px;text-align:left;background:#f8fbff;border:3px solid #cbdde9;color:#152b40;border-radius:16px;padding:14px;font-size:clamp(21px,4.6vw,27px);font-weight:850}.choice.selected{background:#fff0c8;border-color:#e9b948}.choice:disabled{opacity:.7}.primary{background:#1267bf;color:#fff;border:0;border-radius:16px;padding:15px 25px;font-weight:900;font-size:22px;margin-top:14px;width:100%;min-height:65px}.secondary{background:white;border:2px solid #8baac6;border-radius:15px;padding:12px;font-weight:800;font-size:18px}.notice{padding:14px;background:#f1f9ec;border-radius:15px;font-size:20px;line-height:1.65;margin:14px 0}.wrong{background:#fff2df}.feedback{font-size:21px;font-weight:750;line-height:1.6}.sound{margin:12px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sound button{border-radius:12px;border:2px solid #afc4d8;background:white;padding:10px;font-size:16px;font-weight:850}.bar{height:12px;background:#e0ebf0;border-radius:20px;margin:15px 0;overflow:hidden}.fill{height:100%;background:#5aa8a1}.pill{display:inline-block;padding:6px 10px;background:#e9f0ff;border-radius:100px;font-weight:850}.hidden{display:none!important}.sub{font-size:16px;color:#556b80}.row{display:flex;gap:9px;flex-wrap:wrap}.row button{flex:1}.mission{background:#fff6db;border-radius:15px;padding:12px;font-size:17px;font-weight:800;line-height:1.6}.progress{color:#30577a;font-weight:800;font-size:17px}@media(prefers-reduced-motion:no-preference){.unit:active,.choice:active{transform:scale(.99)}}

/* 2026-11-07 技術: 見て分かる答え合わせ、ぬいぐるみの復帰 */
.choice:disabled{opacity:1;color:#142c45}

.answerCompare .smallTitle{font-weight:900;color:#475569;font-size:16px}

#easyHint{background:#fff7d6;border-radius:13px;padding:12px;margin-top:9px;color:#293548;font-size:clamp(19px,4.5vw,23px);line-height:1.5;font-weight:800}

@media(max-width:390px){#mascotReaction img{height:72px;width:72px}#mascotReaction{font-size:17px}.mascotMini{font-size:10px}}

.unitGroup{margin:10px 0 16px;padding:4px;border-radius:18px;background:#e9f3ff;border:1px solid #cbd5e1}

#revealWritten{margin:12px 0}.unitGroup small{font-size:17px;display:block}
</style></head><body><main><a href="index.html" class="back">← テスト勉強基地へ</a><h1>🔧 二学期期末 技術</h1><p class="sub">教科書ワーク68〜74・94〜95ページをもとにした復習。読み間違えやすい言葉の違いも練習するよ。</p><div class="sound"><button id="soundToggle">🔊 効果音 ON</button><button id="voiceToggle">🗣️ 読み上げ OFF</button><span class="sub">読み上げはボタンを押した時だけ</span></div><div id="home" class="panel"><div class="mission">🧸 6人のなかまが、せいかいも間違い直しも応援するよ！</div><h2>今日はどこを攻略する？</h2><p class="mission">まちがえても減点なし！ 同じ問題をもう一度正解すると、スティーブ師匠が認定してくれるぞ。</p><div id="units"></div><p class="sub">※ 正解率は、この端末でこの更新版から解いた3択の結果です。以前の回答からは推測しません。</p><div class="row"><button class="secondary" id="retryMiss">🔥 間違えた問題だけ</button><button class="secondary" id="resume">▶ 続きから</button></div><p id="stats" class="sub"></p></div><div id="play" class="panel hidden"><div id="mascotBar" aria-label="応援しているぬいぐるみたち"><div class="mascotMini" data-mascot="さくちゃん"><img src="mascot-saku.jpg" alt="さくちゃん"><span>さくちゃん</span></div><div class="mascotMini" data-mascot="プンプン"><img src="mascot-hollow.jpg" alt="プンプン"><span>プンプン</span></div><div class="mascotMini" data-mascot="ハギー"><img src="mascot-huggy.jpg" alt="ハギー"><span>ハギー</span></div><div class="mascotMini" data-mascot="ポーグ"><img src="mascot-porg.jpg" alt="ポーグ"><span>ポーグ</span></div><div class="mascotMini" data-mascot="スティーブ師匠"><img src="mascot-steve.jpg" alt="スティーブ師匠"><span>スティーブ師匠</span></div><div class="mascotMini" data-mascot="ゲイリー"><img src="mascot-gary.jpg" alt="ゲイリー"><span>ゲイリー</span></div></div><button id="exit" class="secondary">← 単元にもどる</button><p class="heading" id="unitName"></p><p class="progress" id="counter"></p><div class="bar"><div id="fill" class="fill"></div></div><div class="stem" id="stem"></div><div class="answers" id="answers"></div><div id="writtenArea" class="hidden"><label for="writtenInput" class="writingLabel">答えを思い出して、書くか声に出してみよう</label><textarea id="writtenInput" rows="2" placeholder="短い言葉でもOK。紙に書いた場合は入力しなくてOK"></textarea><button id="revealWritten" class="primary">答えを見て確認する</button><div id="writtenResult" class="hidden"><div class="writtenAnswer" id="writtenAnswer"></div><p class="sub" id="writtenTip"></p><div class="row"><button id="wroteWell" class="primary">書けた・言えた！</button><button id="writeAgain" class="secondary">まだ練習する</button></div></div></div><button id="check" class="primary" disabled>これで決定！</button><div id="feedback" class="notice hidden" role="status"></div><button id="next" class="primary hidden">つぎの問題へ ➜</button></div><div id="done" class="panel hidden"><h2>🎁 おつかれさま！</h2><p id="summary" class="feedback"></p><div class="row"><button id="again" class="secondary">もう一回</button><button id="backHome" class="primary">単元を選ぶ</button></div></div></main><div id="resultToast" class="hidden" role="status" aria-live="polite"></div><script>
'use strict';const QUESTIONS=[{"unit":"エネルギー変換・発電のしくみ","q":"エネルギーの形を目的に合わせて変える技術は？","opts":["エネルギー変換の技術","発電所の送電","電気の絶縁"],"a":0,"hint":"「形を変える」のがヒント。","tip":"エネルギー変換＝エネルギーの姿を変えること。たとえば電気を光に変える。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"ほかのエネルギーから電気エネルギーを得ることは？","opts":["送電","発電","配電"],"a":1,"hint":"「電気をつくる」ほう。","tip":"発電は「電気をつくる」。送電は「遠くへ送る」。配電は「家に分ける」。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"発電機でコイルや磁石を動かし電流が流れる現象は？","opts":["電磁誘導","電気分解","熱伝導"],"a":0,"hint":"磁石とコイルが関係する。","tip":"電磁誘導は、磁石とコイルを動かすと電気が生まれること。電気分解は、電気で物質を分けること。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"発電機で、主に変換されるエネルギーは？","opts":["電気→運動","運動→電気","光→熱"],"a":1,"hint":"発電機は電気をつくる。","tip":"発電機は運動エネルギー→電気エネルギー。モータは逆で電気→運動。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"エネルギー変換のとき、目的以外に出てしまうことがあるエネルギーは？","opts":["熱エネルギー","位置エネルギーだけ","必ず電気エネルギー"],"a":0,"hint":"機械が温かくなるのはなぜ？","tip":"目的外の熱や音などが生じるため、入力を全部役立てるのは難しい。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"エネルギー変換効率の式は？","opts":["供給エネルギー÷有効利用エネルギー×100","有効利用エネルギー÷供給エネルギー×100","有効利用エネルギー＋供給エネルギー"],"a":1,"hint":"利用できた分を、もとの全体で割る。","tip":"効率＝役立った分÷入れた分×100％。分子が「役立った分」だよ。","level":"calc"},{"unit":"エネルギー変換・発電のしくみ","q":"元のエネルギーを100％すべて有効利用することは？","opts":["いつでも可能","原則として不可能","発電所では必ず可能"],"a":1,"hint":"目的外の熱や音が出る。","tip":"実際には熱などの損失が生じるため、100％すべてを利用することはできない。","level":"basic"},{"unit":"エネルギー変換・発電のしくみ","q":"入力が100J、有効利用が40Jの変換効率は？","opts":["40％","60％","250％"],"a":0,"hint":"有効利用÷入力×100。","tip":"効率＝使えた分÷最初の分×100。40÷100×100＝40％。","level":"calc"},{"unit":"エネルギー変換・発電のしくみ","q":"入力が200J、有効利用が150Jの変換効率は？","opts":["25％","75％","150％"],"a":1,"hint":"150を200で割る。","tip":"効率＝使えた分÷最初の分×100。150÷200×100＝75％。","level":"calc"},{"unit":"エネルギー変換・発電のしくみ","q":"同じ電気をつくるとき、変換効率が高いとは？","opts":["目的に使えるエネルギーの割合が大きい","消費エネルギーが必ずゼロ","発電機が大きい"],"a":0,"hint":"「何％役に立ったか」の話。","tip":"効率が高い＝無駄に変わる割合が比較的小さい。","level":"basic"},{"unit":"発電方法の長所・短所","q":"火力発電が主に利用するエネルギー源は？","opts":["石炭・石油・天然ガス","風","水の落下"],"a":0,"hint":"燃料を燃やして蒸気でタービンを回す。","tip":"火力は燃料を燃やす。風力は風、水力は水。","level":"basic"},{"unit":"発電方法の長所・短所","q":"火力発電の短所として正しいのは？","opts":["発電時に二酸化炭素が出る","夜に発電できない","必ずダムが必要"],"a":0,"hint":"燃料を燃やすと出る気体を考える。","tip":"火力は燃料を燃やすので二酸化炭素を排出する。太陽光の「夜は発電しにくい」と混同しない。","level":"basic"},{"unit":"発電方法の長所・短所","q":"原子力発電の特徴として正しいのは？","opts":["発電時に燃焼でCO₂を大量に出す","使用済み核燃料の処分が課題","風が弱いと停止する"],"a":1,"hint":"燃料の「使用後」に注目。","tip":"原子力は使用済み核燃料の処分や事故時の安全確保が課題。","level":"basic"},{"unit":"発電方法の長所・短所","q":"水力発電の短所として正しいのは？","opts":["大量の化石燃料が必要","ダム建設による環境への影響がある","光がないと使えない"],"a":1,"hint":"川やダムの自然環境を考える。","tip":"水力はダムなどの環境影響に注意。太陽光の欠点と混ぜない。","level":"basic"},{"unit":"発電方法の長所・短所","q":"地熱発電が利用するのは？","opts":["地中の熱","風の力","波の高さだけ"],"a":0,"hint":"「地熱」という漢字を分ける。","tip":"地熱＝地面の下の熱。","level":"basic"},{"unit":"発電方法の長所・短所","q":"地熱発電の課題は？","opts":["どこでも同じ条件で作れる","開発できる場所が限られ、費用もかかる","発電中は必ずCO₂を大量に出す"],"a":1,"hint":"地下の熱が利用できる場所は限られる。","tip":"地熱は立地条件と建設費、自然環境との調整などが課題。","level":"basic"},{"unit":"発電方法の長所・短所","q":"風力発電の短所として正しいのは？","opts":["風の強さで発電量が変わる","石炭の燃焼が必須","夜は絶対に発電できない"],"a":0,"hint":"天候の何が影響する？","tip":"風力＝風で変動。太陽光＝日射で変動。","level":"basic"},{"unit":"発電方法の長所・短所","q":"太陽光発電の短所として正しいのは？","opts":["日射量で発電量が変わる","常に大量の燃料が必要","すべての場所で地熱を必要とする"],"a":0,"hint":"日差しを想像しよう。","tip":"太陽光は日射量に左右される。風力は風速に左右される。","level":"basic"},{"unit":"発電方法の長所・短所","q":"バイオマス発電に使うものは？","opts":["生物由来の資源","地下のウランだけ","電池の充電だけ"],"a":0,"hint":"「バイオ」は生物の意味。","tip":"バイオマスは木材や生ごみなど、生物に由来する資源。","level":"basic"},{"unit":"発電方法の長所・短所","q":"バイオマス発電の課題の一つは？","opts":["安定した燃料の調達","風の向きだけ","発電すると必ず日陰になる"],"a":0,"hint":"燃料を「集める」ことを考える。","tip":"燃料の収集・運搬・安定調達が課題。","level":"basic"},{"unit":"発電方法の長所・短所","q":"発電時に燃料を燃やさないものは？","opts":["火力発電","風力発電","バイオマス発電"],"a":1,"hint":"風が羽根を回す。","tip":"風力は風の運動を利用。火力や燃焼方式のバイオマスとは違う。","level":"basic"},{"unit":"発電方法の長所・短所","q":"「安定した電力供給」が比較的しやすい方式は？","opts":["火力発電","太陽光発電","風力発電"],"a":0,"hint":"天気に左右されにくいのは？","tip":"火力は出力調整がしやすい。一方、太陽光と風力は天候に左右されやすい。","level":"basic"},{"unit":"発電方法の長所・短所","q":"日本の2022年の一次エネルギー供給で約83.5％を占めたのは？","opts":["化石燃料","原子力","水力だけ"],"a":0,"hint":"写真のワーク下段の数値。","tip":"教科書資料にある2022年の値。83.5％は化石燃料（石炭・石油・天然ガス）。","level":"basic"},{"unit":"直流・交流と送電","q":"乾電池から流れる電気は？","opts":["交流","直流","電磁誘導"],"a":1,"hint":"向きが変わらない電流。","tip":"直流は電流の向きが変わらない。乾電池を思い出そう。","level":"basic"},{"unit":"直流・交流と送電","q":"家庭のコンセントから供給される電気は？","opts":["直流","交流","静電気"],"a":1,"hint":"発電所から送られる電気。","tip":"交流は電流の向きがくり返し変わる。家のコンセントを思い出そう。","level":"basic"},{"unit":"直流・交流と送電","q":"交流の特徴は？","opts":["電流の向きが周期的に変わる","電流の向きが一定","電流がまったく流れない"],"a":0,"hint":"直流との違いは向き。","tip":"直流＝向き一定、交流＝向きが周期的に変わる。","level":"basic"},{"unit":"直流・交流と送電","q":"東日本の商用交流電源の周波数は？","opts":["50Hz","60Hz","100Hz"],"a":0,"hint":"西日本より10少ない。","tip":"東日本はおもに50Hz。西日本はおもに60Hz。","level":"basic"},{"unit":"直流・交流と送電","q":"西日本の商用交流電源の周波数は？","opts":["50Hz","60Hz","120Hz"],"a":1,"hint":"東日本より10多い。","tip":"西日本はおもに60Hz。東日本はおもに50Hz。","level":"basic"},{"unit":"直流・交流と送電","q":"周波数の単位は？","opts":["V","W","Hz"],"a":2,"hint":"1秒あたりの繰り返し回数。","tip":"Hz＝ヘルツ。V＝電圧、W＝電力。","level":"basic"},{"unit":"直流・交流と送電","q":"交流の電圧を簡単に上げ下げできる機器は？","opts":["変圧器","乾電池","抵抗器"],"a":0,"hint":"送電する途中で電圧を変える。","tip":"変圧器は電圧を上げたり下げたりする機械。「圧」を変える！","level":"basic"},{"unit":"直流・交流と送電","q":"ACアダプタは、家庭の交流を機器で使う何に変えるものが多い？","opts":["直流","交流のままだけ","磁力"],"a":0,"hint":"スマホなどは直流を使う。","tip":"直流は電流の向きが変わらない。乾電池を思い出そう。","level":"basic"},{"unit":"直流・交流と送電","q":"発電所から変電所まで電気を送ることは？","opts":["送電","配電","発電"],"a":0,"hint":"つくる→送る→家庭に分ける。","tip":"送電は電気を遠くまで送ること。配電は家や学校へ分けて届けること。","level":"basic"},{"unit":"直流・交流と送電","q":"変電所から家庭や工場に電気を配ることは？","opts":["発電","配電","変換効率"],"a":1,"hint":"家庭に「配る」ほう。","tip":"配電は電気を家や学校に分けること。送電は遠くまで送ること。","level":"basic"},{"unit":"直流・交流と送電","q":"高い電圧で送電する主な理由は？","opts":["送電中の電力損失を減らすため","電気の速さをゼロにするため","必ず電流を大きくするため"],"a":0,"hint":"同じ電力なら電圧を上げると電流は小さくなる。","tip":"高電圧にすると同じ電力では電流が小さくなり、送電線での熱損失を減らせる。","level":"basic"},{"unit":"直流・交流と送電","q":"家庭のコンセントに多く使われる電圧は？","opts":["5V","100V","1000V"],"a":1,"hint":"写真の配電図にも書いてある。","tip":"日本の一般的な家庭用コンセントは100V（200Vの回路もある）。","level":"basic"},{"unit":"電気機器のエネルギー変換","q":"白熱電球で光る主な部分は？","opts":["フィラメント","コイルばねだけ","乾電池 let audio;function ping(ok){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const start=audio.currentTime;let notes=ok?[660,880,1100]:[310,260];notes.forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.001,start+i*.1);g.gain.exponentialRampToValueAtTime(.15,start+i*.1+.015);g.gain.exponentialRampToValueAtTime(.001,start+i*.1+.11);o.connect(g).connect(audio.destination);o.start(start+i*.1);o.stop(start+i*.1+.12)})}catch(e){}}

function getUnitRate(u){const vals=QUESTIONS.map((q,i)=>q.unit===u?(saved.unitAttempts[i]||null):null).filter(Boolean);const total=vals.reduce((n,v)=>n+(v.total||0),0),correct=vals.reduce((n,v)=>n+(v.correct||0),0);return total?Math.round(correct/total*100)+'％（'+correct+'/'+total+'回）':'未学習'}

 showToast(correct);area.classList.remove('hidden');
 setTimeout(()=>{if(!$('feedback').classList.contains('hidden'))area.scrollIntoView({behavior:'smooth',block:'nearest'})},100);
}
$('check').onclick=()=>{if(chosen<0)return;
 const id=current[at],x=QUESTIONS[id],correct=chosen===x.a,wasMiss=!!saved.missed[id];
 recordAttempt(id,correct,false);if(correct){sessionCorrect++;saved.solved[id]=Date.now();delete saved.missed[id]}else{saved.missed[id]=(saved.missed[id]||0)+1}
 ping(correct);save();
 const who=wasMiss&&correct?'スティーブ師匠':voices[(at+id)%voices.length];
 document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.classList.toggle('selected',false);b.classList.toggle('my-answer',i===chosen);b.classList.toggle('correct-answer',i===x.a)});
 showFeedback(x,chosen,correct,wasMiss,who);
 $('check').classList.add('hidden');$('next').classList.remove('hidden');
 const message=correct?'せいかい！ '+who+'、やったね！':'おっと！ きみが選んだのは '+x.opts[chosen]+'。正解は '+x.opts[x.a]+'。'+x.tip;
 say(message);saveSession()}

$('revealWritten').onclick=()=>{if(mode!=='written')return;const id=current[at],q=QUESTIONS[id];$('writtenAnswer').textContent='正解：'+q.opts[q.a];$('writtenTip').textContent='覚え方：'+q.tip;$('writtenResult').classList.remove('hidden');$('revealWritten').classList.add('hidden')};
function markWritten(ok){if(mode!=='written'||$('writtenResult').classList.contains('hidden'))return;const id=current[at],q=QUESTIONS[id];recordAttempt(id,ok,true);if(ok)sessionCorrect++;if(!ok)saved.missed[id]=(saved.missed[id]||0)+1;saveSession();$('writtenResult').classList.add('hidden');$('writtenArea').classList.add('hidden');const who=ok?'スティーブ師匠':'ゲイリー';const pic=mascotPictures[who];$('feedback').replaceChildren();let reaction=el('div','');reaction.id='mascotReaction';let im=el('img');im.src=pic;im.alt=who;reaction.append(im,el('div','',ok?'書けた！ 修行成功！':'ここはまた練習しよう！'));$('feedback').append(reaction,el('div','writtenAnswer','正解：'+q.opts[q.a]),el('div','',q.tip));$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');ping(ok);say(ok?'書けた！ やったね！':'もう一回覚えれば大丈夫。'+q.tip)}
$('wroteWell').onclick=()=>markWritten(true);$('writeAgain').onclick=()=>markWritten(false);
$('next').onclick=()=>{at++;if(at>=current.length)finish();else renderQuestion()};function finish(){saved.session=null;save();$('summary').textContent=current.length+'問中 '+sessionCorrect+(mode==='written'?'問「書けた・言えた」！':'問正解！')+' 間違えた問題は「間違えた問題だけ」で何度でも復習できるよ。';show('done')};$('exit').onclick=()=>{renderHome();show('home')};$('backHome').onclick=()=>{renderHome();show('home')};$('again').onclick=()=>start(current,mode,originalUnit);$('retryMiss').onclick=()=>{let ids=Object.keys(saved.missed).map(Number).filter(i=>i>=0&&i<QUESTIONS.length);if(ids.length)start(ids,'miss','間違い直し')};$('resume').onclick=restore;renderHome();
